plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace = 'com.sentinel.quantum'
    compileSdk 37

    defaultConfig {
        applicationId "com.sentinel.quantum"
        minSdk 24
        targetSdk 36
        versionCode 7
        versionName "1.0.6"
        buildConfigField "String", "WANGIRI_API_BASE_URL", '"https://sentinel-moteur-api.onrender.com"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    def releaseKeystoreFile = System.getenv('KEYSTORE_FILE')
    def releaseKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('KEY_ALIAS')
    def releaseKeyPassword = System.getenv('KEY_PASSWORD')
    def releaseSigningConfigured = [releaseKeystoreFile, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Unsigned variant used to prove that an Android App Bundle compiles and
        // packages correctly (e.g. for Play Console dry-runs) before real release
        // signing secrets are available. It intentionally never applies a
        // signingConfig, so it must never be treated as a publishable artifact.
        releaseUnsigned {
            initWith release
            // initWith copies every build-type property, including signingConfig.
            // Clear it explicitly so this validation-only variant stays unsigned even
            // on a developer/CI machine where production signing variables are present.
            signingConfig = null
            matchingFallbacks = ['release']
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseSigningConfigured = ['KEYSTORE_FILE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].every { System.getenv(it) }
    // Only tasks for the signed "release" build type (assembleRelease, bundleRelease, ...)
    // are gated on signing secrets. Tasks for the "releaseUnsigned" build type
    // (assembleReleaseUnsigned, bundleReleaseUnsigned, ...) are intentionally exempt
    // because that variant never applies a signingConfig and is not publishable.
    def requiresSignedRelease = graph.allTasks.any { it.name ==~ /(?i).*Release$/ }
    if (requiresSignedRelease && !releaseSigningConfigured) {
        throw new GradleException('Release signing requires KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD environment variables.')
    }
}

dependencies {
    implementation project(':wearable-security')
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.10.2'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'

    def roomVersion = '3.0.2'
    implementation "androidx.room3:room3-runtime:$roomVersion"
    implementation 'androidx.sqlite:sqlite-framework:2.6.2'
    ksp "androidx.room3:room3-compiler:$roomVersion"

    implementation 'com.rometools:rome:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'io.livekit:livekit-android:2.29.0'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation testFixtures(project(':wearable-security'))
    // JVM implementation used by local unit tests; Android's org.json classes are runtime stubs on the host JVM.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

// Release-evidence native dependency graph. This is intentionally generated from
// the resolved releaseRuntimeClasspath rather than declared dependencies so the
// evidence reflects the dependency graph actually selected by Gradle.
tasks.register('exportReleaseDependencyInventory') {
    group = 'verification'
    description = 'Exports the resolved Android release dependency graph for release evidence.'

    def outputFile = layout.buildDirectory.file('reports/release-dependencies.json')
    outputs.file(outputFile)

    doLast {
        def configuration = configurations.findByName('releaseRuntimeClasspath')
        if (configuration == null || !configuration.canBeResolved) {
            throw new GradleException('releaseRuntimeClasspath configuration is unavailable or not resolvable')
        }

        def resolution = configuration.incoming.resolutionResult
        def componentKey = { id ->
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                return "pkg:maven/${id.group}/${id.module}@${id.version}"
            }
            if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                return "gradle-project:${id.buildTreePath}"
            }
            return "component:${id.displayName}"
        }

        def components = resolution.allComponents.collect { component ->
            def id = component.id
            def record = [
                key: componentKey(id),
                display_name: id.displayName
            ]
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                record.type = 'module'
                record.group = id.group
                record.name = id.module
                record.version = id.version
                record.purl = record.key
            } else if (id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier) {
                record.type = 'project'
                record.project_path = id.projectPath
                record.build_tree_path = id.buildTreePath
            } else {
                record.type = 'component'
            }
            record
        }.sort { a, b -> a.key <=> b.key }

        def keys = components.collect { it.key } as Set
        if (keys.size() != components.size()) {
            throw new GradleException('Resolved dependency graph contains duplicate component keys')
        }

        def unresolved = []
        def relationships = []
        resolution.allDependencies.each { dependency ->
            if (dependency instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) {
                def from = componentKey(dependency.from.id)
                def to = componentKey(dependency.selected.id)
                if (!keys.contains(from) || !keys.contains(to)) {
                    throw new GradleException("Dependency edge references an unknown component: ${from} -> ${to}")
                }
                relationships << [
                    from: from,
                    to: to,
                    requested: dependency.requested.displayName,
                    constraint: dependency.constraint
                ]
            } else if (dependency instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                unresolved << [
                    from: componentKey(dependency.from.id),
                    requested: dependency.requested.displayName,
                    failure: (dependency.failure?.message ?: 'resolution failed').take(1024)
                ]
            } else {
                unresolved << [
                    from: componentKey(dependency.from.id),
                    requested: dependency.requested.displayName,
                    failure: 'unsupported dependency result type'
                ]
            }
        }
        if (!unresolved.isEmpty()) {
            throw new GradleException(
                'Unresolved release dependencies: ' +
                    groovy.json.JsonOutput.toJson(unresolved)
            )
        }

        relationships = relationships
            .unique { relationship ->
                groovy.json.JsonOutput.toJson([
                    relationship.from,
                    relationship.to,
                    relationship.requested,
                    relationship.constraint
                ])
            }
            .sort { a, b ->
                groovy.json.JsonOutput.toJson([a.from, a.to, a.requested, a.constraint]) <=>
                    groovy.json.JsonOutput.toJson([b.from, b.to, b.requested, b.constraint])
            }

        def payload = [
            schema_version: 2,
            configuration: 'releaseRuntimeClasspath',
            root_component: componentKey(resolution.root.id),
            component_count: components.size(),
            relationship_count: relationships.size(),
            components: components,
            relationships: relationships
        ]

        if (payload.component_count < 1 || payload.relationship_count < 1) {
            throw new GradleException('Resolved release dependency graph is unexpectedly empty')
        }

        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(
            groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(payload)) +
                System.lineSeparator(),
            'UTF-8'
        )
        logger.lifecycle(
            "Release dependency graph: ${target} " +
                "(${payload.component_count} components, ${payload.relationship_count} relationships)"
        )
    }
}

