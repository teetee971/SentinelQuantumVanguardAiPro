plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.sentinel.quantum'
    compileSdk 37

    defaultConfig {
        applicationId "com.sentinel.quantum"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    def releaseKeystoreFile = System.getenv('KEYSTORE_FILE')
    def releaseKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('KEY_ALIAS')
    def releaseKeyPassword = System.getenv('KEY_PASSWORD')
    def releaseSigningConfigured = [releaseKeystoreFile, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

    if (releaseSigningConfigured) {
        signingConfigs {
            release {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (releaseSigningConfigured) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        // Unsigned variant used to prove that an Android App Bundle compiles and
        // packages correctly (e.g. for Play Console dry-runs) before real release
        // signing secrets are available. It intentionally never applies a
        // signingConfig, so it must never be treated as a publishable artifact.
        releaseUnsigned {
            initWith release
            matchingFallbacks = ['release']
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseSigningConfigured = ['KEYSTORE_FILE', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].every { System.getenv(it) }
    // Only tasks for the signed "release" build type (assembleRelease, bundleRelease, ...)
    // are gated on signing secrets. Tasks for the "releaseUnsigned" build type
    // (assembleReleaseUnsigned, bundleReleaseUnsigned, ...) are intentionally exempt
    // because that variant never applies a signingConfig and is not publishable.
    def requiresSignedRelease = graph.allTasks.any { it.name ==~ /(?i).*Release$/ }
    if (requiresSignedRelease && !releaseSigningConfigured) {
        throw new GradleException('Release signing requires KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD environment variables.')
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.10.0'

    implementation 'com.rometools:rome:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
