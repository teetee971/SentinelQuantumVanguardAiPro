plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.sentinel.quantum.wear'
    compileSdk 37

    defaultConfig {
        // Data Layer requires the handheld and Wear OS apps to share package identity/signature.
        applicationId "com.sentinel.quantum"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "1.0.9"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
