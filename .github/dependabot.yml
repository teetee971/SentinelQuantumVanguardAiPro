version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "05:20"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:35"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/native-android-app"
    schedule:
      interval: daily
      time: "05:50"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
