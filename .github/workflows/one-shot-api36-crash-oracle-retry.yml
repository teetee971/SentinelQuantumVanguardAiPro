name: One-shot API36 crash oracle retry

on:
  push:
    branches: [fix/api37-incoming-answer-sync]
    paths:
      - '.github/workflows/one-shot-api36-crash-oracle-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/api37-incoming-answer-sync
      - name: Patch unreadable logcat retry and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('scripts/phone-core-emulator-revocation-flow.sh')
          text = path.read_text()
          old = '''assert_no_crash() {
            local brief_output=""
            local brief_status=0
            set +e
            brief_output="$(adb logcat -d -v brief)"
            brief_status=$?
            set -e
            if [[ "$brief_status" -ne 0 ]]; then
              echo "Crash oracle is unreadable; cannot qualify crash-free state." >&2
              return 1
            fi
            if ! python3 "$SCRIPT_DIR/phone-core-logcat-crash-oracle.py" /dev/stdin <<< "$brief_output"; then
              adb logcat -d -v time | tail -n 400 || true
              return 1
            fi
            return 0
          }
          '''
          new = '''assert_no_crash() {
            local brief_output=""
            local brief_status=0
            local max_read_attempts=3
            for attempt in $(seq 1 "$max_read_attempts"); do
              set +e
              brief_output="$(adb logcat -d -v brief)"
              brief_status=$?
              set -e
              if [[ "$brief_status" -eq 0 ]]; then
                if ! python3 "$SCRIPT_DIR/phone-core-logcat-crash-oracle.py" /dev/stdin <<< "$brief_output"; then
                  adb logcat -d -v time | tail -n 400 || true
                  return 1
                fi
                return 0
              fi
              if [[ "$attempt" -lt "$max_read_attempts" ]]; then
                sleep 1
              fi
            done
            echo "Crash oracle is unreadable after ${max_read_attempts} bounded attempts; cannot qualify crash-free state." >&2
            return 1
          }
          '''
          if old not in text:
              raise SystemExit('assert_no_crash replacement anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          node --test security/phone-intelligence/phone-core-ui-selector.test.js
          npm run test:phone-intelligence
          npm run test:android-product-truth
          git diff --check
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'teetee971'
          git config user.email 'thierrynaud2009@gmail.com'
          git add scripts/phone-core-emulator-revocation-flow.sh
          git commit -m 'fix(phone-core): retry transient unreadable crash oracle'
          git push origin HEAD:fix/api37-incoming-answer-sync
