name: Sentinel Isolation Security Gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: Block cross-project and forbidden SDK contamination
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run repository-wide isolation scanner
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-sentinel-isolation.js

      - name: Run independent source-control isolation gate
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='google-services\\.json|googleservice-info\\.plist|com\\.google\\.firebase|firebase-messaging|firebase-admin|firebase-functions|@firebase/|@react-native-firebase/|FIREBASE_[A-Z0-9_]*|firebaseConfig'
          EXCLUDES=(
            ':!scripts/check-sentinel-isolation.js'
            ':!scripts/check-sentinel-isolation.test.js'
            ':!.github/workflows/sentinel-isolation.yml'
            ':!.github/workflows/security-validation.yml'
          )
          if git grep -nEi -- "$PATTERN" -- '*.js' '*.mjs' '*.cjs' '*.json' '*.yml' '*.yaml' '*.ts' '*.tsx' '*.jsx' '*.html' '*.css' '*.xml' '*.properties' '*.gradle' '*.kts' '*.kt' '*.toml' '*.lock' "${EXCLUDES[@]}"; then
            echo '::error::Forbidden external SDK/configuration reference detected.'
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)(google-services\\.json|googleservice-info\\.plist)$'; then
            echo '::error::Forbidden SDK configuration filename detected.'
            exit 1
          fi
          echo 'Independent isolation gate passed.'
