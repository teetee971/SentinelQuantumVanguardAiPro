name: Android Instrumentation

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Compose instrumentation — ${{ matrix.android-version }} / API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 36
            sdk_package_level: '36'
            android-version: Android 16
          - api-level: 37
            sdk_package_level: '37.0'
            android-version: Android 17
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Run connected Android tests
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api-level }}
          SDK_PACKAGE_LEVEL: ${{ matrix.sdk_package_level }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          SYSTEM_IMAGE="system-images;android-${SDK_PACKAGE_LEVEL};google_apis;x86_64"
          PLATFORM="platforms;android-${SDK_PACKAGE_LEVEL}"
          AVD_NAME="sentinel_instrumentation_api${API_LEVEL}"
          EMULATOR_LOG="$RUNNER_TEMP/sentinel-instrumentation-api${API_LEVEL}-emulator.log"

          echo "Qualifying runtime API ${API_LEVEL} with SDK package level ${SDK_PACKAGE_LEVEL}."

          SDK_PACKAGES=("emulator" "$PLATFORM" "$SYSTEM_IMAGE")
          SDK_READY=0
          for attempt in 1 2 3; do
            if timeout 600s sdkmanager "${SDK_PACKAGES[@]}"; then
              SDK_READY=1
              break
            fi
            echo "Android SDK package installation failed on attempt ${attempt} for API ${API_LEVEL}; cleaning partial emulator payloads."
            rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          if [[ "$SDK_READY" != "1" ]]; then
            echo "Unable to install Android emulator packages for API ${API_LEVEL} (SDK package ${SDK_PACKAGE_LEVEL})."
            sdkmanager --list | grep -E "android-${API_LEVEL}|android-${SDK_PACKAGE_LEVEL}" || true
            exit 1
          fi

          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64/package.xml"
          timeout 60s bash -c "echo 'no' | avdmanager create avd --force --name '${AVD_NAME}' --package '${SYSTEM_IMAGE}'"

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot-load -no-snapshot-save \
            "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          DEVICE_READY=0
          for _ in $(seq 1 90); do
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }'; then
              DEVICE_READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android API ${API_LEVEL} emulator exited before becoming available to adb."
              cat "$EMULATOR_LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$DEVICE_READY" != "1" ]]; then
            echo "Android API ${API_LEVEL} emulator did not become available to adb within 180 seconds."
            adb devices -l || true
            cat "$EMULATOR_LOG"
            exit 1
          fi

          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android API ${API_LEVEL} emulator exited before boot completion."
              cat "$EMULATOR_LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            echo "Android API ${API_LEVEL} emulator did not finish booting."
            cat "$EMULATOR_LOG"
            exit 1
          fi

          ACTUAL_API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ACTUAL_RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
          ACTUAL_CODENAME="$(adb shell getprop ro.build.version.codename | tr -d '\r')"
          echo "Emulator ready: Android ${ACTUAL_RELEASE} (${ACTUAL_CODENAME}), API ${ACTUAL_API}."
          if [[ "$ACTUAL_API" != "$API_LEVEL" ]]; then
            echo "Expected emulator API ${API_LEVEL}, got API ${ACTUAL_API}."
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-Instrumentation-API${{ matrix.api-level }}-${{ github.sha }}
          path: |
            native-android-app/app/build/reports/androidTests/connected/
            native-android-app/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/sentinel-instrumentation-api${{ matrix.api-level }}-emulator.log
          if-no-files-found: warn
          retention-days: 14
