name: Android Instrumentation

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-tests:
    name: Compose instrumentation — ${{ matrix.android-version }} / API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            sdk_package_level: '24'
            android-version: Android 7.0
          - api-level: 29
            sdk_package_level: '29'
            android-version: Android 10
          - api-level: 36
            sdk_package_level: '36'
            android-version: Android 16
          - api-level: 37
            sdk_package_level: '37.0'
            android-version: Android 17
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source head
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Run connected Android tests
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api-level }}
          SDK_PACKAGE_LEVEL: ${{ matrix.sdk_package_level }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          SYSTEM_IMAGE="system-images;android-${SDK_PACKAGE_LEVEL};google_apis;x86_64"
          PLATFORM="platforms;android-${SDK_PACKAGE_LEVEL}"
          AVD_NAME="sentinel_instrumentation_api${API_LEVEL}"
          EMULATOR_LOG="$RUNNER_TEMP/sentinel-instrumentation-api${API_LEVEL}-emulator.log"
          INSTRUMENTATION_LOG="$RUNNER_TEMP/sentinel-instrumentation-api${API_LEVEL}-tests.log"

          echo "Qualifying runtime API ${API_LEVEL} with SDK package level ${SDK_PACKAGE_LEVEL}."

          SDK_PACKAGES=("emulator" "$PLATFORM" "$SYSTEM_IMAGE")
          SDK_READY=0
          for attempt in 1 2 3; do
            if timeout 600s sdkmanager "${SDK_PACKAGES[@]}"; then
              SDK_READY=1
              break
            fi
            echo "Android SDK package installation failed on attempt ${attempt} for API ${API_LEVEL}; cleaning partial emulator payloads."
            rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          if [[ "$SDK_READY" != "1" ]]; then
            echo "Unable to install Android emulator packages for API ${API_LEVEL} (SDK package ${SDK_PACKAGE_LEVEL})."
            sdkmanager --list | grep -E "android-${API_LEVEL}|android-${SDK_PACKAGE_LEVEL}" || true
            exit 1
          fi

          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64/package.xml"
          timeout 60s bash -c "echo 'no' | avdmanager create avd --force --name '${AVD_NAME}' --package '${SYSTEM_IMAGE}'"

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi

          DIAGNOSTICS="$RUNNER_TEMP/sentinel-instrumentation-api${API_LEVEL}-diagnostics"
          EMULATOR_PID=""
          collect_instrumentation_diagnostics() {
            mkdir -p "$DIAGNOSTICS"
            adb devices -l > "$DIAGNOSTICS/adb-devices.txt" 2>&1 || true
            adb shell getprop > "$DIAGNOSTICS/device-properties.txt" 2>&1 || true
            adb shell dumpsys activity top > "$DIAGNOSTICS/activity-top.txt" 2>&1 || true
            adb shell dumpsys activity processes > "$DIAGNOSTICS/activity-processes.txt" 2>&1 || true
            adb shell dumpsys telecom > "$DIAGNOSTICS/telecom.txt" 2>&1 || true
            adb shell dumpsys role > "$DIAGNOSTICS/roles.txt" 2>&1 || true
            adb shell dumpsys package com.sentinel.quantum > "$DIAGNOSTICS/package.txt" 2>&1 || true
            adb shell pm list instrumentation > "$DIAGNOSTICS/instrumentation-runners.txt" 2>&1 || true
            adb logcat -d -v threadtime > "$DIAGNOSTICS/logcat.txt" 2>&1 || true
          }
          summarize_instrumentation_reports() {
            REPORT_ROOT="app/build/outputs/androidTest-results/connected" API_LEVEL="$API_LEVEL" INSTRUMENTATION_LOG="$INSTRUMENTATION_LOG" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.REPORT_ROOT;
          const api = process.env.API_LEVEL;
          const escapeCommand = value => String(value).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          const decodeXml = value => String(value)
            .replaceAll('&quot;', '"')
            .replaceAll('&apos;', "'")
            .replaceAll('&lt;', '<')
            .replaceAll('&gt;', '>')
            .replaceAll('&amp;', '&');
          const compact = value => decodeXml(String(value ?? ''))
            .replace(/<!\[CDATA\[/g, '')
            .replace(/\]\]>/g, '')
            .replace(/<[^>]+>/g, ' ')
            .replace(/\s+/g, ' ')
            .trim()
            .slice(0, 1200);
          const emit = message => console.log(`::error title=Android instrumentation failure::${escapeCommand(message)}`);
          const files = [];
          const walk = directory => {
            if (!fs.existsSync(directory)) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.xml')) files.push(full);
            }
          };
          walk(root);
          if (files.length === 0) {
            emit(`API ${api}: instrumentation reports missing; no XML failure detail available`);
            const log = process.env.INSTRUMENTATION_LOG;
            if (log && fs.existsSync(log)) {
              const tail = fs.readFileSync(log, 'utf8').split(/\r?\n/).filter(Boolean).slice(-40).join('\n');
              if (tail) emit(`API ${api}: AndroidJUnitRunner tail:\n${tail}`);
            }
            process.exit(0);
          }
          const findings = [];
          for (const file of files) {
            const xml = fs.readFileSync(file, 'utf8');
            for (const match of xml.matchAll(/<testcase\b[^>]*\bname="([^"]*)"[^>]*>([\s\S]*?)<\/testcase\s*>/g)) {
              const failure = match[2].match(/<(failure|error)\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:failure|error)\s*>)/);
              if (!failure) continue;
              const attributeMessage = failure[2].match(/\bmessage="([^"]*)"/)?.[1];
              const bodyMessage = compact(failure[3]);
              const detail = compact(attributeMessage) || bodyMessage || 'failure body empty';
              findings.push(`${file}: ${match[1]}: ${failure[1]}: ${detail}`);
            }
          }
          if (findings.length === 0) {
            emit(`API ${api}: instrumentation failed but reports contain no parsed testcase failure; reports contain zero testcases or only infrastructure errors`);
          } else {
            findings.slice(0, 12).forEach(emit);
          }
          NODE
          }
          cleanup_instrumentation() {
            local status=$?
            if [[ "$status" -ne 0 ]]; then
              collect_instrumentation_diagnostics
            fi
            if [[ -n "$EMULATOR_PID" ]]; then
              kill "$EMULATOR_PID" >/dev/null 2>&1 || true
            fi
            trap - EXIT
            exit "$status"
          }

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-metrics \
            -no-snapshot-load -no-snapshot-save \
            "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect \
            > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          trap cleanup_instrumentation EXIT

          DEVICE_READY=0
          for _ in $(seq 1 90); do
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }'; then
              DEVICE_READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android API ${API_LEVEL} emulator exited before becoming available to adb."
              cat "$EMULATOR_LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$DEVICE_READY" != "1" ]]; then
            echo "Android API ${API_LEVEL} emulator did not become available to adb within 180 seconds."
            adb devices -l || true
            cat "$EMULATOR_LOG"
            exit 1
          fi

          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android API ${API_LEVEL} emulator exited before boot completion."
              cat "$EMULATOR_LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            echo "Android API ${API_LEVEL} emulator did not finish booting."
            cat "$EMULATOR_LOG"
            exit 1
          fi

          ACTUAL_API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ACTUAL_RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
          ACTUAL_CODENAME="$(adb shell getprop ro.build.version.codename | tr -d '\r')"
          echo "Emulator ready: Android ${ACTUAL_RELEASE} (${ACTUAL_CODENAME}), API ${ACTUAL_API}."
          if [[ "$ACTUAL_API" != "$API_LEVEL" ]]; then
            echo "Expected emulator API ${API_LEVEL}, got API ${ACTUAL_API}."
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Compose instrumentation must start from an interactive emulator surface. A freshly
          # booted AVD can be awake but still show the keyguard, which makes every UI matrix lane
          # fail at the connected-test step without exercising the application.
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true

          if [[ "$API_LEVEL" == "24" ]]; then
            # AGP/UTP may leave connectedDebugAndroidTest waiting indefinitely after
            # the API 24 runner exits. Build the exact same app/test APKs, install
            # them explicitly, then run the AndroidJUnitRunner through adb with a
            # hard watchdog. This keeps API 24 blocking without accepting a 45 min
            # hung Gradle session as a qualification result.
            ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace --no-daemon

            APP_APK="app/build/outputs/apk/debug/app-debug.apk"
            TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            test -s "$APP_APK"
            test -s "$TEST_APK"

            timeout --signal=INT --kill-after=30s 180s adb install -r "$APP_APK"
            timeout --signal=INT --kill-after=30s 180s adb install -r "$TEST_APK"

            INSTRUMENTATION_RUNNER="$(
              adb shell pm list instrumentation | tr -d '\r' |
                awk '/^instrumentation:com\.sentinel\.quantum\.test\// {
                  sub(/^instrumentation:/, "")
                  sub(/ .*/, "")
                  print
                  exit
                }'
            )"
            if [[ -z "$INSTRUMENTATION_RUNNER" ]]; then
              echo "Android API 24 test instrumentation runner was not registered."
              adb shell pm list instrumentation || true
              exit 1
            fi

            set +e
            timeout --signal=INT --kill-after=30s 900s \
              adb shell am instrument -w -r "$INSTRUMENTATION_RUNNER" |
              tr -d '\r' |
              tee "$INSTRUMENTATION_LOG"
            INSTRUMENTATION_STATUS=${PIPESTATUS[0]}
            set -e

            if [[ "$INSTRUMENTATION_STATUS" -ne 0 ]]; then
              echo "Android API 24 instrumentation command failed or exceeded its 15 minute watchdog (status ${INSTRUMENTATION_STATUS})."
              summarize_instrumentation_reports
              exit "$INSTRUMENTATION_STATUS"
            fi
            if grep -Eq '^FAILURES!!!|^INSTRUMENTATION_FAILED:|Process crashed' "$INSTRUMENTATION_LOG"; then
              echo "Android API 24 instrumentation reported a test failure or crash."
              summarize_instrumentation_reports
              exit 1
            fi
            if ! grep -Eq '^OK \([1-9][0-9]* tests?\)$' "$INSTRUMENTATION_LOG"; then
              echo "Android API 24 instrumentation did not report a non-zero passing test count."
              exit 1
            fi
          else
            set +e
            timeout --signal=INT --kill-after=30s 900s \
              ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon
            INSTRUMENTATION_STATUS=$?
            set -e
            if [[ "$INSTRUMENTATION_STATUS" -ne 0 ]]; then
              echo "Android API ${API_LEVEL} connected instrumentation failed or exceeded its 15 minute watchdog (status ${INSTRUMENTATION_STATUS})."
              summarize_instrumentation_reports
              exit "$INSTRUMENTATION_STATUS"
            fi
          fi

      - name: Validate modern instrumentation reports
        if: matrix.api-level != 24
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          RESULTS_ROOT="app/build/outputs/androidTest-results/connected"
          test -d "$RESULTS_ROOT"
          TEST_COUNT="$(find "$RESULTS_ROOT" -type f -name '*.xml' -print | wc -l)"
          test "$TEST_COUNT" -gt 0
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'app/build/outputs/androidTest-results/connected';
          const files = [];
          const walk = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.xml')) files.push(full);
            }
          };
          walk(root);
          let testCases = 0;
          for (const file of files) {
            const xml = fs.readFileSync(file, 'utf8');
            testCases += (xml.match(/<testcase\b/g) || []).length;
            if (/<(?:skipped|failure|error)\b/.test(xml)) {
              throw new Error(`Instrumentation report contains a skipped or failed testcase: ${file}`);
            }
          }
          if (testCases === 0) {
            throw new Error('Instrumentation reports contain zero testcases');
          }
          console.log(`Validated ${testCases} instrumentation testcases across ${files.length} XML reports.`);
          NODE

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Android-Instrumentation-API${{ matrix.api-level }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            native-android-app/app/build/reports/androidTests/connected/
            native-android-app/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/sentinel-instrumentation-api${{ matrix.api-level }}-emulator.log
            ${{ runner.temp }}/sentinel-instrumentation-api${{ matrix.api-level }}-tests.log
            ${{ runner.temp }}/sentinel-instrumentation-api${{ matrix.api-level }}-diagnostics/
          if-no-files-found: warn
          retention-days: 14
