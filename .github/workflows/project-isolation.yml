name: Project Isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    name: Sentinel / A KI PRI SA YÉ isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check cross-project contamination
        shell: bash
        run: bash scripts/check-project-isolation.sh
