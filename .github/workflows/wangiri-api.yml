name: Wangiri API Validation

on:
  pull_request:
    paths:
      - "backend/wangiri-api/**"
      - "render.yaml"
      - ".github/workflows/wangiri-api.yml"
  push:
    branches: [main]
    paths:
      - "backend/wangiri-api/**"
      - "render.yaml"
      - ".github/workflows/wangiri-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/wangiri-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/wangiri-api/requirements.txt
            backend/wangiri-api/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app_redis.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag sentinel-wangiri-api:test backend/wangiri-api
