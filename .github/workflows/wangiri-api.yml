name: Wangiri API Validation

on:
  pull_request:
    paths:
      - "backend/wangiri-api/**"
      - "render.yaml"
      - ".github/workflows/wangiri-api.yml"
  push:
    branches: [main]
    paths:
      - "backend/wangiri-api/**"
      - "render.yaml"
      - ".github/workflows/wangiri-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SENTINEL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend/wangiri-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/wangiri-api/requirements.txt
            backend/wangiri-api/requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app_redis.py collective_intel.py collective_exposure.py

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag sentinel-wangiri-api:test backend/wangiri-api
      - name: Verify container imports production app
        run: docker run --rm --entrypoint python sentinel-wangiri-api:test -c "import app_redis; assert app_redis.app is not None"
      - name: Verify Collective Defense routes are packaged
        run: docker run --rm --entrypoint python sentinel-wangiri-api:test -c "import app_redis; paths={r.path for r in app_redis.app.routes}; assert '/v1/intelligence/lookup' in paths; assert '/v1/intelligence/lookup-fingerprint' in paths; assert '/v1/intelligence/report-public' in paths; assert '/v1/intelligence/relationships/report' in paths; assert '/v1/intelligence/graph/lookup' in paths; assert '/v1/intelligence/exposures/report' in paths; assert '/v1/intelligence/exposures/lookup' in paths"
