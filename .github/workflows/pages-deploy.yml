name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'public/**'
      - 'index.html'
      - 'assets/**'
      - '*.css'
      - '*.js'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Static Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - name: Prepare static files
        run: |
          set -euo pipefail
          mkdir -p _site
          [ ! -d public ] || cp -r public/* _site/
          [ ! -f index.html ] || cp index.html _site/
          [ ! -d assets ] || cp -r assets _site/
          for ext in css js; do
            if ls *.$ext >/dev/null 2>&1; then cp *.$ext _site/; fi
          done
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Deployment summary
        run: |
          echo "## GitHub Pages Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Site deployed successfully: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
