name: Autonomous International Numbering Refresh

on:
  schedule:
    - cron: '19 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*numbering*.yml'
      - 'scripts/*numbering*.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: numbering-autonomous-publication-main
  cancel-in-progress: false

jobs:
  arcep:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/arcep-numbering-refresh.yml
  ofcom:
    if: always() && github.ref == 'refs/heads/main'
    needs: arcep
    uses: ./.github/workflows/ofcom-numbering-refresh.yml
  acm:
    if: always() && github.ref == 'refs/heads/main'
    needs: ofcom
    uses: ./.github/workflows/acm-numbering-refresh.yml
  ctu:
    if: always() && github.ref == 'refs/heads/main'
    needs: acm
    uses: ./.github/workflows/ctu-numbering-refresh.yml
