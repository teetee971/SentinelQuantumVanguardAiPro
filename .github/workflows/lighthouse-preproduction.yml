name: Lighthouse Pre-production Baseline

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'assets/**'
      - 'scripts/build-for-cloudflare.js'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/lighthouse-preproduction.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse mobile + desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install project dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build pre-production frontend
        run: npm run build

      - name: Install pinned Lighthouse CLI in isolated prefix
        run: |
          set -euo pipefail
          npm install \
            --prefix /tmp/sentinel-lighthouse \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            lighthouse@13.4.1
          /tmp/sentinel-lighthouse/node_modules/.bin/lighthouse --version

      - name: Resolve Chrome executable
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            echo 'ERROR: Chrome/Chromium executable not found on runner.'
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version

      - name: Start local pre-production server
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory frontend/dist > /tmp/sentinel-http.log 2>&1 &
          echo $! > /tmp/sentinel-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sentinel-http.log
          exit 1

      - name: Run repeated Lighthouse samples
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse
          for form_factor in mobile desktop; do
            for sample in 1 2 3; do
              preset_args=()
              if [ "$form_factor" = desktop ]; then
                preset_args+=(--preset=desktop)
              fi
              /tmp/sentinel-lighthouse/node_modules/.bin/lighthouse http://127.0.0.1:4173/ \
                --chrome-path="$CHROME_PATH" \
                --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
                "${preset_args[@]}" \
                --only-categories=performance,accessibility,best-practices,seo \
                --output=json \
                --output=html \
                --output-path="artifacts/lighthouse/${form_factor}-${sample}" \
                --quiet
            done
          done

      - name: Validate Lighthouse reports with median performance metrics
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = 'artifacts/lighthouse';
          const formFactors = ['mobile', 'desktop'];
          const sampleCount = 3;
          const deterministicCategories = ['accessibility', 'best-practices', 'seo'];
          const performanceThresholds = {
            'first-contentful-paint': 1800,
            'largest-contentful-paint': 2500,
            'total-blocking-time': 200,
            'cumulative-layout-shift': 0.1,
            'speed-index': 3400
          };

          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor(sorted.length / 2)];
          };

          const failures = [];
          const summary = {};
          const lines = [
            '## Lighthouse pre-production reproducible guard',
            '',
            'Three samples are collected per form factor. Performance is gated on median lab metrics; accessibility, best-practices and SEO must remain 100 on every sample.',
            '',
            '| Form factor | Median perf score | FCP ms | LCP ms | TBT ms | CLS | Speed Index ms |',
            '| --- | ---: | ---: | ---: | ---: | ---: | ---: |'
          ];

          for (const formFactor of formFactors) {
            const samples = [];
            for (let i = 1; i <= sampleCount; i += 1) {
              const reportPath = path.join(dir, `${formFactor}-${i}.report.json`);
              if (!fs.existsSync(reportPath)) {
                throw new Error(`Missing Lighthouse report: ${reportPath}`);
              }
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              if (report.configSettings?.formFactor !== formFactor) {
                throw new Error(`Unexpected form factor in ${reportPath}: ${report.configSettings?.formFactor}`);
              }

              const categories = {};
              for (const id of ['performance', ...deterministicCategories]) {
                const score = report.categories?.[id]?.score;
                if (!Number.isFinite(score) || score < 0 || score > 1) {
                  throw new Error(`Invalid ${id} score in ${reportPath}: ${score}`);
                }
                categories[id] = Math.round(score * 100);
              }

              for (const id of deterministicCategories) {
                if (categories[id] !== 100) {
                  failures.push(`${formFactor} sample ${i}: ${id}=${categories[id]} (target 100)`);
                }
              }

              const metrics = {};
              for (const id of Object.keys(performanceThresholds)) {
                const value = report.audits?.[id]?.numericValue;
                if (!Number.isFinite(value) || value < 0) {
                  throw new Error(`Invalid ${id} value in ${reportPath}: ${value}`);
                }
                metrics[id] = value;
              }

              samples.push({ categories, metrics, fetchTime: report.fetchTime });
            }

            const medians = {};
            for (const id of Object.keys(performanceThresholds)) {
              medians[id] = median(samples.map((sample) => sample.metrics[id]));
              if (medians[id] > performanceThresholds[id]) {
                failures.push(`${formFactor}: median ${id}=${medians[id]} exceeds ${performanceThresholds[id]}`);
              }
            }

            const medianPerformanceScore = median(samples.map((sample) => sample.categories.performance));
            summary[formFactor] = { medianPerformanceScore, medians, samples };
            lines.push(`| ${formFactor} | ${medianPerformanceScore} | ${Math.round(medians['first-contentful-paint'])} | ${Math.round(medians['largest-contentful-paint'])} | ${Math.round(medians['total-blocking-time'])} | ${medians['cumulative-layout-shift'].toFixed(3)} | ${Math.round(medians['speed-index'])} |`);
          }

          lines.push(
            '',
            'Performance thresholds (median of 3 samples): FCP ≤ 1800 ms, LCP ≤ 2500 ms, TBT ≤ 200 ms, CLS ≤ 0.1, Speed Index ≤ 3400 ms.',
            'The synthetic performance score is retained as evidence but is not used as a single-sample fail condition because repeated identical builds showed material runner variance.'
          );

          fs.writeFileSync(path.join(dir, 'summary.json'), `${JSON.stringify({ performanceThresholds, failures, ...summary }, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          console.log(JSON.stringify({ performanceThresholds, failures, ...summary }, null, 2));

          if (failures.length > 0) {
            throw new Error(`Lighthouse reproducible guard failed: ${failures.join('; ')}`);
          }
          NODE

      - name: Record tool versions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "lighthouse=$(/tmp/sentinel-lighthouse/node_modules/.bin/lighthouse --version)"
            echo "chrome=$($CHROME_PATH --version)"
          } > artifacts/lighthouse/versions.txt

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-preproduction-${{ github.sha }}
          path: artifacts/lighthouse
          if-no-files-found: error
          retention-days: 30
