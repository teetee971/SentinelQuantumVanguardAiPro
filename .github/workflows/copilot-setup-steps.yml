name: Copilot Setup Steps

# Prepares the Copilot cloud agent environment before its firewall is enabled.
# The Android build resolves the Android Gradle plugin from Google's Maven
# repository (dl.google.com), which is unreachable once the agent firewall is
# active. Warming the Gradle caches here is what allows an agent session to run
# `./gradlew --offline assembleDebug` afterwards.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - native-android-app/gradle/wrapper/gradle-wrapper.properties
      - native-android-app/build.gradle
      - native-android-app/app/build.gradle
      - native-android-app/settings.gradle
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - native-android-app/gradle/wrapper/gradle-wrapper.properties
      - native-android-app/build.gradle
      - native-android-app/app/build.gradle
      - native-android-app/settings.gradle

permissions:
  contents: read

concurrency:
  group: copilot-setup-steps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Download Gradle distribution
        working-directory: ./native-android-app
        run: ./gradlew --version

      - name: Warm Gradle dependency cache for the Android build
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
