          - name: Validate Play Console packaging policy
            id: policy
            working-directory: ./native-android-app
            shell: bash
            run: |
              set -euxo pipefail

              ls -la app/build.gradle

              APPLICATION_ID=$(grep -m1 "applicationId" app/build.gradle | sed -E 's/.*applicationId[[:space:]]+"([^"]+)".*/\1/')
              test "$APPLICATION_ID" = "com.sentinel.quantum"

              TARGET_SDK=$(grep -m1 "targetSdk" app/build.gradle | grep -Eo '[0-9]+' | head -1)
              test -n "$TARGET_SDK" && test "$TARGET_SDK" -ge 34

              VERSION_CODE=$(grep -m1 "versionCode" app/build.gradle | grep -Eo '[0-9]+' | head -1)
              test -n "$VERSION_CODE" && test "$VERSION_CODE" -gt 0

              VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | awk -F'"' '{print $2}')
              test -n "$VERSION_NAME"

              echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
              echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
