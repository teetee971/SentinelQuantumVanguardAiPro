name: "CodeQL Repository Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '33 3 * * 1'

permissions:
  contents: read

jobs:
  analyze-web:
    name: Analyze web (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Attest pull request merge provenance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          PARENT_1="$(git rev-parse HEAD^1)"
          PARENT_2="$(git rev-parse HEAD^2)"
          CURRENT_BASE_SHA="$(git ls-remote --exit-code origin "refs/heads/${BASE_REF}" | awk 'NR == 1 {print $1}')"

          test -n "${CURRENT_BASE_SHA}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "CHECKED_OUT_HEAD=${CHECKED_OUT_HEAD}"
          echo "PARENT_1=${PARENT_1}"
          echo "PARENT_2=${PARENT_2}"
          echo "CURRENT_BASE_SHA=${CURRENT_BASE_SHA}"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "EXPECTED_MERGE_REF=${EXPECTED_MERGE_REF}"

          # Fail closed if the base branch moved after GitHub generated this merge ref.
          test "${CHECKED_OUT_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "${EXPECTED_MERGE_REF}"
          test "${PARENT_1}" = "${CURRENT_BASE_SHA}"
          test "${PARENT_2}" = "${EXPECTED_HEAD_SHA}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze Android (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Attest pull request merge provenance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          PARENT_1="$(git rev-parse HEAD^1)"
          PARENT_2="$(git rev-parse HEAD^2)"
          CURRENT_BASE_SHA="$(git ls-remote --exit-code origin "refs/heads/${BASE_REF}" | awk 'NR == 1 {print $1}')"

          test -n "${CURRENT_BASE_SHA}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "CHECKED_OUT_HEAD=${CHECKED_OUT_HEAD}"
          echo "PARENT_1=${PARENT_1}"
          echo "PARENT_2=${PARENT_2}"
          echo "CURRENT_BASE_SHA=${CURRENT_BASE_SHA}"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          echo "EXPECTED_MERGE_REF=${EXPECTED_MERGE_REF}"

          # Fail closed if the base branch moved after GitHub generated this merge ref.
          test "${CHECKED_OUT_HEAD}" = "${GITHUB_SHA}"
          test "${GITHUB_REF}" = "${EXPECTED_MERGE_REF}"
          test "${PARENT_1}" = "${CURRENT_BASE_SHA}"
          test "${PARENT_2}" = "${EXPECTED_HEAD_SHA}"

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Initialize CodeQL for Java/Kotlin
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Android unit tests before required CodeQL gate
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --no-build-cache

      - name: Build Android for CodeQL extraction
        working-directory: ./native-android-app
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Perform Java/Kotlin CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:java-kotlin"

      - name: Require universal pull request gates before required CodeQL status passes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          test -n "$TARGET_SHA"
          test "$TARGET_SHA" != "null"

          REQUIRED_WORKFLOWS=(
            "build-native-android.yml"
            "build-aab-playconsole.yml"
            "frontend-validation.yml"
            "security-governance-validation.yml"
            "ai-governance-validation.yml"
            "sentinel-isolation.yml"
            "integrity-check.yml"
            "preproduction-final-gate.yml"
            "lighthouse-preproduction.yml"
          )

          DEADLINE=$((SECONDS + 2400))
          POLL_SECONDS=15

          while true; do
            pending=0

            for workflow in "${REQUIRED_WORKFLOWS[@]}"; do
              api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs"
              response="$(curl --fail --silent --show-error --location --retry 3                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "X-GitHub-Api-Version: 2022-11-28"                 --get                 --data-urlencode "head_sha=${TARGET_SHA}"                 --data-urlencode "event=pull_request"                 --data-urlencode "per_page=10"                 "$api")"

              latest="$(jq -c '[.workflow_runs[]] | sort_by(.run_number) | last // empty' <<<"$response")"

              if [[ -z "$latest" ]]; then
                echo "WAIT ${workflow}: no run visible yet for head ${TARGET_SHA}"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<<"$latest")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
              run_id="$(jq -r '.id' <<<"$latest")"
              run_url="$(jq -r '.html_url' <<<"$latest")"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "ERROR ${workflow}: run ${run_id} concluded ${conclusion}: ${run_url}"
                  exit 1
                fi
                echo "PASS ${workflow}: run ${run_id}"
              else
                echo "WAIT ${workflow}: run ${run_id} is ${status}"
                pending=1
              fi
            done

            if [[ "$pending" == "0" ]]; then
              echo "All universal pull request gates passed for head ${TARGET_SHA}."
              break
            fi

            if (( SECONDS >= DEADLINE )); then
              echo "ERROR: timed out waiting for universal pull request gates for head ${TARGET_SHA}."
              exit 1
            fi

            sleep "$POLL_SECONDS"
          done
