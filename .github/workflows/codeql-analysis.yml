name: "CodeQL Repository Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '33 3 * * 1'

permissions:
  contents: read

jobs:
  analyze-web:
    name: Analyze web (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze Android (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Initialize CodeQL for Java/Kotlin
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Android unit tests before required CodeQL gate
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --no-build-cache

      - name: Build Android for CodeQL extraction
        working-directory: ./native-android-app
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Perform Java/Kotlin CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:java-kotlin"

  attest-merge-revision:
    name: Attest CodeQL merge revision
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - analyze-web
      - analyze-android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Verify pull-request merge revision
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/pull/${{ github.event.pull_request.number }}/merge"
          test -n "$GITHUB_SHA"

      - name: Publish required CodeQL checks on merge revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          details_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          summary="All required CodeQL jobs completed successfully for pull-request merge revision ${GITHUB_SHA}."
          contexts=(
            "Analyze Android (Java/Kotlin)"
            "Analyze web (actions)"
            "Analyze web (javascript-typescript)"
          )

          for context in "${contexts[@]}"; do
            jq -n               --arg name "$context"               --arg sha "$GITHUB_SHA"               --arg details_url "$details_url"               --arg summary "$summary"               '{
                name: $name,
                head_sha: $sha,
                status: "completed",
                conclusion: "success",
                details_url: $details_url,
                output: {
                  title: "CodeQL merge-revision attestation",
                  summary: $summary
                }
              }' | gh api                 --method POST                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "repos/${GITHUB_REPOSITORY}/check-runs"                 --input -
          done
