name: "CodeQL Repository Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  schedule:
    - cron: '33 3 * * 1'

permissions:
  contents: read

jobs:
  analyze-web:
    name: Analyze web (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Attest pull request merge provenance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          PARENT_1="$(git rev-parse HEAD^1)"
          PARENT_2="$(git rev-parse HEAD^2)"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "CHECKED_OUT_HEAD=${CHECKED_OUT_HEAD}"
          echo "PARENT_1=${PARENT_1}"
          echo "PARENT_2=${PARENT_2}"
          echo "EXPECTED_BASE_SHA=${EXPECTED_BASE_SHA}"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          test "${CHECKED_OUT_HEAD}" = "${GITHUB_SHA}"
          test "${PARENT_1}" = "${EXPECTED_BASE_SHA}"
          test "${PARENT_2}" = "${EXPECTED_HEAD_SHA}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-android:
    name: Analyze Android (Java/Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Attest pull request merge provenance
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_HEAD="$(git rev-parse HEAD)"
          PARENT_1="$(git rev-parse HEAD^1)"
          PARENT_2="$(git rev-parse HEAD^2)"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "CHECKED_OUT_HEAD=${CHECKED_OUT_HEAD}"
          echo "PARENT_1=${PARENT_1}"
          echo "PARENT_2=${PARENT_2}"
          echo "EXPECTED_BASE_SHA=${EXPECTED_BASE_SHA}"
          echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          test "${CHECKED_OUT_HEAD}" = "${GITHUB_SHA}"
          test "${PARENT_1}" = "${EXPECTED_BASE_SHA}"
          test "${PARENT_2}" = "${EXPECTED_HEAD_SHA}"

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Initialize CodeQL for Java/Kotlin
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Android unit tests before required CodeQL gate
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --no-build-cache

      - name: Build Android for CodeQL extraction
        working-directory: ./native-android-app
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Perform Java/Kotlin CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: "/language:java-kotlin"
