name: Sentinel Security Validation Catalog

on:
  push:
    branches: [main]
    paths:
      - 'security-validation/**'
      - 'scripts/validation/**'
      - '.github/workflows/security-validation.yml'
  pull_request:
    paths:
      - 'security-validation/**'
      - 'scripts/validation/**'
      - '.github/workflows/security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate scenario catalog
        run: node scripts/validation/validate-security-scenarios.js

      - name: Run safe security scenarios
        run: node scripts/validation/run-security-scenarios.js

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sentinel-security-validation-report
          path: security-validation/latest-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify Sentinel project isolation
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'akiprisaye|a-ki-pri-sa-ye|com\.akiprisaye|google-services\.json|com\.google\.firebase|firebase-messaging|firebase-admin|FIREBASE_TOKEN' \
            security-validation scripts/validation \
            --exclude='security-validation.yml' 2>/dev/null; then
            echo 'Forbidden cross-project/Firebase identifier detected.'
            exit 1
          fi
