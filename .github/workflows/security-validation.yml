name: Sentinel Security Validation Catalog

on:
  push:
    branches: [main]
    paths:
      - 'security-validation/**'
      - 'scripts/validation/**'
      - '.github/workflows/security-validation.yml'
  pull_request:
    paths:
      - 'security-validation/**'
      - 'scripts/validation/**'
      - '.github/workflows/security-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate scenario catalog
        run: node scripts/validation/validate-security-scenarios.js

      - name: Run safe security scenarios
        run: node scripts/validation/run-security-scenarios.js

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-security-validation-report
          path: security-validation/latest-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify Sentinel project isolation
        shell: bash
        run: |
          set -euo pipefail
          F1='aki' ; F2='prisaye'
          F3='a-ki' ; F4='pri-sa-y' ; F5='e'
          FB1='google-''services' ; FB2='json'
          FB3='com.google.' ; FB4='fire''base'
          FB5='fire''base-' ; FB6='messaging'
          FB7='fire''base-' ; FB8='admin'
          FB9='FIRE''BASE_' ; FB10='TOKEN'
          PATTERN="${F1}${F2}|${F3}${F4}${F5}|${F1}${F2}|${FB1}\\.${FB2}|${FB3}${FB4}|${FB5}${FB6}|${FB7}${FB8}|${FB9}${FB10}"
          if grep -RniE "$PATTERN" security-validation scripts/validation --exclude='security-validation.yml' 2>/dev/null; then
            echo 'Forbidden cross-project/Firebase identifier detected.'
            exit 1
          fi
