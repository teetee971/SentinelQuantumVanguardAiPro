name: One-shot SEND_SMS snapshot green

on:
  push:
    branches:
      - hardening/physical-session-failclosed
    paths:
      - 'scripts/apply-send-sms-snapshot-green.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/physical-session-failclosed
          fetch-depth: 0

      - name: Apply exact SEND_SMS oracle patch
        run: python3 scripts/apply-send-sms-snapshot-green.py

      - name: Verify focused regression
        run: node --test scripts/phone-core-permission-snapshot.test.js

      - name: Commit verified patch and remove one-shot machinery
        run: |
          rm scripts/apply-send-sms-snapshot-green.py
          rm .github/workflows/one-shot-send-sms-snapshot-green.yml
          git config user.name "sentinel-ci"
          git config user.email "sentinel-ci@users.noreply.github.com"
          git add scripts/phone-core-emulator-revocation-flow.sh scripts/apply-send-sms-snapshot-green.py .github/workflows/one-shot-send-sms-snapshot-green.yml
          git diff --cached --check
          git commit -m "fix(phone-core): unify SEND_SMS permission snapshot truth"
          git push origin HEAD:hardening/physical-session-failclosed
