name: Lighthouse Live Deployment Guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'robots.txt'
      - '_headers'
      - 'public/**'
      - 'assets/**'
      - 'scripts/build-for-cloudflare.js'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/lighthouse-live.yml'
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTINEL_SITE_URL: https://sentinelquantumvanguardaipro.pages.dev/

jobs:
  lighthouse-live:
    name: Live Cloudflare mobile + desktop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned Lighthouse CLI in isolated prefix
        run: |
          set -euo pipefail
          npm install \
            --prefix /tmp/sentinel-lighthouse \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            lighthouse@13.4.1
          /tmp/sentinel-lighthouse/node_modules/.bin/lighthouse --version

      - name: Resolve Chrome executable
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            echo 'ERROR: Chrome/Chromium executable not found on runner.'
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          "$chrome_path" --version

      - name: Wait for Cloudflare deployment bound to this commit
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse-live
          base_url="${SENTINEL_SITE_URL%/}"
          marker_url="${base_url}/deployment-meta.json"
          matched=0

          for attempt in $(seq 1 30); do
            echo "Deployment probe ${attempt}/30 for ${GITHUB_SHA}"
            if curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 20 \
              --output artifacts/lighthouse-live/deployment-meta.json \
              "$marker_url"; then
              if EXPECTED_SHA="$GITHUB_SHA" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const expected = process.env.EXPECTED_SHA;
          const marker = JSON.parse(fs.readFileSync('artifacts/lighthouse-live/deployment-meta.json', 'utf8'));
          if (marker?.schema_version !== 1 || marker?.commit !== expected) process.exit(1);
          NODE
              then
                matched=1
                echo "Cloudflare deployment matches ${GITHUB_SHA}."
                break
              fi
            fi
            sleep 10
          done

          if [ "$matched" -ne 1 ]; then
            echo "ERROR: Cloudflare did not expose deployment marker ${GITHUB_SHA} within the bounded wait."
            if [ -f artifacts/lighthouse-live/deployment-meta.json ]; then
              echo 'Last deployment marker:'
              cat artifacts/lighthouse-live/deployment-meta.json || true
            fi
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 30 \
            --dump-header artifacts/lighthouse-live/response-headers.txt \
            --output /dev/null \
            "$SENTINEL_SITE_URL"

      - name: Run live Lighthouse mobile samples
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            /tmp/sentinel-lighthouse/node_modules/.bin/lighthouse "$SENTINEL_SITE_URL" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output=html \
              --output-path="artifacts/lighthouse-live/mobile-${sample}" \
              --quiet
          done

      - name: Run live Lighthouse desktop samples
        run: |
          set -euo pipefail
          for sample in 1 2 3; do
            /tmp/sentinel-lighthouse/node_modules/.bin/lighthouse "$SENTINEL_SITE_URL" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json \
              --output=html \
              --output-path="artifacts/lighthouse-live/desktop-${sample}" \
              --quiet
          done

      - name: Validate live target with bounded performance sampling
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = 'artifacts/lighthouse-live';
          const expected = new URL(process.env.SENTINEL_SITE_URL);
          const categoryIds = ['performance', 'accessibility', 'best-practices', 'seo'];
          const reports = fs.readdirSync(dir).filter((name) => name.endsWith('.report.json')).sort();
          if (reports.length !== 6) throw new Error(`Expected 6 Lighthouse reports, found ${reports.length}`);

          const samples = { mobile: [], desktop: [] };
          for (const name of reports) {
            const report = JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8'));
            const formFactor = report.configSettings?.formFactor;
            if (formFactor !== 'mobile' && formFactor !== 'desktop') throw new Error(`Unexpected form factor: ${formFactor}`);

            const finalUrl = new URL(report.finalDisplayedUrl ?? report.finalUrl ?? report.requestedUrl);
            if (finalUrl.protocol !== 'https:' || finalUrl.hostname !== expected.hostname) {
              throw new Error(`Unexpected live Lighthouse destination: ${finalUrl.href}`);
            }

            const categories = {};
            for (const id of categoryIds) {
              const raw = report.categories?.[id]?.score;
              if (!Number.isFinite(raw)) throw new Error(`Missing ${id} score in ${name}`);
              categories[id] = Math.round(raw * 100);
            }

            samples[formFactor].push({
              report: name,
              lighthouseVersion: report.lighthouseVersion,
              fetchTime: report.fetchTime,
              finalUrl: finalUrl.href,
              categories,
            });
          }

          if (samples.mobile.length !== 3 || samples.desktop.length !== 3) {
            throw new Error(`Expected 3 mobile and 3 desktop samples; got mobile=${samples.mobile.length}, desktop=${samples.desktop.length}`);
          }

          const median = (values) => [...values].sort((a, b) => a - b)[Math.floor(values.length / 2)];
          const summary = {};
          const regressions = [];
          const lines = [
            '## Lighthouse live deployment guard',
            '',
            `Deployed commit: \`${process.env.GITHUB_SHA}\``,
            '',
            'Performance is evaluated as the median of three independent samples to control runner/network variance. Accessibility, Best Practices and SEO must be 100 in every sample.',
            '',
            '| Form factor | Performance samples | Median Performance | Accessibility | Best Practices | SEO |',
            '| --- | --- | ---: | --- | --- | --- |'
          ];

          for (const formFactor of ['mobile', 'desktop']) {
            const formSamples = samples[formFactor];
            const performanceScores = formSamples.map((sample) => sample.categories.performance);
            const performanceMedian = median(performanceScores);
            if (performanceMedian < 100) regressions.push(`${formFactor}:performance-median=${performanceMedian}`);

            const deterministic = {};
            for (const id of ['accessibility', 'best-practices', 'seo']) {
              const values = formSamples.map((sample) => sample.categories[id]);
              deterministic[id] = values;
              for (const [index, score] of values.entries()) {
                if (score < 100) regressions.push(`${formFactor}:${id}:sample-${index + 1}=${score}`);
              }
            }

            summary[formFactor] = {
              performance: { samples: performanceScores, median: performanceMedian },
              accessibility: deterministic.accessibility,
              bestPractices: deterministic['best-practices'],
              seo: deterministic.seo,
              samples: formSamples,
            };

            lines.push(
              `| ${formFactor} | ${performanceScores.join(', ')} | ${performanceMedian} | ${deterministic.accessibility.join(', ')} | ${deterministic['best-practices'].join(', ')} | ${deterministic.seo.join(', ')} |`
            );
          }

          lines.push('', 'Target remains 100/100 in every Lighthouse category. A single transient performance sample cannot override the three-sample median; non-performance categories remain fail-closed per sample.');
          fs.writeFileSync(path.join(dir, 'summary.json'), `${JSON.stringify({ target: 100, deployedCommit: process.env.GITHUB_SHA, methodology: 'performance-median-of-3; other-categories-all-samples', regressions, ...summary }, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          console.log(JSON.stringify({ target: 100, deployedCommit: process.env.GITHUB_SHA, regressions, ...summary }, null, 2));

          if (regressions.length > 0) {
            throw new Error(`Live Lighthouse regression: ${regressions.join('; ')}`);
          }
          NODE

      - name: Record tool versions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "lighthouse=$(/tmp/sentinel-lighthouse/node_modules/.bin/lighthouse --version)"
            echo "chrome=$($CHROME_PATH --version)"
          } > artifacts/lighthouse-live/versions.txt

      - name: Upload live Lighthouse evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-live-${{ github.run_id }}
          path: artifacts/lighthouse-live/
          if-no-files-found: error
          retention-days: 30
