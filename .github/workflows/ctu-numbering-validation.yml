name: CTU Numbering Validation

on:
  pull_request:
    paths:
      - '.github/workflows/ctu-numbering-*.yml'
      - 'scripts/update-ctu-numbering*'
      - 'scripts/numbering-sources/cz-ctu*'
      - 'scripts/numbering-sources/common/download-official*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node --test scripts/update-ctu-numbering.test.js scripts/numbering-sources/common/download-official.test.js scripts/numbering-sources/cz-ctu.test.js
      - name: Qualify live official source without publishing a dataset
        run: node scripts/numbering-sources/cz-ctu.js --output /tmp/ctu-qualified.json
