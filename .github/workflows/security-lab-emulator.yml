name: Security Lab Pro Emulator Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'native-android-app/**'
      - '.github/workflows/security-lab-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-lab-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-lab-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run only Security Lab UI tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          working-directory: native-android-app
          script: |
            set -euo pipefail
            chmod +x ./gradlew
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.sentinel.quantum.security.SecurityLabProInstrumentationTest \
              --no-daemon --console=plain
      - name: Publish instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-lab-android-instrumentation
          path: |
            native-android-app/app/build/reports/androidTests/**
            native-android-app/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 7
