name: Security Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-governance:
    name: Security governance regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Node.js runtime
        run: node --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run security governance suite
        run: npm run test:security-governance

      - name: Run governance fuzzing
        run: npm run test:security-fuzz
