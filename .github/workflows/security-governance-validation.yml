name: Security Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-governance:
    name: Security governance regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Verify GitHub Actions supply-chain pinning
        run: node scripts/check-github-actions-pinning.js

      - name: Verify Node.js runtime
        run: node --version

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run syntax validation
        run: npm run test:syntax

      - name: Run security governance suite
        run: npm run test:security-governance

      - name: Run governance fuzzing
        run: npm run test:security-fuzz

  security-execution-postgres:
    name: Execution binding and PostgreSQL anti-replay integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sentinel_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sentinel_test
      PGPASSWORD: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Run execution boundary and PostgreSQL integration tests
        run: npm run test:security-execution
