name: Sentinel Continuous Security Loop

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-continuous-security
  cancel-in-progress: false

jobs:
  continuous-security:
    name: Hourly security and integrity loop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Sentinel isolation gate
        run: node scripts/check-sentinel-isolation.js

      - name: Credential hygiene gate
        run: npm run test:credential-hygiene

      - name: Security governance validation
        run: npm run test:security-governance

      - name: Security fuzz validation
        run: npm run test:security-fuzz

      - name: Supply-chain validation
        run: npm run test:ci-supply-chain

      - name: Static-link validation
        run: npm run test:static-links

      - name: Build validation
        run: npm run build

      - name: Report status
        if: always()
        run: |
          echo "Sentinel hourly loop completed with conclusion: ${{ job.status }}"
