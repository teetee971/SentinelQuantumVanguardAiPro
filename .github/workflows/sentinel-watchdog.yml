name: Sentinel Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7/5 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Lightweight integrity watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Run read-only watchdog
        run: node scripts/sentinel-watchdog.js

      - name: Upload watchdog evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-watchdog-${{ github.run_id }}
          path: artifacts/watchdog/
          if-no-files-found: error
          retention-days: 7
