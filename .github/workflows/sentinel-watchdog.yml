name: Sentinel Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '7/5 * * * *'

permissions:
  contents: read

concurrency:
  group: sentinel-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: Lightweight integrity watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .node-version

      - name: Run read-only watchdog
        run: node scripts/sentinel-watchdog.js

      - name: Upload watchdog evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sentinel-watchdog-${{ github.run_id }}
          path: artifacts/watchdog/
          if-no-files-found: error
          retention-days: 7
