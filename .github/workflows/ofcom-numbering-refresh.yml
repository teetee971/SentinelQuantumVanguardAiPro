name: Ofcom Numbering Refresh

on:
  schedule:
    - cron: '17 8 * * 4'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ofcom-numbering-refresh.yml'
      - 'scripts/update-ofcom-numbering.js'
      - 'scripts/update-ofcom-numbering.test.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ofcom-numbering-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-github-actions-pinning.js
      - run: node --test scripts/update-ofcom-numbering.test.js
      - run: node scripts/update-ofcom-numbering.js
      - name: Open a reviewable data refresh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/ofcom-numbering-${{ github.run_id }}
        run: |
          if ! git status --porcelain -- public/data/ofcom-numbering.json | grep -q .; then
            echo "Ofcom numbering directory unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/data/ofcom-numbering.json
          git commit -m "Phone intelligence: refresh Ofcom numbering data"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Phone intelligence: refresh Ofcom numbering data" --body "Official Ofcom weekly numbering-data refresh. Regulatory allocation/status metadata only: not current-carrier proof after portability, not caller identity, and not a fraud verdict."
