name: Ofcom Numbering Refresh

on:
  schedule:
    - cron: '17 8 * * 4'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ofcom-numbering-refresh.yml'
      - 'scripts/update-ofcom-numbering.js'
      - 'scripts/update-ofcom-numbering.test.js'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ofcom-numbering-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-github-actions-pinning.js
      - run: node --test scripts/update-ofcom-numbering.test.js
      - run: node scripts/update-ofcom-numbering.js
      - name: Open a reviewable data refresh
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/ofcom-numbering-refresh
        run: |
          if ! git status --porcelain -- public/data/ofcom-numbering.json | grep -q .; then
            echo "Ofcom numbering directory unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_exists=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            remote_exists=true
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi

          git checkout -B "$BRANCH"
          git add public/data/ofcom-numbering.json
          git commit -m "Phone intelligence: refresh Ofcom numbering data"

          if [ "$remote_exists" = true ]; then
            git push --force-with-lease origin "$BRANCH"
          else
            git push --set-upstream origin "$BRANCH"
          fi

          existing_pr="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Phone intelligence: refresh Ofcom numbering data" \
              --body "Official Ofcom weekly numbering-data refresh. Regulatory allocation/status metadata only: not current-carrier proof after portability, not caller identity, and not a fraud verdict."
          else
            echo "Updated existing refresh PR #$existing_pr."
          fi
