name: International Numbering Source Watch

on:
  schedule:
    - cron: '47 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/international-numbering-watch.yml'
      - 'scripts/watch-international-numbering.js'
      - 'scripts/watch-international-numbering.test.js'
      - 'scripts/publish-numbering-refresh.js'
      - 'scripts/publish-numbering-refresh.test.js'
      - 'scripts/official-numbering-download.js'
      - 'scripts/official-numbering-download.test.js'
      - 'docs/INTERNATIONAL_NUMBERING_SOURCES.md'
  pull_request:
    paths:
      - '.github/workflows/*numbering*.yml'
      - 'scripts/*numbering*.js'
      - 'scripts/official-numbering-download*.js'
      - 'scripts/refresh-pr-idempotence.test.js'
      - 'docs/INTERNATIONAL_NUMBERING_SOURCES.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: numbering-autonomous-publication-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/check-github-actions-pinning.js
      - run: node scripts/check-actions-permissions.js
      - run: node --test scripts/watch-international-numbering.test.js scripts/publish-numbering-refresh.test.js scripts/refresh-pr-idempotence.test.js scripts/official-numbering-download.test.js scripts/update-rtr-numbering.test.js

  watch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: node scripts/watch-international-numbering.js
      - run: node scripts/publish-numbering-refresh.js sources

  qualify-rtr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify live RTR discovery and parsing without publishing a snapshot
        run: node scripts/update-rtr-numbering.js --automatic --output /tmp/rtr-qualified.json
      - name: Diagnose public download links when qualification fails
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { fetchOfficialBytes } from './scripts/official-numbering-download.js';
          for (const name of ['tn-geo', 'tn-dienste', 'tn-ortsnetze']) {
            const url = `https://data.rtr.at/pages/open-data/${name}`;
            try {
              const page = await fetchOfficialBytes(url, { allowedOrigins: ['https://data.rtr.at', 'https://www.rtr.at'], maxBytes: 2097152 });
              const html = page.bytes.toString('utf8');
              const links = [...html.matchAll(/(?:href|src)\s*=\s*["']([^"']+)["']/gi)]
                .map(match => { try { return new URL(match[1].replaceAll('&amp;', '&'), page.url); } catch { return null; } })
                .filter(link => link?.protocol === 'https:' && ['data.rtr.at', 'www.rtr.at'].includes(link.hostname))
                .map(link => link.origin + link.pathname).slice(0, 60);
              console.log(JSON.stringify({ name, url: page.url, bytes: page.bytes.length, links }));
              if (name === 'tn-geo') {
                const baseMatch = /<base\b[^>]*href\s*=\s*["']([^"']+)["']/i.exec(html);
                const base = new URL(baseMatch?.[1] ?? page.url, page.url);
                const scripts = [...html.matchAll(/<script\b[^>]*src\s*=\s*["']([^"']+)["']/gi)]
                  .map(match => new URL(match[1], base))
                  .filter(link => link.origin === 'https://data.rtr.at' && /(?:main|chunk)-[^/]+\.js$/.test(link.pathname));
                for (const script of scripts.slice(0, 3)) {
                  try {
                    const source = await fetchOfficialBytes(script.href, { allowedOrigins: ['https://data.rtr.at'], maxBytes: 8388608 });
                    const js = source.bytes.toString('utf8');
                    const observations = [...js.matchAll(/(?:api\/|baseUrl|apiUrl|download|\.csv|tn-geo|export)/gi)].slice(0, 45)
                      .map(match => js.slice(Math.max(0, match.index - 100), match.index + 200));
                    console.log(JSON.stringify({ script: script.href, bytes: source.bytes.length, observations }));
                  } catch (error) { console.log(JSON.stringify({ script: script.href, error: error.message })); }
                }
              }
            } catch (error) { console.log(JSON.stringify({ name, error: error.message })); }
          }
          JS
