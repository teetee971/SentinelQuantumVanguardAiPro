name: Android Upgrade-Safe APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-upgrade-safe-apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-prove-upgrade:
    name: Build signed APK and prove in-place upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: android-production
    permissions:
      contents: read

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require current main head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$MAIN_SHA" ]]; then
            echo "ERROR: upgrade-safe APK may only be produced from current main ($MAIN_SHA), got $GITHUB_SHA"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode protected keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/sentinel-upgrade.keystore
          test -s /tmp/sentinel-upgrade.keystore

      - name: Derive monotonic version codes from main history
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          if ! [[ "$COMMIT_COUNT" =~ ^[0-9]+$ ]] || (( COMMIT_COUNT < 1 )); then
            echo "ERROR: invalid commit count: $COMMIT_COUNT"
            exit 1
          fi
          BASE_CODE=$((COMMIT_COUNT * 10))
          CANDIDATE_CODE=$((BASE_CODE + 1))
          if (( CANDIDATE_CODE > 2100000000 )); then
            echo "ERROR: derived Android versionCode exceeds platform maximum"
            exit 1
          fi
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' native-android-app/app/build.gradle)"
          test -n "$VERSION_NAME"
          echo "base_code=$BASE_CODE" >> "$GITHUB_OUTPUT"
          echo "candidate_code=$CANDIDATE_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Upgrade proof versionCode $BASE_CODE -> $CANDIDATE_CODE"

      - name: Grant gradlew permission
        working-directory: native-android-app
        run: chmod +x gradlew

      - name: Build signed baseline APK
        working-directory: native-android-app
        env:
          SENTINEL_VERSION_CODE: ${{ steps.versions.outputs.base_code }}
          KEYSTORE_FILE: /tmp/sentinel-upgrade.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          BASE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$BASE_APK"
          test -s "$BASE_APK"
          cp "$BASE_APK" "$RUNNER_TEMP/sentinel-baseline.apk"

      - name: Build signed candidate APK
        working-directory: native-android-app
        env:
          SENTINEL_VERSION_CODE: ${{ steps.versions.outputs.candidate_code }}
          KEYSTORE_FILE: /tmp/sentinel-upgrade.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          CANDIDATE_APK="$(find app/build/outputs/apk/release -name '*.apk' -type f -print -quit)"
          test -n "$CANDIDATE_APK"
          test -s "$CANDIDATE_APK"
          cp "$CANDIDATE_APK" "$RUNNER_TEMP/sentinel-candidate.apk"

      - name: Verify package and signer continuity
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="$RUNNER_TEMP/sentinel-baseline.apk"
          CANDIDATE_APK="$RUNNER_TEMP/sentinel-candidate.apk"
          apksigner verify --verbose --print-certs "$BASE_APK" | tee "$RUNNER_TEMP/baseline-cert.txt"
          apksigner verify --verbose --print-certs "$CANDIDATE_APK" | tee "$RUNNER_TEMP/candidate-cert.txt"
          BASE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/baseline-cert.txt" | head -n1)"
          CANDIDATE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/candidate-cert.txt" | head -n1)"
          test -n "$BASE_CERT"
          test "$BASE_CERT" = "$CANDIDATE_CERT"
          BASE_PACKAGE="$(aapt dump badging "$BASE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          CANDIDATE_PACKAGE="$(aapt dump badging "$CANDIDATE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test "$BASE_PACKAGE" = "com.sentinel.quantum"
          test "$CANDIDATE_PACKAGE" = "com.sentinel.quantum"
          sha256sum "$CANDIDATE_APK" > "$RUNNER_TEMP/sentinel-candidate.apk.sha256"
          sha256sum --check "$RUNNER_TEMP/sentinel-candidate.apk.sha256"

      - name: Prove install N to N+1 without uninstall
        timeout-minutes: 30
        shell: bash
        env:
          BASE_CODE: ${{ steps.versions.outputs.base_code }}
          CANDIDATE_CODE: ${{ steps.versions.outputs.candidate_code }}
        run: |
          set -euo pipefail
          SDK_PACKAGES=("emulator" "platforms;android-36" "system-images;android-36;google_apis;x86_64")
          sdkmanager "${SDK_PACKAGES[@]}"
          echo "no" | avdmanager create avd --force --name sentinel_upgrade_ci --package "system-images;android-36;google_apis;x86_64"

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi

          "$ANDROID_HOME/emulator/emulator" \
            -avd sentinel_upgrade_ci \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot-load -no-snapshot-save \
            "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/sentinel-upgrade-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            cat "$RUNNER_TEMP/sentinel-upgrade-emulator.log"
            exit 1
          fi

          adb install "$RUNNER_TEMP/sentinel-baseline.apk"
          BEFORE_CODE="$(adb shell dumpsys package com.sentinel.quantum | sed -nE 's/.*versionCode=([0-9]+).*/\1/p' | head -n1 | tr -d '\r')"
          test "$BEFORE_CODE" = "$BASE_CODE"
          adb shell am start -W -n com.sentinel.quantum/.MainActivity >/tmp/sentinel-before-upgrade.txt
          adb shell pm path com.sentinel.quantum | grep -q '^package:'

          # This is the qualification event: package replacement only. No uninstall and no pm clear.
          adb install -r "$RUNNER_TEMP/sentinel-candidate.apk"
          AFTER_CODE="$(adb shell dumpsys package com.sentinel.quantum | sed -nE 's/.*versionCode=([0-9]+).*/\1/p' | head -n1 | tr -d '\r')"
          test "$AFTER_CODE" = "$CANDIDATE_CODE"
          adb shell am force-stop com.sentinel.quantum
          adb logcat -c >/dev/null 2>&1 || true
          adb shell am start -W -n com.sentinel.quantum/.MainActivity >/tmp/sentinel-after-upgrade.txt
          adb shell pidof com.sentinel.quantum
          if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION: main|ANR in com\.sentinel\.quantum'; then
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

      - name: Prepare tester artifact and evidence
        id: artifact
        shell: bash
        env:
          VERSION_NAME: ${{ steps.versions.outputs.version_name }}
          BASE_CODE: ${{ steps.versions.outputs.base_code }}
          CANDIDATE_CODE: ${{ steps.versions.outputs.candidate_code }}
        run: |
          set -euo pipefail
          NAME="SentinelQuantumVanguard-v${VERSION_NAME}-upgrade-safe-${CANDIDATE_CODE}.apk"
          cp "$RUNNER_TEMP/sentinel-candidate.apk" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          apksigner verify --verbose --print-certs "$NAME" > "$NAME.certificates.txt"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$NAME.certificates.txt" | head -n1)"
          test -n "$CERT_SHA256"
          APK_SHA256="$(sha256sum "$NAME" | awk '{print $1}')"
          cat > "$NAME.build.json" <<JSON
          {
            "schema_version": 1,
            "channel": "signed-upgrade-safe-physical-test",
            "apk_name": "$NAME",
            "apk_sha256": "$APK_SHA256",
            "signer_certificate_sha256": "$CERT_SHA256",
            "application_id": "com.sentinel.quantum",
            "version_name": "$VERSION_NAME",
            "baseline_version_code": $BASE_CODE,
            "candidate_version_code": $CANDIDATE_CODE,
            "source_commit": "$GITHUB_SHA",
            "source_ref": "$GITHUB_REF",
            "upgrade_install_command": "adb install -r",
            "uninstall_used_for_upgrade_proof": false,
            "same_signer_proven": true,
            "emulator_upgrade_proof": "passed",
            "physical_validation": "not-executed",
            "functional_100_percent": false
          }
          JSON
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed upgrade-safe APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SentinelQuantumVanguard-UpgradeSafe-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.apk_name }}
            ${{ steps.artifact.outputs.apk_name }}.sha256
            ${{ steps.artifact.outputs.apk_name }}.certificates.txt
            ${{ steps.artifact.outputs.apk_name }}.build.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove decoded signing material
        if: always()
        shell: bash
        run: rm -f /tmp/sentinel-upgrade.keystore
