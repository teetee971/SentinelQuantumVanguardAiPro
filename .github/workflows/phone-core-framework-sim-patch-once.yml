name: Phone Core framework SIM patch once

on:
  push:
    branches:
      - recovery/phone-core-emulator-phase2-20261005
    paths:
      - .github/workflows/phone-core-framework-sim-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: recovery/phone-core-emulator-phase2-20261005
          fetch-depth: 0

      - name: Apply fail-closed framework SIM routing correction
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > "$RUNNER_TEMP/phone-core-framework-sim-patch.py"
          python3 "$RUNNER_TEMP/phone-core-framework-sim-patch.py"

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sentinel-ci'
          git config user.email 'sentinel-ci@users.noreply.github.com'
          git rm .github/workflows/phone-core-framework-sim-patch-once.yml
          git add native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt \
                  native-android-app/app/src/main/java/com/sentinel/quantum/security/OutgoingCallPermissionPolicy.kt \
                  native-android-app/app/src/test/java/com/sentinel/quantum/security/OutgoingCallPermissionPolicyTest.kt
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m 'fix(phone-core): validate framework SIM before PSTN call'
          git push origin HEAD:recovery/phone-core-emulator-phase2-20261005
