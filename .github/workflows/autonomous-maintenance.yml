name: Sentinel Autonomous Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'security/**'
      - 'decision-plane/**'
      - 'config/**'
      - 'public/**'
      - 'frontend/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/autonomous-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: sentinel-autonomous-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    name: Observe, validate and report
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run autonomous engineering checks
        run: npm run test:autonomous-engineering

      - name: Bind engineering evidence to this CI execution
        if: always()
        run: node scripts/evidence-trust.js

      - name: Diagnose validation result
        if: always()
        run: npm run test:autonomous-diagnostic

      - name: Generate bounded remediation plan
        if: always()
        run: npm run test:autonomous-remediation-plan

      - name: Upload autonomous maintenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-autonomous-maintenance-${{ github.run_id }}
          path: artifacts/autonomous-engineering/
          if-no-files-found: error
          retention-days: 14
