name: Sentinel AI Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinel-ai-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-governance:
    name: AI governance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup pinned Node runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Sentinel AI governance tests
        run: npm run test:ai-governance
