name: Sentinel AI Governance Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinel-ai-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-governance:
    name: AI governance tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v3d3c42e5aac805825da76410c1812788e33a6f
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc4765faef0c
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Sentinel AI governance tests
        run: npm run test:ai-governance
