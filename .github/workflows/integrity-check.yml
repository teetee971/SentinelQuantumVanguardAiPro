name: Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Verify Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify critical files exist
        run: |
          set -euo pipefail
          critical_files=(
            "README.md"
            "package.json"
            "index.html"
            ".github/workflows/build-android.yml"
            ".github/workflows/security-fuzz.yml"
            ".github/workflows/project-isolation.yml"
          )
          for file in "${critical_files[@]}"; do
            test -f "$file" || { echo "MISSING: $file"; exit 1; }
            echo "OK: $file"
          done

      - name: Verify forbidden generated files are absent
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(debug|release)\.keystore$|(^|/)google-services\.json$'; then
            echo "Forbidden generated credential/config file is tracked."
            exit 1
          fi
          echo "OK: no generated Android credentials/config are tracked"

      - name: Verify no obvious hardcoded secrets
        run: |
          set -euo pipefail
          patterns=(
            'AKIA[0-9A-Z]{16}'
            'sk-[A-Za-z0-9]{40,}'
            'ghp_[A-Za-z0-9]{36}'
            'glpat-[A-Za-z0-9_-]{20,}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            '(mongodb|postgres|postgresql)://[^[:space:]]+:[^[:space:]@]+@'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -n -I -E -- "$pattern" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.yml' '*.yaml' '*.gradle' '*.properties' 2>/dev/null; then
              echo "Potential hardcoded secret detected: $pattern"
              exit 1
            fi
          done
          echo "OK: no obvious hardcoded secrets detected"

      - name: Verify project isolation
        run: bash scripts/check-project-isolation.sh

      - name: Generate accurate integrity summary
        if: always()
        run: |
          {
            echo "## Repository Integrity"
            echo
            echo "Checks executed: critical files, generated credentials, hardcoded-secret patterns, and Sentinel project isolation."
            echo "Result: see individual workflow steps above."
          } >> "$GITHUB_STEP_SUMMARY"
