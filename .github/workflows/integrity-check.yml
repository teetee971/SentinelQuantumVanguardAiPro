name: Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integrity:
    name: Verify Repository Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify critical files exist
        run: |
          critical_files=(README.md package.json index.html .github/workflows/build-android.yml .github/workflows/release-apk.yml .github/workflows/codeql-analysis.yml)
          all_found=true
          for file in "${critical_files[@]}"; do
            if [ -f "$file" ]; then echo "OK: $file"; else echo "MISSING: $file"; all_found=false; fi
          done
          [ "$all_found" = true ]

      - name: Verify no secrets in code
        run: |
          SECRET_PATTERNS=("AKIA[0-9A-Z]{16}" "sk-[a-zA-Z0-9]{48}" "ghp_[a-zA-Z0-9]{36}" "glpat-[a-zA-Z0-9]{20}" "-----BEGIN.*PRIVATE KEY" "mongodb://[^\"]*:[^\"]*@" "postgres://[^\"]*:[^\"]*@")
          found_secrets=false
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if grep -rn "$pattern" --include="*.js" --include="*.ts" --include="*.json" --include="*.yml" --exclude="integrity-check.yml" --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null; then
              echo "Potential secret matching pattern: $pattern"
              found_secrets=true
            fi
          done
          [ "$found_secrets" = false ]

      - name: Generate integrity summary
        if: always()
        run: |
          echo "## Integrity Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "Repository integrity checks completed." >> $GITHUB_STEP_SUMMARY
