name: Phone Core Dialer Surgical Patch

on:
  push:
    branches:
      - fix/phone-number-region-safe-20261004
    paths:
      - .github/workflows/phone-core-dialer-surgical-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/phone-number-region-safe-20261004
          fetch-depth: 0
      - name: Apply region-safe dialer patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt')
          text = path.read_text(encoding='utf-8')

          old_import = 'import com.sentinel.quantum.security.AndroidRoleReadPolicy\n'
          new_import = '''import com.sentinel.quantum.security.AndroidPhoneNumberCanonicalizer
          import com.sentinel.quantum.security.AndroidRoleReadPolicy
          import com.sentinel.quantum.security.GlobalPhoneIdentityPolicy
          import com.sentinel.quantum.security.PhoneDirectoryRoutingPolicy
          import com.sentinel.quantum.security.PhoneRegionRuntimeCache
          '''
          if text.count(old_import) != 1:
              raise SystemExit('Expected AndroidRoleReadPolicy import anchor exactly once')
          text = text.replace(old_import, new_import, 1)

          start_marker = 'fun lookup() {'
          end_marker = 'PrimaryNumberRow('
          start = text.find(start_marker)
          if start < 0 or text.find(start_marker, start + 1) >= 0:
              raise SystemExit('Expected exactly one lookup() marker; refusing partial patch')
          line_start = text.rfind('\n', 0, start) + 1
          end = text.find(end_marker, start)
          if end < 0 or text.find(end_marker, end + 1) >= 0:
              raise SystemExit('Expected exactly one PrimaryNumberRow marker after lookup(); refusing partial patch')
          end_line_start = text.rfind('\n', start, end) + 1
          legacy = text[line_start:end_line_start]
          required_legacy_tokens = [
              'val at = RtrDirectoryClient.normalize(lookupNumber)',
              'val a = arcep.lookup(lookupNumber)',
              'callerNumber = lookupNumber',
              'recipientCountry = "FR"',
          ]
          missing = [token for token in required_legacy_tokens if token not in legacy]
          if missing:
              raise SystemExit('Legacy lookup contract changed; missing: ' + ', '.join(missing))

          indent = text[line_start:start]
          body_indent = indent + '    '
          new_lookup = f'''{indent}fun lookup() {{
          {body_indent}if (number.isBlank() || lookupRunning) return
          {body_indent}val lookupNumber = number
          {body_indent}val observedRegion = PhoneRegionRuntimeCache.currentRegionIso()
          {body_indent}val canonicalLookupNumber = GlobalPhoneIdentityPolicy.canonicalE164OrNull(
          {body_indent}    AndroidPhoneNumberCanonicalizer.normalizeWithKnownRegion(
          {body_indent}        lookupNumber,
          {body_indent}        observedRegion
          {body_indent}    )
          {body_indent})
          {body_indent}val directoryTarget = PhoneDirectoryRoutingPolicy.targetFor(canonicalLookupNumber)
          {body_indent}lookupRunning = true
          {body_indent}directoryStatus = "Recherche officielle…"
          {body_indent}contactStatus = null
          {body_indent}val remoteReputationAllowed = settings.callerReputationEnrichmentEnabled &&
          {body_indent}    ProtectionModePolicy.permitsCallerNumberEnrichment(settings.protectionMode)
          {body_indent}reputationStatus = when {{
          {body_indent}    !remoteReputationAllowed -> null
          {body_indent}    observedRegion == null -> "Réputation Sentinel suspendue : région de ligne non déterminée."
          {body_indent}    canonicalLookupNumber == null -> "Réputation Sentinel suspendue : numéro international non déterminé."
          {body_indent}    else -> "Réputation Sentinel : analyse…"
          {body_indent}}}
          {body_indent}scope.launch {{
          {body_indent}    val localIdentity = withContext(Dispatchers.IO) {{
          {body_indent}        contacts.find(lookupNumber)
          {body_indent}    }}
          {body_indent}    contactStatus = localIdentity?.let {{ identity ->
          {body_indent}        "Contact : " + identity.displayName + (identity.organisation?.let {{ " · $it" }} ?: "")
          {body_indent}    }}
          {body_indent}    val result = when (directoryTarget) {{
          {body_indent}        PhoneDirectoryRoutingPolicy.Target.RTR -> withContext(Dispatchers.IO) {{
          {body_indent}            runCatching {{
          {body_indent}                val r = rtr.lookup(canonicalLookupNumber.orEmpty())
          {body_indent}                when {{
          {body_indent}                    r == null -> "Format autrichien non reconnu"
          {body_indent}                    r.status == "ambiguous" -> "RTR : attribution ambiguë — aucune identité déduite"
          {body_indent}                    r.matches.isNotEmpty() -> {{
          {body_indent}                        val m = r.matches.first()
          {body_indent}                        "RTR : " + (m.allocationHolder ?: m.status) + (m.area?.let {{ " · $it" }} ?: "")
          {body_indent}                    }}
          {body_indent}                    else -> "RTR : " + r.status
          {body_indent}                }}
          {body_indent}            }}.getOrElse {{ "Répertoire RTR temporairement indisponible" }}
          {body_indent}        }}
          {body_indent}        PhoneDirectoryRoutingPolicy.Target.ARCEP -> withContext(Dispatchers.IO) {{
          {body_indent}            runCatching {{
          {body_indent}                val a = arcep.lookup(canonicalLookupNumber.orEmpty())
          {body_indent}                if (a == null) "ARCEP : aucune attribution correspondante"
          {body_indent}                else "ARCEP : " + (a.attributedOperator ?: a.operatorCode) + (a.territory?.let {{ " · $it" }} ?: "")
          {body_indent}            }}.getOrElse {{ "Répertoire ARCEP temporairement indisponible" }}
          {body_indent}        }}
          {body_indent}        PhoneDirectoryRoutingPolicy.Target.NONE -> if (canonicalLookupNumber == null) {{
          {body_indent}            "Pays indéterminé : aucun annuaire national n’est interrogé."
          {body_indent}        }} else {{
          {body_indent}            "Aucun annuaire officiel intégré pour cet indicatif."
          {body_indent}        }}
          {body_indent}    }}
          {body_indent}    directoryStatus = result
          {body_indent}    if (
          {body_indent}        remoteReputationAllowed &&
          {body_indent}        observedRegion != null &&
          {body_indent}        canonicalLookupNumber != null
          {body_indent}    ) {{
          {body_indent}        reputationStatus = withContext(Dispatchers.IO) {{
          {body_indent}            runCatching {{
          {body_indent}                val r = reputation.evaluate(
          {body_indent}                    callerNumber = canonicalLookupNumber,
          {body_indent}                    recipientCountry = observedRegion,
          {body_indent}                    verificationStatus = "outgoing_user_lookup",
          {body_indent}                    privacyMode = PhonePrivacyFirewall.Mode.ENHANCED,
          {body_indent}                    explicitConsent = settings.callerReputationEnrichmentEnabled
          {body_indent}                )
          {body_indent}                "Réputation Sentinel : risque " + r.riskScore + "/100 · " + r.action +
          {body_indent}                    if (r.flags.isNotEmpty()) " · " + r.flags.take(3).joinToString(", ") else ""
          {body_indent}            }}.getOrElse {{ "Réputation Sentinel temporairement indisponible" }}
          {body_indent}        }}
          {body_indent}    }}
          {body_indent}    lookupRunning = false
          {body_indent}}}
          {indent}}}

          '''
          text = text[:line_start] + new_lookup + text[end_line_start:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify forbidden region fallbacks are gone from dialer
        shell: bash
        run: |
          ! grep -F 'recipientCountry = "FR"' native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt
          ! grep -F 'val at = RtrDirectoryClient.normalize(lookupNumber)' native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt
          grep -F 'PhoneDirectoryRoutingPolicy.targetFor(canonicalLookupNumber)' native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt
          grep -F 'recipientCountry = observedRegion' native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'sentinel-autopilot'
          git config user.email 'sentinel-autopilot@users.noreply.github.com'
          git add native-android-app/app/src/main/java/com/sentinel/quantum/SentinelDialerActivity.kt
          git diff --cached --check
          git commit -m 'fix(phone-core): make dialer lookups region-safe'
          git push origin HEAD:fix/phone-number-region-safe-20261004
