name: Intel Public Data Validation

on:
  pull_request:
    paths:
      - 'security/threat-intelligence/**'
      - 'security/endpoint/**'
      - 'osint-intelligence/public-data/**'
      - 'public/threat-intelligence.*'
      - '.github/workflows/intel-public-data-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check security/threat-intelligence/vulnerability-source-registry.js
          node --check osint-intelligence/public-data/source-registry.js
          node --check security/endpoint/registry-filter.js
          node --check public/threat-intelligence.js
      - name: Unit tests
        run: |
          node --test security/threat-intelligence/vulnerability-source-registry.test.js
          node --test osint-intelligence/public-data/source-registry.test.js
          node --test security/endpoint/registry-filter.test.js
