name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  APK_NAME: SentinelQuantumVanguardAIPro

jobs:
  build-and-release:
    name: Build Signed Release APK and Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "ERROR: release workflow must run from a tag"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi

          git fetch origin main --no-tags --depth=1
          if ! git merge-base --is-ancestor "$SHA" "origin/main"; then
            echo "ERROR: tag commit $SHA is not reachable from origin/main"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release provenance validated: $TAG -> $SHA -> main"

      - name: Validate required secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=(RELEASE_KEYSTORE_BASE64)
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=(RELEASE_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(RELEASE_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(RELEASE_KEY_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'ERROR: missing required release secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Required release secrets are configured."

      - name: Set up Node.js 18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: android-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Install Node dependencies
        working-directory: android-app
        run: npm ci --ignore-scripts

      - name: Decode release keystore
        working-directory: android-app/android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          size=$(stat -c%s release.keystore)
          if (( size < 1000 )); then
            echo "ERROR: decoded keystore is unexpectedly small"
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Make gradlew executable
        working-directory: android-app/android
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android-app/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="android-app/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          size=$(stat -c%s "$APK_PATH")
          if (( size < 10485760 )); then
            echo "ERROR: APK is unexpectedly small: $size bytes"
            exit 1
          fi
          if ! command -v apksigner >/dev/null 2>&1; then
            echo "ERROR: Android build tools apksigner is required for release verification"
            exit 1
          fi
          apksigner verify --verbose "$APK_PATH"
          echo "APK exists, meets minimum size, and signature verification passed."

      - name: Cleanup sensitive files
        if: always()
        working-directory: android-app/android/app
        run: |
          if [[ -f release.keystore ]]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u release.keystore || rm -f release.keystore
            else
              rm -f release.keystore
            fi
          fi

      - name: Package APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="${APK_NAME}-v${VERSION}.apk"
          cp android-app/android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          sha256sum "$APK_FILE" > "${APK_FILE}.sha256"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "Checksum: $(cut -d' ' -f1 "${APK_FILE}.sha256")"

      - name: Generate release notes
        shell: bash
        run: |
          cat > release_notes.md <<EOF
          # Sentinel Quantum Vanguard AI Pro — Android Release v${VERSION}

          Official signed Android release for tag \`v${VERSION}\`.

          ## Verification
          - Tag commit is verified to be reachable from \`main\`.
          - APK signature is verified with \`apksigner\` before publication.
          - SHA-256 checksum is published alongside the APK.
          - Release is produced only by this tag-triggered workflow.

          ## Installation
          Install the APK on a compatible Android device and review requested permissions before activation.

          ## Integrity
          Verify the published checksum with \`sha256sum -c ${APK_FILE}.sha256\`.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            ${{ env.APK_FILE }}
            ${{ env.APK_FILE }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
