# CodeQL Advanced Security Analysis (reference workflow; primary workflow is codeql-analysis.yml)
name: "CodeQL Advanced (REFERENCE)"

on:
  workflow_dispatch:
    inputs:
      enable_warning:
        description: 'Reference workflow. Use codeql-analysis.yml for normal analysis.'
        required: false

jobs:
  reference_notice:
    name: Reference Workflow Notice
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Notice
        run: |
          echo "This reference workflow is not the primary CodeQL configuration."
          exit 0

      - name: Checkout repository (reference only)
        if: ${{ false }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL (reference only)
        if: ${{ false }}
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Autobuild (reference only)
        if: ${{ false }}
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Analyze (reference only)
        if: ${{ false }}
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
