name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Android manifest security
        run: node scripts/check-android-manifest.js

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: ./native-android-app
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: ./native-android-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK package, alignment and signature
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          test -s "$APK_PATH"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)
          test -n "$BUILD_TOOLS_DIR"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

          PACKAGE_NAME=$("$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -n1)
          test "$PACKAGE_NAME" = "com.sentinel.quantum"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Install and launch APK on Android 10 emulator
        timeout-minutes: 30
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"

          timeout 600s sdkmanager "emulator" "platforms;android-29" "system-images;android-29;google_apis;x86_64"
          timeout 60s bash -c 'echo "no" | avdmanager create avd --force --name sentinel_phone_core_ci --package "system-images;android-29;google_apis;x86_64"'

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi

          "$ANDROID_HOME/emulator/emulator" \
            -avd sentinel_phone_core_ci \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot-load -no-snapshot-save \
            "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/sentinel-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          DEVICE_READY=0
          for _ in $(seq 1 90); do
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }'; then
              DEVICE_READY=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo "Android emulator exited before becoming available to adb."
              cat "$RUNNER_TEMP/sentinel-emulator.log"
              exit 1
            fi
            sleep 2
          done
          if [[ "$DEVICE_READY" != "1" ]]; then
            echo "Android emulator did not become available to adb within 180 seconds."
            adb devices -l || true
            cat "$RUNNER_TEMP/sentinel-emulator.log"
            exit 1
          fi

          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            cat "$RUNNER_TEMP/sentinel-emulator.log"
            exit 1
          fi

          adb install -r "$APK_PATH"
          adb shell pm path com.sentinel.quantum | grep -q '^package:'
          # Some hosted Android 10 emulator images deny clearing individual log buffers.
          # Log clearing is diagnostic hygiene, not an installability gate.
          adb logcat -c >/dev/null 2>&1 || true
          adb shell am start -n com.sentinel.quantum/.MainActivity | tee "$RUNNER_TEMP/sentinel-launch.txt"

          FIRST_RUN_READY=0
          for _ in $(seq 1 30); do
            # MainActivity can become RESUMED before the one-shot Phone Core hand-off has
            # completed. Require the persisted decision itself before force-stopping the app,
            # otherwise the smoke test races startup and mistakes the first real hand-off on
            # the next cold launch for an automatic reopen.
            if adb shell run-as com.sentinel.quantum cat shared_prefs/sentinel_first_run_setup.xml 2>/dev/null | grep -q 'name="phone_core_setup_offered_v1" value="true"'; then
              FIRST_RUN_READY=1
              break
            fi
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION: main|ANR in com\.sentinel\.quantum'; then
              echo "Sentinel crashed or ANR'd during launch."
              adb logcat -d -v time | tail -n 400
              exit 1
            fi
            sleep 1
          done
          if [[ "$FIRST_RUN_READY" != "1" ]]; then
            echo "Sentinel did not persist the Phone Core first-run decision within 30 seconds."
            adb shell dumpsys activity activities || true
            adb shell run-as com.sentinel.quantum sh -c 'for f in shared_prefs/*; do echo "=== $f ==="; cat "$f"; done' 2>/dev/null || true
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

          adb shell pidof com.sentinel.quantum

          # The onboarding offer is one-shot: after the first foreground hand-off,
          # a fresh app launch must return to MainActivity rather than reopening it.
          # Capture task/process truth around force-stop so a restored back stack cannot be
          # confused with a fresh MainActivity decision. These commands are diagnostic only:
          # they do not clear app data, tasks or preferences and do not weaken the gate.
          echo "=== Sentinel state before force-stop ==="
          adb shell dumpsys activity activities | grep -E -C 4 'com\.sentinel\.quantum' || true
          adb shell dumpsys activity recents | grep -E -C 8 'com\.sentinel\.quantum' || true
          adb shell run-as com.sentinel.quantum cat shared_prefs/sentinel_first_run_setup.xml || true

          adb shell am force-stop com.sentinel.quantum

          echo "=== Sentinel state after force-stop, before second start ==="
          adb shell dumpsys activity activities | grep -E -C 4 'com\.sentinel\.quantum' || true
          adb shell dumpsys activity recents | grep -E -C 8 'com\.sentinel\.quantum' || true
          adb shell run-as com.sentinel.quantum cat shared_prefs/sentinel_first_run_setup.xml || true
          adb logcat -c >/dev/null 2>&1 || true

          adb shell am start -W -n com.sentinel.quantum/.MainActivity | tee "$RUNNER_TEMP/sentinel-second-launch.txt"
          echo "=== Sentinel state immediately after second start ==="
          adb shell dumpsys activity activities | grep -E -C 6 'com\.sentinel\.quantum' || true
          adb shell dumpsys activity recents | grep -E -C 8 'com\.sentinel\.quantum' || true
          adb shell run-as com.sentinel.quantum cat shared_prefs/sentinel_first_run_setup.xml || true
          adb logcat -d -v time | grep -E 'ActivityTaskManager|ActivityManager|com\.sentinel\.quantum' | tail -n 250 || true
          SECOND_LAUNCH_OK=0
          for _ in $(seq 1 15); do
            if adb shell dumpsys activity activities 2>/dev/null | grep -Eq 'mResumedActivity.*com\.sentinel\.quantum/\.MainActivity|topResumedActivity=.*com\.sentinel\.quantum/\.MainActivity'; then
              SECOND_LAUNCH_OK=1
              break
            fi
            if adb shell dumpsys activity activities 2>/dev/null | grep -Eq 'mResumedActivity.*com\.sentinel\.quantum/\.PhoneCoreActivationActivity|topResumedActivity=.*com\.sentinel\.quantum/\.PhoneCoreActivationActivity'; then
              echo "Phone Core activation center reopened automatically on second launch."
              exit 1
            fi
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION: main|ANR in com\.sentinel\.quantum'; then
              echo "Sentinel crashed or ANR'd during second launch."
              adb logcat -d -v time | tail -n 400
              exit 1
            fi
            sleep 1
          done
          if [[ "$SECOND_LAUNCH_OK" != "1" ]]; then
            echo "Sentinel MainActivity did not reach resumed state on second launch."
            adb shell dumpsys activity activities || true
            adb logcat -d -v time | tail -n 400
            exit 1
          fi

          adb shell pidof com.sentinel.quantum
          adb shell am force-stop com.sentinel.quantum

      - name: Get version and prepare APK
        id: version
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | awk -F'"' '{print $2}')
          test -n "$VERSION_NAME"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          NEW_NAME="SentinelQuantumVanguard-v${VERSION_NAME}-debug.apk"
          cp "$APK_PATH" "$NEW_NAME"

          echo "apk_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Built APK: $NEW_NAME"
          ls -lh "$NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SentinelQuantumVanguard-APK-${{ github.sha }}
          path: native-android-app/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
