name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ./native-android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Get version and prepare APK
        id: version
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(awk -F'"' '/versionName/ {print $2; exit}' app/build.gradle)
          test -n "$VERSION_NAME"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          NEW_NAME="SentinelQuantumVanguard-v${VERSION_NAME}-debug.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "APK_NAME=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Built APK: $NEW_NAME"
          ls -lh "$NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SentinelQuantumVanguard-APK
          path: native-android-app/${{ steps.version.outputs.APK_NAME }}
          if-no-files-found: error
