name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ./native-android-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Get version and prepare APK
        id: version
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | awk -F'"' '{print $2}')
          test -n "$VERSION_NAME"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          NEW_NAME="SentinelQuantumVanguard-v${VERSION_NAME}-debug.apk"
          cp "$APK_PATH" "$NEW_NAME"

          echo "apk_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Built APK: $NEW_NAME"
          ls -lh "$NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelQuantumVanguard-APK-${{ github.sha }}
          path: native-android-app/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error

  release:
    name: Publish Android release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: SentinelQuantumVanguard-APK-${{ github.sha }}
          path: release-apk

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 "versionName" native-android-app/app/build.gradle | awk -F'"' '{print $2}')
          test -n "$VERSION_NAME"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}-build-${{ github.run_number }}
          name: Sentinel v${{ steps.version.outputs.version_name }} - Build ${{ github.run_number }}
          body: |
            Android debug build produced by the protected release workflow.
          files: release-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
