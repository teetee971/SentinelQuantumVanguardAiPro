name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Android manifest security
        run: node scripts/check-android-manifest.js

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Verify native Android project boundary
        working-directory: ./native-android-app
        run: |
          set -euo pipefail
          test -f gradlew
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Grant execute permission for gradlew
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        working-directory: ./native-android-app
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Run Android lint
        working-directory: ./native-android-app
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: ./native-android-app
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK package, alignment and signature
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          test -s "$APK_PATH"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n1)
          test -n "$BUILD_TOOLS_DIR"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          test -x "$BUILD_TOOLS_DIR/apksigner"

          PACKAGE_NAME=$("$BUILD_TOOLS_DIR/aapt" dump badging "$APK_PATH" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -n1)
          test "$PACKAGE_NAME" = "com.sentinel.quantum"
          "$BUILD_TOOLS_DIR/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"

      - name: Install and launch APK on Android 10 emulator
        timeout-minutes: 60
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"

          sdkmanager "emulator" "platforms;android-29" "system-images;android-29;google_apis;x86_64"
          timeout 60s bash -c 'echo "no" | avdmanager create avd --force --name sentinel_phone_core_ci --package "system-images;android-29;google_apis;x86_64"'

          "$ANDROID_HOME/emulator/emulator" \
            -avd sentinel_phone_core_ci \
            -no-window -no-audio -no-boot-anim \
            -no-snapshot-load -no-snapshot-save \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/sentinel-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          adb wait-for-device
          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; then
              BOOTED=1
              break
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            cat "$RUNNER_TEMP/sentinel-emulator.log"
            exit 1
          fi

          adb install -r "$APK_PATH"
          adb shell pm path com.sentinel.quantum | grep -q '^package:'
          adb shell am start -W -n com.sentinel.quantum/.MainActivity | tee "$RUNNER_TEMP/sentinel-launch.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/sentinel-launch.txt"
          adb shell am force-stop com.sentinel.quantum

      - name: Get version and prepare APK
        id: version
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -m1 "versionName" app/build.gradle | awk -F'"' '{print $2}')
          test -n "$VERSION_NAME"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -n "$APK_PATH"
          NEW_NAME="SentinelQuantumVanguard-v${VERSION_NAME}-debug.apk"
          cp "$APK_PATH" "$NEW_NAME"

          echo "apk_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "Built APK: $NEW_NAME"
          ls -lh "$NEW_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SentinelQuantumVanguard-APK-${{ github.sha }}
          path: native-android-app/${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
