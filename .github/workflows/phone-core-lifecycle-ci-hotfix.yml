name: Phone Core Lifecycle CI Hotfix

on:
  push:
    branches:
      - recovery/phone-core-emulator-phase2-20261005
    paths:
      - .github/workflows/phone-core-lifecycle-ci-hotfix.yml

permissions:
  contents: write

jobs:
  patch-lifecycle-ci:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: recovery/phone-core-emulator-phase2-20261005
          fetch-depth: 0

      - name: Replace obsolete first-run marker with lifecycle truth
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-native-android.yml')
          text = path.read_text(encoding='utf-8')
          old = '''            # MainActivity can become RESUMED before the Phone Core hand-off has completed.
                      # Require the persistent STARTED marker before force-stopping. STARTED is not
                      # COMPLETED: an unfinished wizard must resume on the next cold launch.
                      if adb shell run-as com.sentinel.quantum cat shared_prefs/sentinel_first_run_setup.xml 2>/dev/null | grep -q 'name="phone_core_setup_started_v2" value="true"'; then
                        FIRST_RUN_READY=1
                        break
                      fi'''
          new = '''            # MainActivity can become RESUMED before the Phone Core hand-off has completed.
                      # Require the canonical lifecycle state before force-stopping. IN_PROGRESS is
                      # not success: runtime Android facts remain authoritative and an interrupted
                      # setup must resume on the next cold launch.
                      if adb shell run-as com.sentinel.quantum cat shared_prefs/phone_core_setup_wizard_v2.xml 2>/dev/null | grep -Eq 'name="lifecycle_state_v1">(OFFERED|IN_PROGRESS)<'; then
                        FIRST_RUN_READY=1
                        break
                      fi'''
          if text.count(old) != 1:
              raise SystemExit('first-run lifecycle marker anchor is not unique')
          text = text.replace(old, new, 1)

          old_error = '''            echo "Sentinel did not persist the Phone Core setup STARTED state within 30 seconds."'''
          new_error = '''            echo "Sentinel did not persist the canonical Phone Core setup lifecycle state within 30 seconds."'''
          if text.count(old_error) != 1:
              raise SystemExit('first-run lifecycle error anchor is not unique')
          text = text.replace(old_error, new_error, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -q 'phone_core_setup_wizard_v2.xml' .github/workflows/build-native-android.yml
          grep -q 'lifecycle_state_v1' .github/workflows/build-native-android.yml
          if grep -q 'phone_core_setup_started_v2' .github/workflows/build-native-android.yml; then
            echo 'Legacy first-run marker still present'
            exit 1
          fi

      - name: Commit bounded CI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sentinel-ci"
          git config user.email "sentinel-ci@users.noreply.github.com"
          git add .github/workflows/build-native-android.yml
          git diff --cached --exit-code && { echo 'No patch produced'; exit 1; } || true
          git commit -m "fix(ci): qualify canonical Phone Core lifecycle state"
          git push origin HEAD:recovery/phone-core-emulator-phase2-20261005
