name: Frontend Validation

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'index.html'
      - 'frontend/**'
      - 'assets/**'
      - 'cinematic-mode.css'
      - 'cinematic-mode.js'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate HTML files
        run: |
          set -euo pipefail
          test -f index.html
          for file in index.html public/*.html; do
            if [ -f "$file" ]; then
              grep -qi '<html' "$file"
              grep -qi '</html>' "$file"
            fi
          done

      - name: Build frontend
        run: npm run build

      - name: Validate generated output
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -d frontend/dist/public

      - name: Validate no tracking scripts
        run: |
          set -euo pipefail
          if grep -RniE 'google-analytics|gtag|googletagmanager|fbq|facebook\.com/tr' \
            --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=dist .; then
            echo 'ERROR: Tracking scripts detected'
            exit 1
          fi

      - name: Validate modules status
        run: |
          set -euo pipefail
          test -f config/modules.status.json
          jq empty config/modules.status.json
          jq -e '.modules' config/modules.status.json >/dev/null

      - name: Validate current legal pages
        run: |
          set -euo pipefail
          for page in public/legal.html public/privacy.html public/terms.html public/security.html public/faq.html; do
            test -f "$page"
          done

      - name: Validate forbidden local/API endpoints
        run: |
          set -euo pipefail
          if grep -RniE 'http://localhost|https://api\.sentinel' \
            --include='*.html' --include='*.js' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=dist public config; then
            echo 'ERROR: Forbidden hardcoded local/API endpoint detected'
            exit 1
          fi

      - name: Validate generated credentials are absent
        run: |
          set -euo pipefail
          ! find . -type f \( -name 'google-services.json' -o -name '*.keystore' -o -name '*.jks' \) \
            -not -path './node_modules/*' -not -path './.git/*' | grep .

      - name: Summary
        if: always()
        run: echo 'Frontend validation completed.'
