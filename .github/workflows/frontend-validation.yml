name: Frontend Validation

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'index.html'
      - 'frontend/**'
      - 'assets/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/frontend-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-frontend:
    name: Validate static frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate HTML files
        run: |
          set -euo pipefail
          test -f index.html
          for file in index.html public/*.html; do
            if [ -f "$file" ]; then
              grep -qi '<html' "$file"
              grep -qi '</html>' "$file"
            fi
          done

      - name: Validate local links and assets
        run: npm run test:static-links

      - name: Validate module continuity
        run: npm run test:module-continuity

      - name: Validate module interface contracts
        run: npm run test:module-interface-contracts

      - name: Classify module usage
        run: npm run test:module-usage-report

      - name: Enforce module inventory
        run: npm run test:module-inventory

      - name: Validate public claims
        run: npm run test:public-claims

      - name: Build frontend
        run: npm run build

      - name: Validate generated output
        run: |
          set -euo pipefail
          test -s frontend/dist/index.html
          test -d frontend/dist/public
          test -s frontend/dist/public/manifest.json
          test -s frontend/dist/public/sw.js
          test -s frontend/dist/public/icon.svg

      - name: Validate generated output isolation
        env:
          SENTINEL_SCAN_GENERATED: '1'
        run: node scripts/check-sentinel-isolation.js

      - name: Validate no tracking scripts
        run: |
          set -euo pipefail
          if grep -RniE 'google-analytics|gtag|googletagmanager|fbq|facebook\\.com/tr' \
            --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=dist .; then
            echo 'ERROR: Tracking scripts detected'
            exit 1
          fi

      - name: Validate current legal pages
        run: |
          set -euo pipefail
          for page in public/legal.html public/privacy.html public/security.html public/faq.html; do
            test -f "$page"
          done

      - name: Validate forbidden local/API endpoints
        run: |
          set -euo pipefail
          if grep -RniE 'http://localhost|https://api\\.sentinel' \
            --include='*.html' --include='*.js' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=dist public config; then
            echo 'ERROR: Forbidden hardcoded local/API endpoint detected'
            exit 1
          fi

      - name: Validate generated credentials are absent
        run: |
          set -euo pipefail
          ! find . -type f \( -name 'google-''services.json' -o -name '*.keystore' -o -name '*.jks' \) \
            -not -path './node_modules/*' -not -path './.git/*' | grep .

      - name: Summary
        if: always()
        run: echo 'Frontend validation completed.'
