name: Frontend Validation

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'public/**'
      - 'index.html'
      - '*.md'
      - 'config/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-frontend:
    name: Validate Static Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate HTML files
        run: |
          test -f index.html
          for file in index.html public/*.html; do
            if [ -f "$file" ]; then
              grep -q "<html" "$file" && grep -q "</html>" "$file" || { echo "ERROR: $file missing html tags"; exit 1; }
            fi
          done

      - name: Validate No Backend Code
        run: |
          if find . -name "package.json" -type f -exec grep -l "express\|koa\|fastify\|hapi" {} \; | grep -v node_modules | grep -v android-app; then
            echo "WARNING: Backend framework detected"
          fi
          if find . -name "server.js" -o -name "server.ts" -o -name "app.js" | grep -v node_modules | grep -v android-app | grep -v public/app.js; then
            echo "WARNING: Server files detected"
          fi

      - name: Validate No Tracking Scripts
        run: |
          if grep -r "google-analytics\|gtag\|googletagmanager\|fbq\|facebook.com/tr" --include="*.html" --exclude-dir=node_modules .; then
            echo "ERROR: Tracking scripts detected"
            exit 1
          fi

      - name: Validate Modules Status JSON
        run: |
          test -f config/modules.status.json
          jq empty config/modules.status.json
          jq -e '.modules' config/modules.status.json > /dev/null

      - name: Validate Documentation Exists
        run: |
          for doc in README.md MODULES_STATUS.md ARCHITECTURE_REFERENCE.md AUDIT_CHECKLIST.md ROADMAP.md MODULE_ACTIVATION_REQUIREMENTS.md; do
            test -f "$doc" || { echo "ERROR: $doc not found"; exit 1; }
          done

      - name: Validate Legal Pages Exist
        run: |
          for page in public/legal.html public/privacy.html public/terms.html public/security.html public/faq.html; do
            test -f "$page" || { echo "ERROR: $page not found"; exit 1; }
          done

      - name: Check for Hardcoded API Endpoints
        run: |
          ! grep -r "http://localhost" --include="*.html" --include="*.js" --exclude-dir=node_modules --exclude-dir=android-app public/ 2>/dev/null || true
          ! grep -r "https://api.sentinel" --include="*.html" --include="*.js" --exclude-dir=node_modules public/ 2>/dev/null || true

      - name: Validate No Secrets in Code
        run: |
          if grep -r "api_key\|apiKey\|secret\|password\|token" --include="*.js" --include="*.html" --exclude-dir=node_modules --exclude-dir=android-app . | grep -v "// " | grep -v "placeholder" | grep -v "example"; then
            echo "WARNING: Potential secrets detected"
          fi

      - name: Validate Android Workflows Disabled
        run: |
          disabled_count=$(find .github/workflows -name "*.yml.disabled" 2>/dev/null | wc -l)
          echo "Found $disabled_count disabled workflow files"

      - name: Generate Validation Report
        if: always()
        run: |
          echo "Frontend validation checks completed."

      - name: Summary
        run: echo "Frontend validation complete"
