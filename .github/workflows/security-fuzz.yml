name: Security Fuzzing

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/security-fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-module-fuzz:
    name: Phone security fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run fuzz regression campaign
        run: npm run test:fuzz -- --ci
