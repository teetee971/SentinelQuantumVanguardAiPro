name: Security Fuzzing

on:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/security-fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-module-fuzz:
    name: Phone security fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm --version
          node --version
          npm ci --no-audit --no-fund 2>&1 | tee npm-ci.log

      - name: Run fuzz regression campaign
        shell: bash
        run: |
          set +e
          npm run test:fuzz -- --ci --json --outputFile=fuzz-results.json 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          echo "JEST_EXIT_CODE=$status" | tee fuzz-exit-code.txt
          exit "$status"

      - name: Upload fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-fuzz-diagnostics-${{ github.run_id }}
          path: |
            android-app/npm-ci.log
            android-app/fuzz.log
            android-app/fuzz-results.json
            android-app/fuzz-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
