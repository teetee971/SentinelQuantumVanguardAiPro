name: Security Fuzzing

on:
  pull_request:
    paths:
      - 'decision-plane/**'
      - 'security/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/security-fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'decision-plane/**'
      - 'security/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-fuzz:
    name: Deterministic security fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run security fuzz regression
        run: npm run test:security-fuzz
