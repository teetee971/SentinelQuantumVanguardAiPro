name: Security Fuzzing

on:
  pull_request:
    paths:
      - 'decision-plane/**'
      - 'security/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'decision-plane/**'
      - 'security/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-fuzz:
    name: Deterministic security fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run security fuzz regression
        run: npm run test:security-fuzz
