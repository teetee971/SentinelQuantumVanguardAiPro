name: Phone Core ROLE_SMS Process Death

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-core-role-sms-process-death-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-sms-process-death:
    name: ROLE_SMS process death — API ${{ matrix.api_level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 29
            sdk_package_level: '29'
          - api_level: 36
            sdk_package_level: '36'
          - api_level: 37
            sdk_package_level: '37.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Boot emulator and prove role-loss recovery
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
          SDK_PACKAGE_LEVEL: ${{ matrix.sdk_package_level }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          SYSTEM_IMAGE="system-images;android-${SDK_PACKAGE_LEVEL};google_apis;x86_64"
          PLATFORM="platforms;android-${SDK_PACKAGE_LEVEL}"
          AVD_NAME="sentinel_role_sms_api${API_LEVEL}"
          EMULATOR_LOG="$RUNNER_TEMP/sentinel-role-sms-api${API_LEVEL}-emulator.log"
          OUTPUT="$RUNNER_TEMP/phone-core-role-sms-api${API_LEVEL}"
          mkdir -p "$OUTPUT"

          SDK_PACKAGES=("emulator" "$PLATFORM" "$SYSTEM_IMAGE")
          SDK_READY=0
          for attempt in 1 2 3; do
            if timeout 600s sdkmanager "${SDK_PACKAGES[@]}"; then
              SDK_READY=1
              break
            fi
            rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          test "$SDK_READY" = "1"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64/package.xml"
          timeout 60s bash -c "echo no | avdmanager create avd --force --name '$AVD_NAME' --package '$SYSTEM_IMAGE'"

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi
          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -no-metrics \
            -no-snapshot-load -no-snapshot-save "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect > "$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$EMULATOR_PID" >/dev/null 2>&1 || true' EXIT

          DEVICE_READY=0
          for _ in $(seq 1 90); do
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }'; then
              DEVICE_READY=1
              break
            fi
            kill -0 "$EMULATOR_PID"
            sleep 2
          done
          test "$DEVICE_READY" = "1"

          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            kill -0 "$EMULATOR_PID"
            sleep 2
          done
          test "$BOOTED" = "1"
          ACTUAL_API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$ACTUAL_API" = "$API_LEVEL"
          printf 'expected_api=%s\nactual_api=%s\n' "$API_LEVEL" "$ACTUAL_API" > "$OUTPUT/runtime-api.txt"

          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          timeout 180s adb install -r "$APP_APK"
          timeout 180s adb install -r "$TEST_APK"
          adb shell pm clear com.sentinel.quantum | tee "$OUTPUT/app-data-reset.txt"
          grep -Fxq 'Success' "$OUTPUT/app-data-reset.txt"

          bash ../scripts/phone-core-role-sms-process-death-flow.sh "$OUTPUT"
          grep -Fxq 'process_invalidated=1' "$OUTPUT/role-sms-process-death-proof.txt"
          grep -Fxq 'provider_recovery_verified=true' "$OUTPUT/role-sms-process-death-summary.txt"
          grep -Fxq 'transport_invoked=false' "$OUTPUT/role-sms-process-death-summary.txt"
          git rev-parse HEAD > "$OUTPUT/built-commit.txt"

      - name: Collect role-loss logcat
        if: always()
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/phone-core-role-sms-api${API_LEVEL}"
          mkdir -p "$OUTPUT"
          adb logcat -d -v time > "$OUTPUT/logcat.txt" 2> "$OUTPUT/logcat-error.txt" || true
          adb shell dumpsys role > "$OUTPUT/roles.txt" 2>&1 || true
          adb shell dumpsys package com.sentinel.quantum > "$OUTPUT/package.txt" 2>&1 || true

      - name: Upload ROLE_SMS process-death evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhoneCore-Role-SMS-Process-Death-API${{ matrix.api_level }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/phone-core-role-sms-api${{ matrix.api_level }}/
            ${{ runner.temp }}/sentinel-role-sms-api${{ matrix.api_level }}-emulator.log
          if-no-files-found: error
          retention-days: 14
