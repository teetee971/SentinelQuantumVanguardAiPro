name: CTU Czech Numbering Refresh

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctu-numbering-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-github-actions-pinning.js
      - run: node --test scripts/publish-numbering-refresh.test.js
      - run: node --test scripts/update-ctu-numbering.test.js

      - name: Download official CTU resources
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 90 --output /tmp/ctu.csv \
            'https://data.ctu.gov.cz/node/18/download'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 45 --output /tmp/ctu-schema.json \
            'https://ctu.gov.cz/schemas/pridelena_cisla_a_kody.json'
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 45 --output /tmp/ctu-metadata.html \
            'https://data.ctu.gov.cz/dataset/pridelena-cisla-kody/resource/d401d3ec-ae24-4f72-a8b7-a33d2d349012'
          test "$(stat -c '%s' /tmp/ctu.csv)" -gt 100
          test "$(stat -c '%s' /tmp/ctu.csv)" -le 8388608
          test "$(stat -c '%s' /tmp/ctu-schema.json)" -gt 100
          test "$(stat -c '%s' /tmp/ctu-schema.json)" -le 131072
          test "$(stat -c '%s' /tmp/ctu-metadata.html)" -gt 100
          test "$(stat -c '%s' /tmp/ctu-metadata.html)" -le 2097152

      - name: Validate and normalize CTU numbering data
        run: |
          node scripts/update-ctu-numbering.js \
            --input /tmp/ctu.csv \
            --schema /tmp/ctu-schema.json \
            --metadata /tmp/ctu-metadata.html \
            --fetched-at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"

      - name: Validate the complete phone integration and build
        run: |
          npm run test:phone-intelligence
          npm run test:arcep-numbering
          npm run build
      - name: Publish validated data autonomously
        run: node scripts/publish-numbering-refresh.js ctu
