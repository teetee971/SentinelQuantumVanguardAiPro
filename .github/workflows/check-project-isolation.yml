name: Project Isolation Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: Sentinel project isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Sentinel has no cross-project identifiers
        run: bash scripts/security/check-project-isolation.sh
