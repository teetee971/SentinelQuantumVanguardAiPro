name: Build Android APK

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Android project boundary
        working-directory: ./android-app/android
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f gradlew
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        working-directory: ./android-app/android
        run: chmod +x ./gradlew

      - name: Display Gradle version
        working-directory: ./android-app/android
        run: ./gradlew --version

      - name: Clean project
        working-directory: ./android-app/android
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Build all debug variants
        working-directory: ./android-app/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: List generated APKs
        working-directory: ./android-app/android
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-APK-${{ github.sha }}
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
