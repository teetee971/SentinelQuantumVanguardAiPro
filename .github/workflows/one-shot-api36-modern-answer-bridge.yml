name: One-shot API36 modern answer bridge fix

on:
  push:
    branches: [fix/api37-incoming-answer-sync]
    paths:
      - '.github/workflows/one-shot-api36-modern-answer-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/api37-incoming-answer-sync
      - name: Generalize causal modem bridge to API 36 and 37
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          flow_path = Path('scripts/phone-core-emulator-flow.sh')
          flow = flow_path.read_text()
          replacements = [
              ('if [[ "$FLOW_API" -lt 37 ]]; then', 'if [[ "$FLOW_API" -lt 36 ]]; then'),
              ('# Android 17 can drop the synthetic incoming GSM leg within only a few milliseconds after', '# Android 16/17 can leave the synthetic incoming GSM leg unsynchronized when Telecom answers,'),
              ('# Telecom begins answering. Paying the startup cost of a second `adb emu` command after ANSWERED', '# and Android 17 can drop/recreate it within only a few milliseconds. Paying the startup cost of a second'),
              ('# is therefore nondeterministic. Arm a host-only helper before the tap: it pre-authenticates a', '# `adb emu` command after ANSWERED is therefore nondeterministic. Arm a host-only helper before the tap:'),
              ('# local emulator-console socket, waits for Telecom\'s causal answer-transaction marker (emitted', '# it pre-authenticates a local emulator-console socket, waits for Telecom\'s causal answer-transaction marker'),
              ('# only after Sentinel requested Call.answer()), synchronizes the synthetic modem immediately,', '# (emitted only after Sentinel requested Call.answer()), synchronizes the synthetic modem immediately,'),
              ('# remains mandatory. This never runs below API 37 and never accepts a non-emulator adb target.', '# remains mandatory. This never runs below API 36 and never accepts a non-emulator adb target.'),
              ('python3 "$FLOW_SCRIPT_DIR/phone-core-emulator-api37-answer-bridge.py" \\\n    --number "$FLOW_NUMBER" \\', 'python3 "$FLOW_SCRIPT_DIR/phone-core-emulator-api37-answer-bridge.py" \\\n    --api "$FLOW_API" \\\n    --number "$FLOW_NUMBER" \\'),
          ]
          for old, new in replacements:
              if old not in flow:
                  raise SystemExit(f'flow replacement anchor missing: {old!r}')
              flow = flow.replace(old, new, 1)
          flow_path.write_text(flow)

          helper_path = Path('scripts/phone-core-emulator-api37-answer-bridge.py')
          helper = helper_path.read_text()
          helper = helper.replace(
              '"""Synchronize Android 17 emulator GSM transport inside a real Telecom answer request.',
              '"""Synchronize Android 16/17 emulator GSM transport inside a real Telecom answer request.',
              1,
          )
          helper = helper.replace(
              'def run_bridge(number: str, evidence: Path, marker_file: Path, timeout_s: float) -> None:',
              'def run_bridge(api: int, number: str, evidence: Path, marker_file: Path, timeout_s: float) -> None:',
              1,
          )
          if helper.count('api=37 number={number}') != 2:
              raise SystemExit(f'expected two hard-coded API markers, found {helper.count("api=37 number={number}")}')
          helper = helper.replace('api=37 number={number}', 'api={api} number={number}')
          helper = helper.replace(
              '    parser = argparse.ArgumentParser()\n    parser.add_argument("--number", required=True)',
              '    parser = argparse.ArgumentParser()\n    parser.add_argument("--api", type=int, choices=(36, 37), required=True)\n    parser.add_argument("--number", required=True)',
              1,
          )
          helper = helper.replace(
              '        run_bridge(args.number, evidence, marker_file, args.timeout)',
              '        run_bridge(args.api, args.number, evidence, marker_file, args.timeout)',
              1,
          )
          helper = helper.replace(
              '        print(f"API 37 incoming-answer transport bridge failed: {exc}", file=sys.stderr)',
              '        print(f"API {args.api} incoming-answer transport bridge failed: {exc}", file=sys.stderr)',
              1,
          )
          helper_path.write_text(helper)

          test_path = Path('scripts/phone-core-emulator-api37-answer-bridge.test.js')
          test = test_path.read_text()
          test = test.replace(
              "async function runFixture({ lines, gsmResponse = 'OK\\n', serial = null }) {",
              "async function runFixture({ lines, gsmResponse = 'OK\\n', serial = null, api = 37 }) {",
              1,
          )
          test = test.replace(
              "const args = [helper, '--number', '5550100', '--evidence', evidence, '--marker-file', marker, '--timeout', '1.5'];",
              "const args = [helper, '--api', String(api), '--number', '5550100', '--evidence', evidence, '--marker-file', marker, '--timeout', '1.5'];",
              1,
          )
          anchor = "test('API 37 bridge accepts the compact ANSWERED -> ACTIVE log format for the same call', async () => {"
          api36_test = """test('API 36 bridge binds the same causal call and records API 36 provenance', async () => {\n  const compactAnswered = ANSWERED.replace('RINGING(RINGING)', 'RINGING');\n  const result = await runFixture({ api: 36, lines: [REQUEST, ACCEPT, compactAnswered, ACTIVE_COMPACT] });\n  assert.equal(result.status, 0, result.stderr);\n  assert.deepEqual(result.calls, ['auth fixture-token', 'gsm accept 5550100']);\n  assert.match(result.evidence, /transport_sync=.*api=36 .*call_id=TC@1 transaction=TX1/);\n});\n\n"""
          if anchor not in test:
              raise SystemExit('API36 test insertion anchor missing')
          test = test.replace(anchor, api36_test + anchor, 1)
          test_path.write_text(test)

          teardown_path = Path('security/phone-intelligence/phone-core-emulator-call-teardown.test.js')
          teardown = teardown_path.read_text()
          teardown_replacements = [
              ("test('incoming answer stays Sentinel-owned and API 37 evidence is bound to one Telecom transaction and call id', () => {",
               "test('incoming answer stays Sentinel-owned and API 36/37 evidence is bound to one Telecom transaction and call id', () => {"),
              ('const api37Guard = bridge.indexOf(\'if [[ "$FLOW_API" -lt 37 ]]\');',
               'const api36Guard = bridge.indexOf(\'if [[ "$FLOW_API" -lt 36 ]]\');'),
              ("const helperInvocation = bridge.indexOf('phone-core-emulator-api37-answer-bridge.py', api37Guard);",
               "const helperInvocation = bridge.indexOf('phone-core-emulator-api37-answer-bridge.py', api36Guard);"),
              ("assert.ok(api37Guard >= 0, 'the incoming modem bridge must remain restricted to API 37+');",
               "assert.ok(api36Guard >= 0, 'the incoming modem bridge must remain restricted to API 36+');"),
              ("assert.ok(helperInvocation > api37Guard, 'API 37 synchronization must delegate to the preconnected helper');",
               "assert.ok(helperInvocation > api36Guard, 'API 36+ synchronization must delegate to the preconnected helper');"),
          ]
          for old, new in teardown_replacements:
              if old not in teardown:
                  raise SystemExit(f'teardown replacement anchor missing: {old!r}')
              teardown = teardown.replace(old, new, 1)
          teardown_path.write_text(teardown)
          PY
          node --test scripts/phone-core-emulator-api37-answer-bridge.test.js security/phone-intelligence/phone-core-api37-answer-bridge.test.js security/phone-intelligence/phone-core-emulator-call-teardown.test.js
          npm run test:android-product-truth
          git diff --check
      - name: Commit tested fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'teetee971'
          git config user.email 'thierrynaud2009@gmail.com'
          git add scripts/phone-core-emulator-flow.sh scripts/phone-core-emulator-api37-answer-bridge.py scripts/phone-core-emulator-api37-answer-bridge.test.js security/phone-intelligence/phone-core-emulator-call-teardown.test.js
          git commit -m 'fix(phone-core): synchronize API36 incoming modem transport'
          git push origin HEAD:fix/api37-incoming-answer-sync
