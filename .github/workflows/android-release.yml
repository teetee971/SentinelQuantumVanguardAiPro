name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: android-production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHA="${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "ERROR: release workflow must run from a tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag: $TAG"
            exit 1
          fi
          git fetch origin main --no-tags --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$SHA" != "$MAIN_SHA" ]]; then
            echo "ERROR: release tag must point to the current origin/main head ($MAIN_SHA)"
            exit 1
          fi
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' native-android-app/app/build.gradle)"
          if [[ -z "$VERSION_NAME" || "$TAG" != "v$VERSION_NAME" ]]; then
            echo "ERROR: tag $TAG does not match Android versionName $VERSION_NAME"
            exit 1
          fi
          echo "Release provenance validated: $TAG -> $SHA -> current main"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          test -s /tmp/release.keystore

      - name: Grant gradlew permission
        working-directory: native-android-app
        run: chmod +x gradlew

      - name: Build signed APK and AAB
        working-directory: native-android-app
        env:
          KEYSTORE_FILE: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify signed APK and AAB integrity and contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(native-android-app/app/build/outputs/apk/release/*.apk)
          aabs=(native-android-app/app/build/outputs/bundle/release/*.aab)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi
          if [[ "${#aabs[@]}" -ne 1 ]]; then
            echo "ERROR: expected exactly one signed release AAB, found ${#aabs[@]}"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            test -s "$apk"
            apksigner verify --verbose --print-certs "$apk" | tee "$apk.certificates.txt"
            test -s "$apk.certificates.txt"
            if unzip -Z1 "$apk" | grep -Eiq '(^|/)(google-''services\.json|.*\.keystore|.*\.jks)$|fire''base'; then
              echo "ERROR: forbidden Firebase/credential material found inside release APK: $apk"
              exit 1
            fi
            sha256sum "$apk" > "$apk.sha256"
            sha256sum -c "$apk.sha256"
          done

          for aab in "${aabs[@]}"; do
            test -s "$aab"
            jarsigner -verify -strict "$aab"
            keytool -printcert -jarfile "$aab" | tee "$aab.certificates.txt"
            test -s "$aab.certificates.txt"
            if unzip -Z1 "$aab" | grep -Eiq '(^|/)(google-''services\.json|.*\.keystore|.*\.jks)$|fire''base'; then
              echo "ERROR: forbidden Firebase/credential material found inside release AAB: $aab"
              exit 1
            fi
            sha256sum "$aab" > "$aab.sha256"
            sha256sum -c "$aab.sha256"
          done

      - name: Generate SBOM and release evidence
        shell: bash
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --package-lock-only > release-sbom.cdx.json
          args=(--sbom release-sbom.cdx.json --output release-evidence.json)
          for apk in native-android-app/app/build/outputs/apk/release/*.apk; do
            args+=(--artifact "$apk" --artifact "$apk.sha256" --artifact "$apk.certificates.txt")
          done
          for aab in native-android-app/app/build/outputs/bundle/release/*.aab; do
            args+=(--artifact "$aab" --artifact "$aab.sha256" --artifact "$aab.certificates.txt")
          done
          node scripts/generate-release-evidence.js "${args[@]}"

      - name: Verify release evidence bundle
        run: node scripts/verify-android-release-evidence.js --root . --evidence release-evidence.json

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SentinelQuantumVanguardAIPro-Android-${{ github.ref_name }}
          path: |
            native-android-app/app/build/outputs/apk/release/*.apk
            native-android-app/app/build/outputs/apk/release/*.apk.sha256
            native-android-app/app/build/outputs/apk/release/*.apk.certificates.txt
            native-android-app/app/build/outputs/bundle/release/*.aab
            native-android-app/app/build/outputs/bundle/release/*.aab.sha256
            native-android-app/app/build/outputs/bundle/release/*.aab.certificates.txt
            release-sbom.cdx.json
            release-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            native-android-app/app/build/outputs/apk/release/*.apk
            native-android-app/app/build/outputs/apk/release/*.apk.sha256
            native-android-app/app/build/outputs/apk/release/*.apk.certificates.txt
            native-android-app/app/build/outputs/bundle/release/*.aab
            native-android-app/app/build/outputs/bundle/release/*.aab.sha256
            native-android-app/app/build/outputs/bundle/release/*.aab.certificates.txt
            release-sbom.cdx.json
            release-evidence.json
          body: |
            APK et AAB signés générés depuis le commit exact du tag.

            Cette release reste en brouillon jusqu'à la vérification des checksums,
            des certificats et des essais d'installation sur appareils réels.

            IMPORTANT : l'APK construit par cette CI ne doit pas être publié comme
            canal direct tant que la stratégie Play App Signing n'est pas figée.
            Si Google Play utilise une clé de signature d'application différente
            de la clé d'upload, utiliser soit une clé d'application que nous contrôlons
            et que nous fournissons à Play, soit un APK universel signé par Play
            pour la distribution hors Play.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        shell: bash
        run: rm -f /tmp/release.keystore
