name: Phone Core Android Emulation Qualification

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-core-emulation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-host-tests:
    name: Emulation contract, all module tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate emulator qualification contract
        run: node scripts/check-phone-core-emulation-gate.js

      - name: Test emulator evidence failure paths
        run: node scripts/phone-core-emulator-evidence.test.js

      - name: Validate Android product truth
        run: npm run test:android-product-truth

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Prepare Gradle wrapper
        working-directory: ./native-android-app
        run: chmod +x ./gradlew

      - name: App unit tests
        working-directory: ./native-android-app
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Preserve complete app unit test reports before focused reruns
        if: always()
        working-directory: ./native-android-app
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/phone-core-host-evidence"
          mkdir -p "$OUTPUT"
          if [[ -d app/build/test-results/testDebugUnitTest ]]; then
            cp -a app/build/test-results/testDebugUnitTest "$OUTPUT/app-unit-test-results"
          fi
          if [[ -d app/build/reports/tests/testDebugUnitTest ]]; then
            cp -a app/build/reports/tests/testDebugUnitTest "$OUTPUT/app-unit-test-reports"
          fi

      - name: Phone number canonicalization contract
        working-directory: ./native-android-app
        run: ./gradlew :app:testDebugUnitTest --tests 'com.sentinel.quantum.security.CallRuleEngineTest' --stacktrace --no-daemon

      - name: Multi-SIM submit readiness contract
        working-directory: ./native-android-app
        run: ./gradlew :app:testDebugUnitTest --tests 'com.sentinel.quantum.security.SmsSubmitReadinessTest' --stacktrace --no-daemon

      - name: Wearable contract unit tests
        working-directory: ./native-android-app
        run: ./gradlew :wearable-contract:test --stacktrace --no-daemon

      - name: Wearable security unit tests
        working-directory: ./native-android-app
        run: ./gradlew :wearable-security:test --stacktrace --no-daemon

      - name: Android app lint
        working-directory: ./native-android-app
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Assemble Android debug APK
        working-directory: ./native-android-app
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Assemble Android instrumentation APK
        working-directory: ./native-android-app
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Record host evidence provenance
        if: always()
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          BUILT_COMMIT="$(git rev-parse HEAD)" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          if (process.env.BUILT_COMMIT !== process.env.GITHUB_SHA) {
            throw new Error('Host checkout does not match the workflow commit');
          }
          const output = path.join(process.env.RUNNER_TEMP, 'phone-core-host-evidence');
          fs.mkdirSync(output, { recursive: true });
          fs.writeFileSync(path.join(output, 'provenance.json'), JSON.stringify({
            qualification_scope: 'developer_qualification',
            rollout_mode: 'shadow',
            physical_validation: false,
            commercial_readiness: false,
            built_commit: process.env.BUILT_COMMIT,
            workflow_commit: process.env.GITHUB_SHA,
            source_head_sha: process.env.SOURCE_HEAD_SHA,
            source_base_sha: process.env.SOURCE_BASE_SHA || null,
            source_head_ref: process.env.SOURCE_HEAD_REF,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT
          }, null, 2) + '\n');
          NODE

      - name: Upload host qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhoneCore-Host-Qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/phone-core-host-evidence/
            native-android-app/wearable-contract/build/test-results/
            native-android-app/wearable-contract/build/reports/tests/
            native-android-app/wearable-security/build/test-results/
            native-android-app/wearable-security/build/reports/tests/
            native-android-app/app/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 14

  emulator-matrix:
    name: PhoneCore-Emulation-Qualification API ${{ matrix.api_level }}
    needs: contract-and-host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api_level: 24
            sdk_package_level: '24'
          - api_level: 29
            sdk_package_level: '29'
          - api_level: 36
            sdk_package_level: '36'
          - api_level: 37
            sdk_package_level: '37.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Boot Android emulator
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
          SDK_PACKAGE_LEVEL: ${{ matrix.sdk_package_level }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          IMAGE="system-images;android-${SDK_PACKAGE_LEVEL};google_apis;x86_64"
          PLATFORM="platforms;android-${SDK_PACKAGE_LEVEL}"
          SDK_PACKAGES=("emulator" "$PLATFORM" "$IMAGE")
          SDK_READY=0
          for attempt in 1 2 3; do
            if timeout 600s sdkmanager "${SDK_PACKAGES[@]}"; then
              SDK_READY=1
              break
            fi
            echo "SDK/emulator installation failed on attempt ${attempt} for runtime API ${API_LEVEL}; cleaning partial payloads."
            rm -rf "$ANDROID_HOME/emulator" "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64"
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 5)); fi
          done
          if [[ "$SDK_READY" != "1" ]]; then
            echo "Unable to install Android emulator packages for runtime API ${API_LEVEL} (SDK package ${SDK_PACKAGE_LEVEL})."
            sdkmanager --list | grep -E "android-${API_LEVEL}|android-${SDK_PACKAGE_LEVEL}" || true
            exit 1
          fi

          test -x "$ANDROID_HOME/emulator/emulator"
          test -f "$ANDROID_HOME/system-images/android-${SDK_PACKAGE_LEVEL}/google_apis/x86_64/package.xml"
          AVD_NAME="sentinel_phone_core_api${API_LEVEL}"
          timeout 60s bash -c "echo no | avdmanager create avd --force --name '$AVD_NAME' --package '$IMAGE'"

          EMULATOR_ACCEL_ARGS=(-no-accel)
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            EMULATOR_ACCEL_ARGS=(-accel on)
          fi

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim -no-metrics \
            -no-snapshot-load -no-snapshot-save \
            "${EMULATOR_ACCEL_ARGS[@]}" \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/sentinel-emulator-api${API_LEVEL}.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sentinel-emulator.pid"

          DEVICE_READY=0
          for _ in $(seq 1 90); do
            if adb devices | awk 'NR > 1 && $2 == "device" { found=1 } END { exit !found }'; then
              DEVICE_READY=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/sentinel-emulator.pid")" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/sentinel-emulator-api${API_LEVEL}.log"
              exit 1
            fi
            sleep 2
          done
          test "$DEVICE_READY" = "1"

          BOOTED=0
          for _ in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/sentinel-emulator.pid")" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/sentinel-emulator-api${API_LEVEL}.log"
              exit 1
            fi
            sleep 2
          done
          if [[ "$BOOTED" != "1" ]]; then
            cat "$RUNNER_TEMP/sentinel-emulator-api${API_LEVEL}.log"
            exit 1
          fi

          ACTUAL_API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          ACTUAL_RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
          ACTUAL_CODENAME="$(adb shell getprop ro.build.version.codename | tr -d '\r')"
          echo "Emulator ready: Android ${ACTUAL_RELEASE} (${ACTUAL_CODENAME}), API ${ACTUAL_API}."
          if [[ "$ACTUAL_API" != "$API_LEVEL" ]]; then
            echo "Expected runtime API ${API_LEVEL}, got API ${ACTUAL_API}."
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell wm dismiss-keyguard || true

      - name: Run connected instrumentation suite
        id: instrumentation
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
        run: |
          set -euo pipefail
          if [[ "$API_LEVEL" == "24" ]]; then
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
            APP_APK="app/build/outputs/apk/debug/app-debug.apk"
            TEST_APK="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
            test -s "$APP_APK"
            test -s "$TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            INSTRUMENTATION_RUNNER="$(
              adb shell pm list instrumentation | tr -d '\r' |
                awk '/^instrumentation:com\.sentinel\.quantum\.test\// {
                  sub(/^instrumentation:/, "")
                  sub(/ .*/, "")
                  print
                  exit
                }'
            )"
            if [[ -z "$INSTRUMENTATION_RUNNER" ]]; then
              echo "Android API 24 instrumentation runner was not registered."
              adb shell pm list instrumentation || true
              exit 1
            fi
            INSTRUMENTATION_LOG="$RUNNER_TEMP/sentinel-instrumentation-api24-tests.log"
            set +e
            timeout --signal=INT --kill-after=30s 900s \
              adb shell am instrument -w -r "$INSTRUMENTATION_RUNNER" |
              tr -d '\r' |
              tee "$INSTRUMENTATION_LOG"
            INSTRUMENTATION_STATUS=${PIPESTATUS[0]}
            set -e
            if [[ "$INSTRUMENTATION_STATUS" -ne 0 ]]; then
              echo "Android API 24 instrumentation failed or exceeded its 15 minute watchdog (status ${INSTRUMENTATION_STATUS})."
              exit "$INSTRUMENTATION_STATUS"
            fi
            if grep -Eq '^FAILURES!!!|^INSTRUMENTATION_FAILED:|Process crashed' "$INSTRUMENTATION_LOG"; then
              echo "Android API 24 instrumentation reported a test failure or crash."
              exit 1
            fi
            if ! grep -Eq '^OK \([1-9][0-9]* tests?\)$' "$INSTRUMENTATION_LOG"; then
              echo "Android API 24 instrumentation did not report a non-zero passing test count."
              exit 1
            fi
          else
            timeout --signal=INT --kill-after=30s 900s \
              ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
          fi

      - name: Run emulator application/runtime qualification
        id: runtime
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HOST_CONTRACT_RESULT: ${{ needs.contract-and-host-tests.result }}
          INSTRUMENTATION_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$APK_PATH"
          OUTPUT="$RUNNER_TEMP/phone-core-emulation-api${API_LEVEL}"
          mkdir -p "$OUTPUT"
          # Runtime evidence must start from a fresh app scope and fresh log buffer.
          # A failed reset must not reuse instrumentation events as runtime evidence.
          # UTP removes the app after connected tests on modern API lanes. Install
          # the exact runtime APK before requiring a successful app-data reset.
          adb install -r "$APK_PATH"
          adb shell pm clear com.sentinel.quantum > "$OUTPUT/runtime-app-reset.txt" 2>&1
          grep -Fxq 'Success' "$OUTPUT/runtime-app-reset.txt"
          adb logcat -c > "$OUTPUT/runtime-logcat-reset.txt" 2>&1

          if [[ "$API_LEVEL" -ge 29 ]]; then
            # Role establishment and proof are owned by the runtime scripts. They use the modern
            # get-role-holders shell command when available and a dumpsys-role proof on API 29.
            bash ../scripts/phone-core-emulator-flow.sh "$OUTPUT"
            bash ../scripts/phone-core-emulator-revocation-flow.sh "$OUTPUT"
          else
            adb shell am force-stop com.sentinel.quantum
            adb shell am start -W -n com.sentinel.quantum/.MainActivity > "$OUTPUT/min-sdk-first-launch.txt" 2>&1
            sleep 3
            adb shell pidof com.sentinel.quantum > "$OUTPUT/min-sdk-first-pid.txt"
            adb exec-out screencap -p > "$OUTPUT/01-min-sdk-first-launch.png" || true
            if adb logcat -d -v brief | grep -Eq 'FATAL EXCEPTION:|ANR in com\.sentinel\.quantum'; then
              echo "Crash/ANR detected on minSdk first launch."
              adb logcat -d -v time | tail -n 400
              exit 1
            fi
            adb shell am force-stop com.sentinel.quantum
            adb shell am start -W -n com.sentinel.quantum/.MainActivity > "$OUTPUT/min-sdk-second-launch.txt" 2>&1
            sleep 3
            adb shell pidof com.sentinel.quantum > "$OUTPUT/min-sdk-second-pid.txt"
            adb exec-out screencap -p > "$OUTPUT/02-min-sdk-second-launch.png" || true
          fi

      - name: Collect qualification evidence even after failure
        if: always()
        working-directory: ./native-android-app
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api_level }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          HOST_CONTRACT_RESULT: ${{ needs.contract-and-host-tests.result }}
          INSTRUMENTATION_OUTCOME: ${{ steps.instrumentation.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/phone-core-emulation-api${API_LEVEL}"
          mkdir -p "$OUTPUT"
          LOGCAT_STATUS=0
          adb logcat -d -v time > "$OUTPUT/logcat.txt" 2> "$OUTPUT/logcat-error.txt" || LOGCAT_STATUS=$?
          printf '%s\n' "$LOGCAT_STATUS" > "$OUTPUT/logcat-status.txt"
          adb shell dumpsys telecom > "$OUTPUT/telecom.txt" 2>&1 || true
          adb shell dumpsys role > "$OUTPUT/roles.txt" 2>&1 || true
          adb shell dumpsys package com.sentinel.quantum > "$OUTPUT/package.txt" 2>&1 || true

          if [[ -s app/build/outputs/apk/debug/app-debug.apk ]]; then
            sha256sum app/build/outputs/apk/debug/app-debug.apk > "$OUTPUT/apk.sha256"
          fi
          BUILT_COMMIT="$(git rev-parse HEAD)" API_LEVEL="$API_LEVEL" OUTPUT="$OUTPUT" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const api = Number(process.env.API_LEVEL);
          const output = process.env.OUTPUT;
          const modernPhoneCore = api >= 29;
          const hostContractsPassed = process.env.HOST_CONTRACT_RESULT === 'success';
          const instrumentationPassed = process.env.INSTRUMENTATION_OUTCOME === 'success';
          const file = (name) => path.join(output, name);
          const exists = (name) => fs.existsSync(file(name));
          const nonEmpty = (name, minBytes = 1) => exists(name) && fs.statSync(file(name)).size >= minBytes;
          const read = (name) => exists(name) ? fs.readFileSync(file(name), 'utf8') : '';
          const screenshot = (name) => nonEmpty(name, 256);
          const contains = (name, needle) => read(name).includes(needle);
          const packageHeld = (name) => read(name).split(/\r?\n/)
            .some((line) => line.trim() === 'com.sentinel.quantum');
          const walk = (dir) => {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          };
          const connectedResultsRoot = path.join('app', 'build', 'outputs', 'androidTest-results');
          const connectedResultText = walk(connectedResultsRoot)
            .filter((name) => name.endsWith('.xml'))
            .map((name) => {
              try { return fs.readFileSync(name, 'utf8'); } catch { return ''; }
            })
            .join('\n');
          const api24LogPath = path.join(
            process.env.RUNNER_TEMP || '',
            `sentinel-instrumentation-api${api}-tests.log`
          );
          const api24InstrumentationLog = api === 24 && fs.existsSync(api24LogPath)
            ? fs.readFileSync(api24LogPath, 'utf8')
            : '';
          const instrumentationEvidenceText = api === 24
            ? api24InstrumentationLog
            : connectedResultText;
          const completedInstrumentationClass = (className) => {
            if (api === 24) {
              let currentClass = '';
              const terminalStatuses = [];
              for (const line of api24InstrumentationLog.split('\n')) {
                if (line.startsWith('INSTRUMENTATION_STATUS: class=')) {
                  currentClass = line.slice('INSTRUMENTATION_STATUS: class='.length);
                }
                const status = line.match(/^INSTRUMENTATION_STATUS_CODE: (-?\d+)$/);
                if (currentClass.endsWith('.' + className) && status && Number(status[1]) !== 1) {
                  terminalStatuses.push(Number(status[1]));
                }
              }
              return terminalStatuses.length > 0 && terminalStatuses.every((status) => status === 0);
            }
            const cases = connectedResultText.match(/<testcase\b[^>]*(?:\/>|>[\s\S]*?<\/testcase>)/g) || [];
            const matching = cases.filter((entry) => new RegExp(`classname=["'](?:[^"']*\\.)?${className}["']`).test(entry));
            return matching.length > 0 && matching.every((entry) => !/<(?:skipped|failure|error)\b/.test(entry));
          };
          const instrumentationEvidencePassed = instrumentationPassed && (
            api === 24
              ? /^OK \([1-9][0-9]* tests?\)$/m.test(api24InstrumentationLog) &&
                !/^FAILURES!!!|^INSTRUMENTATION_FAILED:|Process crashed/m.test(api24InstrumentationLog)
              : connectedResultText.length > 0
          );

          let revocation = null;
          if (modernPhoneCore && exists('revocation-summary.json')) {
            try {
              revocation = JSON.parse(read('revocation-summary.json'));
            } catch (error) {
              revocation = { parse_error: String(error) };
            }
          }

          const callbackObserved = modernPhoneCore &&
            contains('call-screening-callback-logcat.txt', 'CallScreeningService:onScreenCall');
          const decisionObserved = api >= 36
            ? contains('phone-private-timeline-prefix.xml', 'CALL_SCREENED:')
            : null;
          const incomingCallObserved = modernPhoneCore &&
            screenshot('02-incoming-call.png') &&
            screenshot('03-incoming-active-evidence.png') &&
            contains('phone-private-timeline-incoming-incall_active.xml', 'INCALL_ACTIVE');
          const outgoingCallObserved = modernPhoneCore &&
            screenshot('05-outgoing-call.png') &&
            contains('phone-private-timeline-outgoing-incall_active.xml', 'INCALL_ACTIVE');
          const smsReplyObserved = modernPhoneCore &&
            screenshot('06-thread.png') && screenshot('07-inline-reply.png');
          const smsSentCallbackObserved = contains('phone-private-timeline-outgoing-sms_all_parts_sent.xml', 'SMS_ALL_PARTS_SENT');
          const smsDeliveredCallbackObserved = contains('phone-private-timeline-outgoing-sms_all_parts_delivered.xml', 'SMS_ALL_PARTS_DELIVERED');
          const coldRelaunchObserved = modernPhoneCore
            ? screenshot('01-dialer-first-launch.png') && screenshot('01b-dialer-relaunch.png')
            : nonEmpty('min-sdk-first-pid.txt') && nonEmpty('min-sdk-second-pid.txt') &&
              screenshot('01-min-sdk-first-launch.png') && screenshot('02-min-sdk-second-launch.png');
          const restoredRolesObserved = modernPhoneCore &&
            packageHeld('sms-role-restored.txt') &&
            packageHeld('dialer-role-restored.txt') &&
            packageHeld('call-screening-role-restored.txt');
          const authorizationProbe = revocation?.sms_authorization_probe || revocation?.effective_permission_probe;
          const authorizationClaim = revocation?.sms_authorization_denial_fail_closed === true ||
            ([2, 3, 4].includes(revocation?.schema_version) && revocation?.effective_permission_denial_fail_closed === true);
          const appOpDeniedEvidence =
            authorizationProbe === 'SEND_SMS_APP_OP_DENIED' &&
            /SEND_SMS:\s*(ignore|deny|errored)/i.test(read('send-sms-appop-denied-after-launch.txt'));
          const runtimePermissionDeniedEvidence =
            authorizationProbe === 'SEND_SMS_RUNTIME_PERMISSION_REVOKED' &&
            /android\.permission\.SEND_SMS:\s+granted=false/i.test(read('send-sms-runtime-permission-denied-after-launch.txt'));
          const roleAbsentEvidence = (name) =>
            /^role=android\.app\.role\.SMS$/m.test(read(name)) &&
            /^package=com\.sentinel\.quantum$/m.test(read(name)) &&
            /^absent=true$/m.test(read(name));
          const rawSendSmsPermissionStateEvidence = (name) =>
            /android\.permission\.SEND_SMS:\s+granted=(true|false)/i.test(read(name));
          const roleManagedRoleAbsentAfterEvidence =
            roleAbsentEvidence('send-sms-role-managed-role-absent-after-launch.txt');
          const legacyRoleManagedPermissionDeniedEvidence =
            api >= 36 &&
            authorizationProbe === 'SEND_SMS_ROLE_MANAGED_PERMISSION_REVOKED' &&
            roleManagedRoleAbsentAfterEvidence &&
            /android\.permission\.SEND_SMS:\s+granted=false/i.test(read('send-sms-role-managed-permission-denied-after-launch.txt'));
          const roleAuthorizationEvidence =
            api >= 36 &&
            revocation?.schema_version === 5 &&
            authorizationProbe === 'SEND_SMS_ROLE_AUTHORIZATION_REVOKED' &&
            roleAbsentEvidence('send-sms-role-managed-role-absent-state.txt') &&
            rawSendSmsPermissionStateEvidence('send-sms-role-managed-permission-state.txt') &&
            roleManagedRoleAbsentAfterEvidence &&
            rawSendSmsPermissionStateEvidence('send-sms-role-managed-permission-state-after-launch.txt');
          const revocationSchemaSupported = [2, 3, 4, 5].includes(revocation?.schema_version);
          const smsAuthorizationEvidenceValid = revocation?.schema_version === 2
            ? appOpDeniedEvidence
            : revocation?.schema_version === 3
              ? appOpDeniedEvidence || runtimePermissionDeniedEvidence
              : revocation?.schema_version === 4
                ? legacyRoleManagedPermissionDeniedEvidence
                : revocation?.schema_version === 5
                  ? roleAuthorizationEvidence
                  : false;
          const authorizationScreenshotObserved = revocation?.schema_version === 5
            ? screenshot('08-sms-authorization-denied.png')
            : screenshot('08-sms-effective-permission-denied.png');
          const smsAuthorizationDenied = modernPhoneCore &&
            revocationSchemaSupported &&
            authorizationClaim &&
            authorizationScreenshotObserved &&
            smsAuthorizationEvidenceValid;
          const roleRevocationFailClosed = modernPhoneCore &&
            revocationSchemaSupported &&
            revocation?.role_revocation_fail_closed === true &&
            restoredRolesObserved &&
            screenshot('10-sms-role-revoked.png') &&
            screenshot('11-dialer-role-revoked.png') &&
            screenshot('12-call-screening-role-revoked.png');
          const crashOrAnrAbsent = read('logcat-status.txt').trim() === '0' && nonEmpty('logcat.txt') &&
            !/FATAL EXCEPTION:|ANR in com\.sentinel\.quantum/.test(read('logcat.txt'));
          const instrumentationKey = `connected_instrumentation_api${api}`;

          const checks = {
            android_app_unit_tests: hostContractsPassed,
            wearable_contract_unit_tests: hostContractsPassed,
            wearable_security_unit_tests: hostContractsPassed,
            android_lint: hostContractsPassed,
            phone_number_canonicalization_contract: hostContractsPassed,
            multi_sim_submit_readiness_contract: hostContractsPassed,
            [instrumentationKey]: instrumentationEvidencePassed,
            all_static_navigation_surfaces_render:
              instrumentationEvidencePassed && instrumentationEvidenceText.includes('AllStaticNavigationSurfacesInstrumentationTest') && completedInstrumentationClass('AllStaticNavigationSurfacesInstrumentationTest'),
            standalone_activity_surfaces_render:
              instrumentationEvidencePassed && instrumentationEvidenceText.includes('StandaloneActivitySmokeInstrumentationTest') && completedInstrumentationClass('StandaloneActivitySmokeInstrumentationTest'),
            min_sdk_cold_launch: api === 24 ? coldRelaunchObserved : null,
            cold_install_and_relaunch: coldRelaunchObserved,
            phone_core_setup_resume: modernPhoneCore
              ? instrumentationEvidencePassed && instrumentationEvidenceText.includes('PhoneCoreSetupResumeInstrumentationTest') && completedInstrumentationClass('PhoneCoreSetupResumeInstrumentationTest')
              : null,
            synthetic_call_screening_observed: modernPhoneCore ? callbackObserved : null,
            synthetic_call_screening_decision_observed: api >= 36 ? decisionObserved : null,
            incoming_call_telecom_flow: modernPhoneCore ? incomingCallObserved : null,
            outgoing_call_telecom_flow: modernPhoneCore ? outgoingCallObserved : null,
            incoming_sms_and_inline_reply: modernPhoneCore ? smsReplyObserved : null,
            sms_all_parts_sent_callback: modernPhoneCore ? smsSentCallbackObserved : null,
            sms_all_parts_delivered_callback: api >= 36 ? smsDeliveredCallbackObserved : null,
            role_revocation_fail_closed: modernPhoneCore ? roleRevocationFailClosed : null,
            sms_authorization_denial_fail_closed: modernPhoneCore ? smsAuthorizationDenied : null,
            no_crash_or_anr: crashOrAnrAbsent
          };

          const commonRequired = [
            'android_app_unit_tests',
            'wearable_contract_unit_tests',
            'wearable_security_unit_tests',
            'android_lint',
            'phone_number_canonicalization_contract',
            'multi_sim_submit_readiness_contract',
            instrumentationKey,
            'all_static_navigation_surfaces_render',
            'standalone_activity_surfaces_render',
            'cold_install_and_relaunch',
            'no_crash_or_anr'
          ];
          const required = api === 24
            ? [...commonRequired, 'min_sdk_cold_launch']
            : [
                ...commonRequired,
                'phone_core_setup_resume',
                'synthetic_call_screening_observed',
                'incoming_call_telecom_flow',
                'outgoing_call_telecom_flow',
                'incoming_sms_and_inline_reply',
                'sms_all_parts_sent_callback',
                'role_revocation_fail_closed',
                'sms_authorization_denial_fail_closed',
                ...(api >= 36 ? ['synthetic_call_screening_decision_observed', 'sms_all_parts_delivered_callback'] : [])
              ];
          const evidenceFailures = required.filter((name) => checks[name] !== true);
          if (process.env.RUNTIME_OUTCOME !== 'success') evidenceFailures.push('runtime_execution');
          const validSha = (value) => /^[a-f0-9]{40}$/.test(value || '');
          const provenanceValid = validSha(process.env.BUILT_COMMIT) &&
            process.env.BUILT_COMMIT === process.env.GITHUB_SHA &&
            validSha(process.env.SOURCE_HEAD_SHA) &&
            Boolean(process.env.SOURCE_HEAD_REF) &&
            (process.env.GITHUB_EVENT_NAME !== 'pull_request' || validSha(process.env.SOURCE_BASE_SHA));
          if (!provenanceValid) evidenceFailures.push('code_provenance');
          const apkSha256 = read('apk.sha256').match(/^([a-f0-9]{64})\s/);
          if (!apkSha256) evidenceFailures.push('apk_provenance');
          if (!nonEmpty('package.txt') || !contains('package.txt', 'com.sentinel.quantum')) {
            evidenceFailures.push('package_state');
          }

          const report = {
            schema_version: 4,
            qualification: 'ANDROID_APPLICATION_EMULATION',
            rollout_mode: 'shadow',
            evidence_scope: 'developer_qualification',
            api_level: api,
            result: evidenceFailures.length === 0 ? 'PASS' : 'FAIL',
            synthetic_modem: modernPhoneCore,
            physical_modem_claim: false,
            commercial_release_claim: false,
            build_commit: process.env.BUILT_COMMIT,
            workflow_commit: process.env.GITHUB_SHA,
            apk_sha256: apkSha256?.[1] || null,
            source_head_commit: process.env.SOURCE_HEAD_SHA,
            source_base_commit: process.env.SOURCE_BASE_SHA || null,
            source_head_ref: process.env.SOURCE_HEAD_REF,
            repository: process.env.GITHUB_REPOSITORY,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            evidence_source: {
              host_contracts: process.env.HOST_CONTRACT_RESULT,
              runtime_outcome: process.env.RUNTIME_OUTCOME,
              instrumentation: api === 24 ? 'raw adb instrumentation log' : 'Gradle connected test XML',
              instrumentation_outcome: process.env.INSTRUMENTATION_OUTCOME,
              runtime: 'files produced in this API lane',
              revocation: modernPhoneCore ? 'revocation-summary.json + UI/platform authorization evidence' : null
            },
            required_checks_for_lane: required,
            evidence_failures: evidenceFailures,
            checks
          };
          fs.writeFileSync(file('qualification.json'), JSON.stringify(report, null, 2) + '\n');
          if (evidenceFailures.length) {
            console.error(`Emulator evidence incomplete for API ${api}: ${evidenceFailures.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Upload emulator qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PhoneCore-Emulation-Qualification-API${{ matrix.api_level }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/phone-core-emulation-api${{ matrix.api_level }}/
            ${{ runner.temp }}/sentinel-emulator-api${{ matrix.api_level }}.log
            ${{ runner.temp }}/sentinel-instrumentation-api${{ matrix.api_level }}-tests.log
            native-android-app/app/build/reports/androidTests/connected/
            native-android-app/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill >/dev/null 2>&1 || true
          if [[ -f "$RUNNER_TEMP/sentinel-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/sentinel-emulator.pid")" >/dev/null 2>&1 || true
          fi