# Alternative gratuite a GitHub Actions.
# Importer le depot GitHub dans GitLab puis executer sur GitLab SaaS Linux x86-64.
stages:
  - validate

android_debug:
  stage: validate
  image: eclipse-temurin:17-jdk-jammy
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
    ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
    DEBIAN_FRONTEND: noninteractive
  cache:
    key: "android-gradle-v1"
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip > /dev/null
    - mkdir -p "$ANDROID_HOME/cmdline-tools"
    - curl -fLsS --retry 3 -o /tmp/android-commandlinetools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
    - unzip -q /tmp/android-commandlinetools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
    - sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
    - chmod +x native-android-app/gradlew
  script:
    - cd native-android-app
    - ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --max-workers=2 --console=plain
    - mkdir -p ../ci-artifacts
    - cp app/build/outputs/apk/debug/*.apk ../ci-artifacts/
    - cd ../ci-artifacts
    - sha256sum *.apk | tee apk-debug.sha256
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - ci-artifacts/
      - native-android-app/app/build/reports/tests/
      - native-android-app/app/build/test-results/
      - native-android-app/build/reports/problems/
  rules:
    - if: '$CI_COMMIT_BRANCH == "integration/sentinel-d1-3d-20261022"'
    - when: manual
