workflows:
  sentinel-d1-debug:
    name: Sentinel D1 Android debug validation
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
    triggering:
      events: []
    scripts:
      - name: Android SDK 37
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "SDK Manager absent: $SDKMANAGER"
            find /usr/local/share/android-sdk "$HOME/Library/Android/sdk" -name sdkmanager -type f 2>/dev/null | head -10 || true
            exit 127
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$CM_BUILD_DIR/native-android-app/local.properties"
      - name: Verify APK installation fail-closed
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 scripts/verify-apk-install-gate.py
      - name: Compile, test and assemble APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Verify unit-test evidence
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              sys.exit('BLOCKED: missing JVM unit-test XML reports')
          total = failures = errors = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get('tests', '0'))
              failures += int(root.get('failures', '0'))
              errors += int(root.get('errors', '0'))
          print(f'Unit-test evidence: {total} tests, {failures} failures, {errors} errors, {len(files)} suites')
          if total == 0 or failures or errors:
              sys.exit('BLOCKED: unit tests not proven successful')
          PY
      - name: Record APK SHA-256
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          shasum -a 256 app/build/outputs/apk/debug/*.apk > app/build/outputs/apk/debug/apk-debug.sha256
    artifacts:
      - native-android-app/app/build/outputs/apk/debug/*.apk
      - native-android-app/app/build/outputs/apk/debug/*.sha256
      - native-android-app/app/build/reports/tests/**/*
      - native-android-app/app/build/test-results/**/*
