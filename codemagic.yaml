workflows:
  sentinel-d1-debug:
    name: Sentinel D1 Android debug validation
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
    triggering:
      events: []
    scripts:
      - name: Android SDK 37
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "SDK Manager absent: $SDKMANAGER"
            find /usr/local/share/android-sdk "$HOME/Library/Android/sdk" -name sdkmanager -type f 2>/dev/null | head -10 || true
            exit 127
          fi
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$CM_BUILD_DIR/native-android-app/local.properties"
      - name: Verify APK installation fail-closed
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          python3 scripts/verify-apk-install-gate.py
      - name: Compile, test and assemble APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Verify unit-test evidence
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET
          directory = 'app/build/test-results/testDebugUnitTest'
          files = glob.glob(f'{directory}/TEST-*.xml')
          if not files:
              sys.exit('BLOCKED: missing JVM unit-test XML reports')
          total = failures = errors = skipped = 0
          suite_names = set()
          for path in files:
              root = ET.parse(path).getroot()
              suite_names.add(root.get('name', os.path.basename(path)))
              total += int(root.get('tests', '0'))
              failures += int(root.get('failures', '0'))
              errors += int(root.get('errors', '0'))
              skipped += int(root.get('skipped', '0'))
          mandatory = (
              'ApkInspectionSafetyTest',
              'ApkComparisonTruthTest',
              'ApkInspectionProcessGuardTest',
              'AuthSessionAtomicityTest',
              'AuthSessionConcurrencyTest',
              'AuthSessionGenerationTest',
              'SentinelVpnControllerTest',
          )
          missing = [name for name in mandatory if not any(suite.endswith('.' + name) or suite == name for suite in suite_names)]
          print(f'Unit-test evidence: {total} tests, {failures} failures, {errors} errors, {skipped} skipped, {len(files)} suites')
          print('Required APK suites present:', not missing)
          if total < 1313 or failures or errors or skipped or missing:
              sys.exit('BLOCKED: failed or missing mandatory APK unit-test evidence: ' + ', '.join(missing))
          PY
      - name: Verify AndroidTest APK exists
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          TEST_DIR="app/build/outputs/apk/androidTest/debug"
          set -- "$TEST_DIR"/*.apk
          test "$#" -eq 1 && test -s "$1" || { echo "BLOCKED: expected exactly one nonempty AndroidTest APK"; exit 1; }
          (cd "$TEST_DIR" && shasum -a 256 "$(basename "$1")" > android-test.sha256 && shasum -a 256 -c android-test.sha256)
          echo "ANDROID_TEST_APK_COMPILED_NOT_EXECUTED"
      - name: Record APK SHA-256
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          APK_DIR="app/build/outputs/apk/debug"
          set -- "$APK_DIR"/*.apk
          test "$#" -eq 1 && test -f "$1" || { echo "BLOCKED: expected exactly one APK"; exit 1; }
          (cd "$APK_DIR" && shasum -a 256 "$(basename "$1")" > apk-debug.sha256 && shasum -a 256 -c apk-debug.sha256)
          ACTUAL_BRANCH="${CM_BRANCH:-}"
          case "$ACTUAL_BRANCH" in
            integration/sentinel-d1-cve-v5-20261025|integration/sentinel-d1-3d-20261022|fix/d1-apk-process-guard-20261023|fix/d1-auth0-voice-revocation-20261023) ;;
            *)
              echo "BLOCKED: unexpected source branch: $ACTUAL_BRANCH"
              exit 1
              ;;
          esac
          test "$(git rev-parse --is-inside-work-tree)" = "true"
          test -z "$(git -c core.filemode=false status --porcelain --untracked-files=no)" || {
            echo "BLOCKED: tracked files modified during build"
            exit 1
          }
          printf 'git_commit=%s\nbranch=%s\nbuild_id=%s\n' \
            "$(git rev-parse HEAD)" "${CM_BRANCH:-unknown}" "${CM_BUILD_ID:-unknown}" \
            > "$APK_DIR/build-provenance.txt"
          cat "$APK_DIR/build-provenance.txt"
          cat "$APK_DIR/apk-debug.sha256"
    artifacts:
      - native-android-app/app/build/outputs/apk/debug/*.apk
      - native-android-app/app/build/outputs/apk/androidTest/debug/*.apk
      - native-android-app/app/build/outputs/apk/androidTest/debug/*.sha256
      - native-android-app/app/build/outputs/apk/debug/*.sha256
      - native-android-app/app/build/outputs/apk/debug/build-provenance.txt
      - native-android-app/app/build/reports/tests/**/*
      - native-android-app/app/build/test-results/**/*

  sentinel-d1-release-unsigned:
    name: Sentinel D1 unsigned release qualification
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
    triggering:
      events: []
    scripts:
      - name: Verify source and release safety prerequisites
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          case "${CM_BRANCH:-}" in
            integration/sentinel-d1-cve-v5-20261025|fix/d1-apk-process-guard-20261023|fix/d1-auth0-voice-revocation-20261023) ;;
            *) echo "BLOCKED: unexpected branch"; exit 1 ;;
          esac
          python3 scripts/verify-play-source-preflight.py
          python3 scripts/verify-apk-install-gate.py
          if env | grep -Eq '^(KEYSTORE_FILE|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)='; then
            echo "BLOCKED: production signing secrets must not be present in unsigned qualification"
            exit 1
          fi
      - name: Android SDK 37
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "BLOCKED: Android SDK manager missing"; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$CM_BUILD_DIR/native-android-app/local.properties"
      - name: Generate and audit merged releaseUnsigned manifest
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          chmod +x gradlew
          ./gradlew :app:processReleaseUnsignedMainManifest --no-daemon --max-workers=2 --console=plain
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("app/build/intermediates")
          candidates = sorted(p for p in root.rglob("AndroidManifest.xml")
              if "releaseUnsigned" in p.parts and
              any(part in ("merged_manifest", "merged_manifests") for part in p.parts))
          if len(candidates) != 1:
              raise SystemExit(f"BLOCKED: expected exactly one releaseUnsigned merged manifest, found {len(candidates)}: {candidates}")
          print("Merged release manifest:", candidates[0], flush=True)
          subprocess.run(["python3", "../scripts/verify-android-release-manifest.py", str(candidates[0])], check=True)
          PY
      - name: Build unsigned release bundle
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          ./gradlew :app:bundleReleaseUnsigned --no-daemon --max-workers=2 --console=plain
          BUNDLE_DIR="app/build/outputs/bundle/releaseUnsigned"
          set -- "$BUNDLE_DIR"/*.aab
          test "$#" -eq 1 && test -f "$1" || { echo "BLOCKED: expected exactly one unsigned AAB"; exit 1; }
          (cd "$BUNDLE_DIR" && shasum -a 256 "$(basename "$1")" > bundle-unsigned.sha256 && shasum -a 256 -c bundle-unsigned.sha256)
          printf 'commit=%s\nbranch=%s\nbuild_id=%s\nUNSIGNED_ONLY=true\n' \
            "$(git rev-parse HEAD)" "${CM_BRANCH:-unknown}" "${CM_BUILD_ID:-unknown}" > "$BUNDLE_DIR/build-provenance.txt"
          cat "$BUNDLE_DIR/build-provenance.txt"
    artifacts:
      - native-android-app/app/build/outputs/bundle/releaseUnsigned/*.aab
      - native-android-app/app/build/outputs/bundle/releaseUnsigned/*.sha256
      - native-android-app/app/build/outputs/bundle/releaseUnsigned/build-provenance.txt
      - native-android-app/app/build/outputs/logs/manifest-merger-*.txt

  sentinel-d1-release-signed:
    name: Sentinel D1 signed Android qualification
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      java: 17
      # Existing Codemagic group. SENTINEL_PRODUCTION_KEYSTORE_B64 is decoded only in the
      # build process; no keystore material is stored in Git or printed.
      # EXPECTED_CERTIFICATE_SHA256 is public certificate identity metadata.
      groups:
        - sentinel_production
    triggering:
      events: []
    scripts:
      - name: Verify source and signing bindings
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          test "${CM_BRANCH:-}" = "integration/sentinel-d1-cve-v5-20261025" || {
            echo "BLOCKED: signed qualification is restricted to the consolidation branch"
            exit 1
          }
          case "${SIGNING_MODE:-}" in
            FIRST_RELEASE)
              test "${FIRST_RELEASE_SIGNING_APPROVED:-}" = "true" || {
                echo "BLOCKED: first-release signing approval is missing"
                exit 1
              }
              ;;
            EXISTING_APP)
              test "${PLAY_IMPORT_KEY_MATCH_CONFIRMED:-}" = "true" || {
                echo "BLOCKED: Google Play import-key correspondence is not confirmed"
                exit 1
              }
              ;;
            *)
              echo "BLOCKED: SIGNING_MODE must be FIRST_RELEASE or EXISTING_APP"
              exit 1
              ;;
          esac
          for name in SENTINEL_PRODUCTION_KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERTIFICATE_SHA256; do
            test -n "${!name:-}" || { echo "BLOCKED: missing Codemagic signing binding: $name"; exit 1; }
          done
          EXPECTED_CERTIFICATE_SHA256="$(printf '%s' "$EXPECTED_CERTIFICATE_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          printf '%s' "$EXPECTED_CERTIFICATE_SHA256" | grep -Eq '^[A-F0-9]{64}$' || {
            echo "BLOCKED: expected certificate SHA-256 identity is malformed"
            exit 1
          }
          python3 scripts/verify-apk-install-gate.py
      - name: Android SDK 37
        script: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "BLOCKED: Android SDK manager missing"; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-37.0" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$CM_BUILD_DIR/native-android-app/local.properties"
      - name: Build, test, lint, APK and AAB
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          chmod +x gradlew
          umask 077
          SIGNING_DIR="$(mktemp -d "$CM_BUILD_DIR/.sentinel-signing.XXXXXX")"
          trap 'rm -rf -- "$SIGNING_DIR"' EXIT
          KEYSTORE_FILE="$SIGNING_DIR/sentinel-release.p12"
          export KEYSTORE_FILE
          if ! printf '%s' "$SENTINEL_PRODUCTION_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE" 2>/dev/null; then
            rm -f -- "$KEYSTORE_FILE"
            printf '%s' "$SENTINEL_PRODUCTION_KEYSTORE_B64" | base64 -D > "$KEYSTORE_FILE"
          fi
          chmod 600 "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE" || { echo "BLOCKED: decoded keystore file is empty"; exit 1; }
          EXPECTED_CERTIFICATE_SHA256="$(printf '%s' "$EXPECTED_CERTIFICATE_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null |
            grep -Fq 'Entry type: PrivateKeyEntry' || {
              echo "BLOCKED: keystore alias is not a private-key entry"
              exit 1
            }
          CERTIFICATE_SHA256="$(
            keytool -exportcert -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null |
              shasum -a 256 | awk '{print toupper($1)}'
          )"
          test "$CERTIFICATE_SHA256" = "$EXPECTED_CERTIFICATE_SHA256" || {
            echo "BLOCKED: keystore certificate does not match expected public identity"
            exit 1
          }
          PRIVATE_PUBLIC_SHA256="$(
            openssl pkcs12 -in "$KEYSTORE_FILE" -nocerts -nodes \
              -passin env:KEYSTORE_PASSWORD 2>/dev/null |
              openssl pkey -pubout -outform DER 2>/dev/null |
              shasum -a 256 | awk '{print toupper($1)}'
          )"
          CERTIFICATE_PUBLIC_SHA256="$(
            keytool -exportcert -keystore "$KEYSTORE_FILE" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null |
              openssl x509 -inform DER -pubkey -noout 2>/dev/null |
              openssl pkey -pubin -outform DER 2>/dev/null |
              shasum -a 256 | awk '{print toupper($1)}'
          )"
          test -n "$PRIVATE_PUBLIC_SHA256" &&
            test "$PRIVATE_PUBLIC_SHA256" = "$CERTIFICATE_PUBLIC_SHA256" || {
              echo "BLOCKED: private key and certificate public keys do not match"
              exit 1
            }
          printf '%s\n' "$CERTIFICATE_SHA256" > "$SIGNING_DIR/certificate.sha256"
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 --console=plain
      - name: Verify signed artifacts without exposing secrets
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          APK_DIR="app/build/outputs/apk/release"
          AAB_DIR="app/build/outputs/bundle/release"
          set -- "$APK_DIR"/*.apk
          test "$#" -eq 1 && test -s "$1" || { echo "BLOCKED: expected one signed release APK"; exit 1; }
          APK="$1"
          set -- "$AAB_DIR"/*.aab
          test "$#" -eq 1 && test -s "$1" || { echo "BLOCKED: expected one signed release AAB"; exit 1; }
          AAB="$1"
          APKSIGNER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/share/android-sdk}}/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || { echo "BLOCKED: apksigner missing"; exit 1; }
          APK_CERT_LOG="$APK_DIR/release.apk.certificates.txt"
          if "$APKSIGNER" verify --verbose --print-certs "$APK" > "$APK_CERT_LOG" 2>&1; then
            echo "CHECK apksigner_verify=PASS"
          else
            echo "CHECK apksigner_verify=FAIL"
            tail -n 20 "$APK_CERT_LOG"
            exit 1
          fi
          AAB_VERIFY_LOG="$AAB_DIR/release.aab.verify.txt"
          set +e
          jarsigner -verify "$AAB" > "$AAB_VERIFY_LOG" 2>&1
          AAB_VERIFY_STATUS=$?
          set -e
          echo "CHECK jarsigner_verify_status=$AAB_VERIFY_STATUS"
          if test "$AAB_VERIFY_STATUS" -ne 0 || ! grep -Eiq 'jar verified|jar is verified' "$AAB_VERIFY_LOG"; then
            echo "BLOCKED: AAB cryptographic verification failed"
            tail -n 30 "$AAB_VERIFY_LOG"
            exit 1
          fi
          echo "CHECK jarsigner_verify=PASS"
          AAB_STRICT_LOG="$AAB_DIR/release.aab.strict.txt"
          set +e
          jarsigner -verify -strict "$AAB" > "$AAB_STRICT_LOG" 2>&1
          AAB_STRICT_STATUS=$?
          set -e
          echo "CHECK jarsigner_strict_status=$AAB_STRICT_STATUS"
          STRUCTURAL_INCONSISTENCY_PATTERN='^This JAR file contains internal inconsistencies that may result in different contents when reading via JarFile and JarInputStream:$'
          STRUCTURAL_DETAILS_PATTERN='^Re-run with the -verbose and -certs options for more details\.$'
          STRUCTURAL_INCONSISTENCY_COUNT="$(grep -Ec "$STRUCTURAL_INCONSISTENCY_PATTERN" "$AAB_STRICT_LOG" || true)"
          STRUCTURAL_DETAILS_COUNT="$(grep -Ec "$STRUCTURAL_DETAILS_PATTERN" "$AAB_STRICT_LOG" || true)"
          if test "$AAB_VERIFY_STATUS" -eq 0 &&
             test "$STRUCTURAL_INCONSISTENCY_COUNT" -eq 1 &&
             test "$STRUCTURAL_DETAILS_COUNT" -eq 1; then
            STRUCTURAL_CONTEXT_PATTERN="$STRUCTURAL_INCONSISTENCY_PATTERN|$STRUCTURAL_DETAILS_PATTERN"
          else
            STRUCTURAL_CONTEXT_PATTERN='a^'
          fi
          INFO_WARNING_PATTERN="Entry .* is signed in JarFile but is not signed in JarInputStream|signature.*(no timestamp|not timestamped|without a timestamp|do not include.*timestamp)|signatures?.*do not include.*timestamp|without a timestamp|POSIX.*(unprotected|not protected)|unprotected.*POSIX|JarInputStream.*manifest.*(absent|missing|not found)|manifest.*(absent|missing|not found).*JarInputStream|^[[:space:]]*(Warning:|Error:|Note:)[[:space:]]*$|^jar verified(, with signer errors)?\.?$|$STRUCTURAL_CONTEXT_PATTERN"
          TRUST_WARNING_PATTERN='PKIX path building failed|unable to find valid certification path to requested target|certificate chain.*(not trusted|not validated)|signer certificate.*(not trusted|does not chain)|self-signed'
          FORBIDDEN_NON_TRUST_PATTERN='unsigned|digest.*(error|mismatch)|signature.*(invalid|error)|certificate.*expired|certificate.*not yet valid|cannot verify|disabled algorithm|weak algorithm|algorithm.*(disabled|weak)|key.*too small'
          FORBIDDEN_PATTERN="$FORBIDDEN_NON_TRUST_PATTERN|certificate.*invalid"
          INFO_WARNING_COUNT="$(grep -Eic "$INFO_WARNING_PATTERN" "$AAB_STRICT_LOG" || true)"
          INFO_DIAGNOSTICS="$AAB_DIR/release.aab.informational-diagnostics.txt"
          : > "$INFO_DIAGNOSTICS"
          record_info_matches() {
            category="$1"
            pattern="$2"
            line_numbers="$(grep -Ein "$pattern" "$AAB_STRICT_LOG" | cut -d: -f1 | paste -sd, - || true)"
            if test -n "$line_numbers"; then
              printf 'informational_category=%s line_numbers=%s\n' "$category" "$line_numbers" >> "$INFO_DIAGNOSTICS"
            fi
          }
          record_info_matches 'jarfile_jarinputstream_consistency' 'Entry .* is signed in JarFile but is not signed in JarInputStream'
          record_info_matches 'missing_timestamp' 'signature.*(no timestamp|not timestamped|without a timestamp|do not include.*timestamp)|signatures?.*do not include.*timestamp|without a timestamp'
          record_info_matches 'posix_metadata_warning' 'POSIX.*(unprotected|not protected)|unprotected.*POSIX'
          record_info_matches 'jarinputstream_manifest_diagnostic' 'JarInputStream.*manifest.*(absent|missing|not found)|manifest.*(absent|missing|not found).*JarInputStream'
          record_info_matches 'diagnostic_header' '^[[:space:]]*(Warning:|Error:|Note:)[[:space:]]*$|^jar verified(, with signer errors)?\.?$'
          if test "$STRUCTURAL_CONTEXT_PATTERN" != 'a^'; then
            record_info_matches 'jarfile_jarinputstream_structural_context' "$STRUCTURAL_CONTEXT_PATTERN"
          fi
          grep -Eiv "$INFO_WARNING_PATTERN" "$AAB_STRICT_LOG" > "$AAB_DIR/release.aab.actionable.txt" || true
          TRUST_WARNING_COUNT="$(grep -Eic "$TRUST_WARNING_PATTERN" "$AAB_DIR/release.aab.actionable.txt" || true)"
          TRUST_FILTERED_LOG="$AAB_DIR/release.aab.security-actionable.txt"
          grep -Eiv "$TRUST_WARNING_PATTERN" "$AAB_DIR/release.aab.actionable.txt" > "$TRUST_FILTERED_LOG" || true
          TRUST_MIXED_FORBIDDEN_COUNT="$(grep -Ei "$TRUST_WARNING_PATTERN" "$AAB_DIR/release.aab.actionable.txt" | grep -Eic "$FORBIDDEN_NON_TRUST_PATTERN" || true)"
          FORBIDDEN_COUNT="$(grep -Eic "$FORBIDDEN_PATTERN" "$TRUST_FILTERED_LOG" || true)"
          FORBIDDEN_COUNT=$((FORBIDDEN_COUNT + TRUST_MIXED_FORBIDDEN_COUNT))
          TRUST_DIAGNOSTICS="$AAB_DIR/release.aab.trust-diagnostics.txt"
          : > "$TRUST_DIAGNOSTICS"
          record_trust_matches() {
            category="$1"
            pattern="$2"
            line_numbers="$(grep -Ein "$pattern" "$AAB_DIR/release.aab.actionable.txt" | cut -d: -f1 | paste -sd, - || true)"
            if test -n "$line_numbers"; then
              printf 'trust_category=%s line_numbers=%s\n' "$category" "$line_numbers" >> "$TRUST_DIAGNOSTICS"
            fi
          }
          record_trust_matches 'pkix_unrecognized_chain' 'PKIX path building failed|unable to find valid certification path to requested target'
          record_trust_matches 'self_signed_certificate' 'self-signed'
          record_trust_matches 'untrusted_certificate_chain' 'certificate chain.*(not trusted|not validated)|signer certificate.*(not trusted|does not chain)'
          FORBIDDEN_DIAGNOSTICS="$AAB_DIR/release.aab.forbidden-diagnostics.txt"
          : > "$FORBIDDEN_DIAGNOSTICS"
          record_forbidden_matches() {
            category="$1"
            pattern="$2"
            line_numbers="$(grep -Ein "$pattern" "$TRUST_FILTERED_LOG" | cut -d: -f1 | paste -sd, - || true)"
            if test -n "$line_numbers"; then
              printf 'forbidden_category=%s line_numbers=%s\n' "$category" "$line_numbers" >> "$FORBIDDEN_DIAGNOSTICS"
            fi
          }
          record_forbidden_matches 'unsigned_or_missing_signature' 'unsigned'
          record_forbidden_matches 'digest_error_or_mismatch' 'digest.*(error|mismatch)'
          record_forbidden_matches 'signature_error' 'signature.*(invalid|error)'
          record_forbidden_matches 'invalid_certificate' 'certificate.*invalid'
          record_forbidden_matches 'verification_failure' 'cannot verify'
          record_forbidden_matches 'certificate_expired' 'certificate.*expired'
          record_forbidden_matches 'certificate_not_yet_valid' 'certificate.*not yet valid'
          record_forbidden_matches 'disabled_algorithm' 'disabled algorithm|algorithm.*disabled'
          record_forbidden_matches 'weak_algorithm' 'weak algorithm|algorithm.*weak'
          record_forbidden_matches 'key_too_small' 'key.*too small'
          if test "$TRUST_MIXED_FORBIDDEN_COUNT" -gt 0; then
            mixed_line_numbers="$(grep -Ein "$TRUST_WARNING_PATTERN" "$AAB_DIR/release.aab.actionable.txt" | cut -d: -f1 | paste -sd, - || true)"
            printf 'forbidden_category=trust_context_with_security_error line_numbers=%s\n' "$mixed_line_numbers" >> "$FORBIDDEN_DIAGNOSTICS"
          fi
          grep -Eiv "$TRUST_WARNING_PATTERN|$FORBIDDEN_PATTERN|^jar verified(, with signer errors)?\.?$|^[[:space:]]*(Warning:|Error:|Note:)[[:space:]]*$" \
            "$TRUST_FILTERED_LOG" | sed '/^[[:space:]]*$/d' > "$AAB_DIR/release.aab.unclassified.txt" || true
          UNCLASSIFIED_COUNT="$(wc -l < "$AAB_DIR/release.aab.unclassified.txt" | tr -d '[:space:]')"
          UNCLASSIFIED_LINE_NUMBERS="$(grep -n . "$AAB_DIR/release.aab.unclassified.txt" | cut -d: -f1 | paste -sd, - || true)"
          AAB_SUMMARY="$AAB_DIR/release.aab.verification-summary.txt"
          {
            printf 'jarsigner_verify_status=%s\n' "$AAB_VERIFY_STATUS"
            printf 'jarsigner_strict_status=%s\n' "$AAB_STRICT_STATUS"
            printf 'jarfile_jarinputstream_structural_messages=%s\n' "$STRUCTURAL_INCONSISTENCY_COUNT"
            printf 'jarfile_jarinputstream_detail_hints=%s\n' "$STRUCTURAL_DETAILS_COUNT"
            printf 'jarfile_jarinputstream_structural_context=%s\n' "$([ "$STRUCTURAL_CONTEXT_PATTERN" != 'a^' ] && echo 'EXACT_AND_VERIFY_OK' || echo 'NOT_AUTHORIZED')"
            printf 'informational_jarfile_jarinputstream_warnings=%s\n' "$INFO_WARNING_COUNT"
            printf 'trust_warning_lines=%s\n' "$TRUST_WARNING_COUNT"
            printf 'forbidden_or_crypto_error_lines=%s\n' "$FORBIDDEN_COUNT"
            printf 'unclassified_diagnostic_lines=%s\n' "$UNCLASSIFIED_COUNT"
            printf 'unclassified_line_numbers=%s\n' "${UNCLASSIFIED_LINE_NUMBERS:-none}"
            if test -s "$INFO_DIAGNOSTICS"; then cat "$INFO_DIAGNOSTICS"; else printf 'informational_category=none\n'; fi
            if test -s "$TRUST_DIAGNOSTICS"; then cat "$TRUST_DIAGNOSTICS"; else printf 'trust_category=none\n'; fi
            if test -s "$FORBIDDEN_DIAGNOSTICS"; then
              cat "$FORBIDDEN_DIAGNOSTICS"
            else
              printf 'forbidden_category=none\n'
            fi
          } > "$AAB_SUMMARY"
          case "$AAB_STRICT_STATUS" in
            0)
              if test "$FORBIDDEN_COUNT" -eq 0 && test "$UNCLASSIFIED_COUNT" -eq 0; then
                echo "CHECK jarsigner_strict=PASS"
              else
                echo "BLOCKED: strict verification left forbidden or unclassified diagnostics"
                cat "$AAB_SUMMARY"
                exit 1
              fi
              ;;
            4)
              if test "$TRUST_WARNING_COUNT" -gt 0 &&
                 test "$FORBIDDEN_COUNT" -eq 0 &&
                 test "$UNCLASSIFIED_COUNT" -eq 0; then
                echo "CHECK jarsigner_strict=PASS_TRUST_WARNING"
              else
                echo "BLOCKED: jarsigner strict code 4 was not limited to a certificate trust warning"
                cat "$AAB_SUMMARY"
                exit 1
              fi
              ;;
            *)
              echo "BLOCKED: jarsigner strict verification failed with status $AAB_STRICT_STATUS"
              cat "$AAB_SUMMARY"
              exit 1
              ;;
          esac
          AAB_CERT_LOG="$AAB_DIR/release.aab.certificates.txt"
          if keytool -printcert -jarfile "$AAB" > "$AAB_CERT_LOG" 2>&1; then
            echo "CHECK aab_signer_certificate_extraction=PASS"
          else
            echo "CHECK aab_signer_certificate_extraction=FAIL"
            tail -n 20 "$AAB_CERT_LOG"
            exit 1
          fi
          (cd "$APK_DIR" && shasum -a 256 "$(basename "$APK")" > release.apk.sha256)
          (cd "$AAB_DIR" && shasum -a 256 "$(basename "$AAB")" > release.aab.sha256)
          normalize_sha256() {
            if test "$#" -gt 0; then
              printf '%s' "$1"
            else
              cat
            fi | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'
          }
          require_sha256() {
            name="$1"
            value="$2"
            test -n "$value" || { echo "BLOCKED: $name certificate SHA-256 is missing"; exit 1; }
            printf '%s' "$value" | grep -Eq '^[A-F0-9]{64}$' || {
              echo "BLOCKED: $name certificate SHA-256 is malformed"
              exit 1
            }
          }
          EXPECTED_CERTIFICATE_SHA256_NORMALIZED="$(normalize_sha256 "${EXPECTED_CERTIFICATE_SHA256:-}")"
          require_sha256 'expected' "$EXPECTED_CERTIFICATE_SHA256_NORMALIZED"
          APK_CERTIFICATE_SHA256_COUNT="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$APK_CERT_LOG" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "$APK_CERTIFICATE_SHA256_COUNT" -eq 1 || {
            echo "BLOCKED: expected exactly one APK signer certificate fingerprint"
            exit 1
          }
          CERTIFICATE_SHA256="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$APK_CERT_LOG" | sed -n '1p' | normalize_sha256)"
          require_sha256 'APK' "$CERTIFICATE_SHA256"
          test "$CERTIFICATE_SHA256" = "$EXPECTED_CERTIFICATE_SHA256_NORMALIZED" || {
            echo "BLOCKED: signed APK certificate identity mismatch"
            exit 1
          }
          AAB_CERTIFICATE_SHA256_COUNT="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' "$AAB_CERT_LOG" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "$AAB_CERTIFICATE_SHA256_COUNT" -eq 1 || {
            echo "BLOCKED: expected exactly one AAB signer certificate fingerprint"
            exit 1
          }
          AAB_CERTIFICATE_SHA256="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' "$AAB_CERT_LOG" | sed -n '1p' | normalize_sha256)"
          require_sha256 'AAB' "$AAB_CERTIFICATE_SHA256"
          test "$AAB_CERTIFICATE_SHA256" = "$EXPECTED_CERTIFICATE_SHA256_NORMALIZED" || {
            echo "BLOCKED: signed AAB certificate identity mismatch"
            exit 1
          }
          echo "CHECK apk_certificate_identity=PASS"
          echo "CHECK aab_certificate_identity=PASS"
          printf '%s\n' "$CERTIFICATE_SHA256" > "$APK_DIR/release.certificate.sha256"
          printf '%s\n' "$AAB_CERTIFICATE_SHA256" > "$AAB_DIR/release.certificate.sha256"
          printf 'commit=%s\nbranch=%s\nbuild_id=%s\nSIGNED_BY=CODEMAGIC_ENVIRONMENT_GROUP\n' \
            "$(git rev-parse HEAD)" "${CM_BRANCH:-unknown}" "${CM_BUILD_ID:-unknown}" \
            > "$APK_DIR/build-provenance.txt"
          printf 'signing_mode=%s\ncertificate_sha256=%s\n' \
            "${SIGNING_MODE:-unknown}" "$CERTIFICATE_SHA256" >> "$APK_DIR/build-provenance.txt"
          printf 'apk_certificate_sha256=%s\naab_certificate_sha256=%s\n' \
            "$CERTIFICATE_SHA256" "$AAB_CERTIFICATE_SHA256" >> "$AAB_SUMMARY"
          cat "$APK_DIR/build-provenance.txt"
    artifacts:
      - native-android-app/app/build/outputs/apk/release/*.apk
      - native-android-app/app/build/outputs/apk/release/*.sha256
      - native-android-app/app/build/outputs/apk/release/*.certificates.txt
      - native-android-app/app/build/outputs/apk/release/release.certificate.sha256
      - native-android-app/app/build/outputs/apk/release/build-provenance.txt
      - native-android-app/app/build/outputs/bundle/release/*.aab
      - native-android-app/app/build/outputs/bundle/release/*.sha256
      - native-android-app/app/build/outputs/bundle/release/*.certificates.txt
      - native-android-app/app/build/outputs/bundle/release/release.certificate.sha256
      - native-android-app/app/build/outputs/bundle/release/release.aab.verification-summary.txt

  sentinel-d1-emulator-qualification:
    name: Sentinel D1 Android emulator qualification
    # Linux is required for the headless emulator; mac_mini_m2 is intentionally not used.
    # Codemagic execution requires a Linux image with KVM (/dev/kvm). If unavailable,
    # this workflow fails closed and the same scripts must be run on an external Linux
    # runner with hardware virtualization; that runner may incur separate billing.
    instance_type: linux_x2
    max_build_duration: 90
    environment:
      java: 17
    triggering:
      events: []
    scripts:
      - name: Verify emulator qualification source and host
        script: |
          set -eu
          set -o pipefail
          cd "$CM_BUILD_DIR"
          case "${CM_BRANCH:-}" in
            integration/sentinel-d1-cve-v5-20261025) ;;
            *) echo "BLOCKED: unexpected qualification branch"; exit 1 ;;
          esac
          BASE_COMMIT="373f2ea78c033e371db8b6776ba30b6ea9b59f89"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD || {
            echo "BLOCKED: source is not descended from the qualified base $BASE_COMMIT"
            exit 1
          }
          test "$(git rev-parse --is-inside-work-tree)" = true
          mkdir -p emulator-qualification
          printf 'source_commit=%s\nbranch=%s\nbuild_id=%s\nqualified_base=%s\n' \
            "$(git rev-parse HEAD)" "${CM_BRANCH:-unknown}" "${CM_BUILD_ID:-unknown}" "$BASE_COMMIT" \
            > emulator-qualification/source-provenance.txt
          for secret_name in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD KEYSTORE_BASE64 SENTINEL_PRODUCTION_KEYSTORE_B64; do
            if env | grep -q "^${secret_name}="; then
              echo "BLOCKED: signing binding $secret_name must not be present in emulator qualification"
              exit 1
            fi
          done
          mkdir -p emulator-qualification
          find native-android-app/app/src/androidTest -type f -name '*Test.kt' | sort \
            > emulator-qualification/androidTest-inventory.txt
          TEST_COUNT="$(wc -l < emulator-qualification/androidTest-inventory.txt | tr -d '[:space:]')"
          test "$TEST_COUNT" -eq 18 || {
            echo "BLOCKED: expected 18 androidTest sources, found $TEST_COUNT"
            exit 1
          }
          printf 'api_24=PREPARED_NOT_EXECUTED\napi_29=EXECUTION_TARGET\napi_36=PREPARED_NOT_EXECUTED\n' \
            > emulator-qualification/api-matrix.txt
          printf 'linux_instance=linux_x2\nkvm_required=/dev/kvm\nexternal_runner=required_if_kvm_unavailable\n' \
            > emulator-qualification/emulator-host-requirements.txt
          test "$(uname -s)" = Linux || { echo "BLOCKED: emulator qualification requires Linux"; exit 1; }
          test -e /dev/kvm || {
            echo "BLOCKED: /dev/kvm is unavailable; no hardware-accelerated emulator can be qualified"
            exit 1
          }
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "BLOCKED: /dev/kvm is not accessible by the build user"
            exit 1
          }
          echo "CHECK emulator_host=LINUX_KVM_AVAILABLE"
      - name: Install Android API 29 emulator toolchain
        script: |
          set -eu
          set -o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"
          test -x "$SDKMANAGER" || { echo "BLOCKED: sdkmanager missing"; exit 1; }
          test -x "$AVDMANAGER" || { echo "BLOCKED: avdmanager missing"; exit 1; }
          test -x "$EMULATOR" || { echo "BLOCKED: emulator binary missing"; exit 1; }
          test -x "$ADB" || { echo "BLOCKED: adb missing"; exit 1; }
          set +e
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          LICENSE_STATUS="${PIPESTATUS[1]}"
          set -e
          test "$LICENSE_STATUS" -eq 0 || { echo "BLOCKED: Android SDK licenses could not be accepted"; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" "platforms;android-29" "build-tools;36.0.0" \
            "emulator" "system-images;android-29;default;x86_64"
          AVD_HOME="${CM_BUILD_DIR}/.android-avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd --force --name sentinel-api29 \
            --package "system-images;android-29;default;x86_64" --device "pixel_2"
          printf 'sdk_root=%s\navd=sentinel-api29\napi=29\nabi=x86_64\n' "$SDK_ROOT" \
            > "$CM_BUILD_DIR/emulator-qualification/toolchain.txt"
      - name: Build debug APK and AndroidTest APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/native-android-app"
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
          APK_DIR="app/build/outputs/apk/debug"
          TEST_DIR="app/build/outputs/apk/androidTest/debug"
          set -- "$APK_DIR"/*.apk
          test "$#" -eq 1 && test -s "$1" || { echo "BLOCKED: debug APK missing"; exit 1; }
          set -- "$TEST_DIR"/*.apk
          test "$#" -eq 1 && test -s "$1" || { echo "BLOCKED: AndroidTest APK missing"; exit 1; }
          sha256sum "$APK_DIR"/*.apk "$TEST_DIR"/*.apk > "$CM_BUILD_DIR/emulator-qualification/apk-sha256.txt"
      - name: Run API 29 emulator instrumentation and collect evidence
        script: |
          set -eu
          set -o pipefail
          cd "$CM_BUILD_DIR"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/opt/android-sdk}}"
          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          APK_DIR="native-android-app/app/build/outputs/apk/debug"
          TEST_DIR="native-android-app/app/build/outputs/apk/androidTest/debug"
          QUAL_DIR="$CM_BUILD_DIR/emulator-qualification"
          export ANDROID_AVD_HOME="$CM_BUILD_DIR/.android-avd"
          EMULATOR_PID=""
          cleanup_emulator() {
            EXIT_STATUS=$?
            set +e
            if test -n "${ADB:-}"; then
              "$ADB" logcat -d -v threadtime > "$QUAL_DIR/logcat.txt"
              "$ADB" exec-out screencap -p > "$QUAL_DIR/final-screen.png"
              "$ADB" emu kill >/dev/null 2>&1
            fi
            if test -n "${EMULATOR_PID:-}"; then
              kill "$EMULATOR_PID" >/dev/null 2>&1
              wait "$EMULATOR_PID" >/dev/null 2>&1
            fi
            exit "$EXIT_STATUS"
          }
          trap cleanup_emulator EXIT
          test -x "$ADB" || { echo "BLOCKED: adb missing"; exit 1; }
          test -x "$EMULATOR" || { echo "BLOCKED: emulator binary missing"; exit 1; }
          "$ADB" start-server
          "$EMULATOR" -avd sentinel-api29 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect \
            > "$QUAL_DIR/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          wait_for_emulator_ready() {
            READY=0
            for attempt in $(seq 1 180); do
              STATE="$("$ADB" get-state 2>/dev/null | tr -d '\r\n' || true)"
              BOOT="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n' || true)"
              if test "$STATE" = device && test "$BOOT" = 1; then
                READY=1
                break
              fi
              sleep 1
            done
            test "$READY" -eq 1 || {
              echo "BLOCKED: emulator is not ADB device/sys.boot_completed=1"
              "$ADB" devices -l || true
              tail -n 80 "$QUAL_DIR/emulator.log" || true
              exit 1
            }
          }
          wait_for_emulator_ready
          printf 'adb_state=%s\nsys.boot_completed=%s\n' "$STATE" "$BOOT" > "$QUAL_DIR/adb-readiness.txt"
          "$ADB" shell getprop ro.build.version.sdk > "$QUAL_DIR/emulator-api.txt"
          echo "CHECK emulator_adb_before_install=DEVICE"
          echo "CHECK sys.boot_completed_before_install=1"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          TEST_APK="$(find "$TEST_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -n "$TEST_APK" || { echo "BLOCKED: debug APK or AndroidTest APK missing"; exit 1; }
          "$ADB" install -r -g "$APK"
          "$ADB" install -r -g "$TEST_APK"
          echo "CHECK apk_install=PASS"
          wait_for_emulator_ready
          echo "CHECK emulator_adb_before_instrumentation=DEVICE"
          echo "CHECK sys.boot_completed_before_instrumentation=1"
          cd "$CM_BUILD_DIR/native-android-app"
          set +e
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --console=plain \
            2>&1 | tee "$QUAL_DIR/connected-debug-android-test.log"
          TEST_STATUS="${PIPESTATUS[0]}"
          set -e
          RESULT_DIR="app/build/outputs/androidTest-results/connected"
          REPORT_DIR="app/build/reports/androidTests/connected"
          XML_COUNT="$(find "$RESULT_DIR" "$REPORT_DIR" -type f \( -name '*.xml' -o -name '*.html' \) 2>/dev/null | wc -l | tr -d '[:space:]')"
          test "$XML_COUNT" -gt 0 || { echo "BLOCKED: missing AndroidTest XML/HTML evidence"; exit 1; }
          python3 - "$RESULT_DIR" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob(sys.argv[1] + '/**/*.xml', recursive=True)
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.get('tests', '0'))
              failures += int(root.get('failures', '0'))
              errors += int(root.get('errors', '0'))
              skipped += int(root.get('skipped', '0'))
          print(f'AndroidTest XML: {len(files)} files, {tests} tests, {failures} failures, {errors} errors, {skipped} skipped')
          if not files or failures or errors:
              raise SystemExit('FAIL: AndroidTest XML reports contain failures or errors')
          PY
          printf 'instrumentation_reports=%s\nsource_commit=%s\n' "$XML_COUNT" "$(git rev-parse HEAD)" \
            > "$QUAL_DIR/qualification-verdict.txt"
          cat > "$QUAL_DIR/limitations.txt" <<'EOF'
          API 29 emulator qualification does not prove carrier calls, operator SMS/MMS,
          physical BLE radio mesh behavior, WireGuard tunnel routing, SIM/multi-SIM behavior,
          or Galaxy S24+ vendor behavior. These require later physical/device or dedicated
          network qualification. Emulator PASS must not be promoted to physical PASS.
          EOF
          test "$TEST_STATUS" -eq 0 || { echo "FAIL: AndroidX instrumentation returned $TEST_STATUS"; exit "$TEST_STATUS"; }
          echo "CHECK android_instrumentation=PASS"
          echo "EMULATOR_QUALIFICATION=PASS_API29_ONLY"
          echo "PHYSICAL_DEVICE_QUALIFICATION=NOT_TESTED"
    artifacts:
      - emulator-qualification/**
      - native-android-app/app/build/outputs/apk/debug/*.apk
      - native-android-app/app/build/outputs/apk/androidTest/debug/*.apk
      - native-android-app/app/build/outputs/androidTest-results/**
      - native-android-app/app/build/reports/androidTests/**
      - native-android-app/app/build/test-results/**
