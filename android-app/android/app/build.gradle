apply plugin: "com.android.application"
apply plugin: "kotlin-android"

def enableProguardInReleaseBuilds = true

def hasInjectedSigning = project.hasProperty('android.injected.signing.store.file') &&
        project.hasProperty('android.injected.signing.store.password') &&
        project.hasProperty('android.injected.signing.key.alias') &&
        project.hasProperty('android.injected.signing.key.password')

def hasEnvironmentSigning = System.getenv('KEYSTORE_FILE') != null &&
        System.getenv('KEYSTORE_PASSWORD') != null &&
        System.getenv('KEY_ALIAS') != null &&
        System.getenv('KEY_PASSWORD') != null

def hasReleaseSigning = hasInjectedSigning || hasEnvironmentSigning

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.sentinel"
    defaultConfig {
        applicationId "com.sentinel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "distribution"

    productFlavors {
        institutional {
            dimension "distribution"
            applicationId "com.sentinel.quantum.institutional"
            versionNameSuffix "-institutional"
            buildConfigField "boolean", "ALLOW_CALL_LOG", "true"
            buildConfigField "boolean", "IS_INSTITUTIONAL_BUILD", "true"
        }

        public {
            dimension "distribution"
            applicationId "com.sentinel.quantum.public"
            versionNameSuffix "-public"
            buildConfigField "boolean", "ALLOW_CALL_LOG", "false"
            buildConfigField "boolean", "IS_INSTITUTIONAL_BUILD", "false"
        }
    }

    signingConfigs {
        release {
            if (hasInjectedSigning) {
                storeFile file(project.property('android.injected.signing.store.file'))
                storePassword project.property('android.injected.signing.store.password')
                keyAlias project.property('android.injected.signing.key.alias')
                keyPassword project.property('android.injected.signing.key.password')
            } else if (hasEnvironmentSigning) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Android Gradle Plugin supplies the generated debug keystore.
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.webkit:webkit:1.9.0"
    implementation "com.google.android.material:material:1.11.0"

    // WireGuard owns the Android VpnService and tunnel cryptography.
    implementation "com.wireguard.android:tunnel:1.0.20260102"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
}
