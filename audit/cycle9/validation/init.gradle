// Explicit qualification build only. Never applied by the normal production build.
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.androidComponents.finalizeDsl { dsl ->
            dsl.defaultConfig.applicationId = 'com.sentinel.quantum.aivalidation'
            dsl.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        }
        def overlay = new File(project.rootDir, '../audit/cycle9/validation/AndroidManifest.xml')
        project.android.sourceSets.getByName('debug').manifest.srcFile(overlay)
    }
}
